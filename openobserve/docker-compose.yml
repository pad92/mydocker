x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  # Gives the data and backup directories to the OpenObserve user before each
  # start. Docker creates a missing bind-mount source as root, and an earlier root
  # run leaves root-owned files; both make OpenObserve panic with "Permission denied".
  openobserve-init:
    image: busybox:1.37
    container_name: openobserve-init
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - sh
      - -c
      - find /data /backup \( ! -user "$$PUID" -o ! -group "$$PGID" \) -exec chown -h "$$PUID:$$PGID" {} +
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
    volumes:
      - ${OPENOBSERVE_DATA_DIR:?Set OPENOBSERVE_DATA_DIR}:/data
      - ${OPENOBSERVE_BACKUP_DIR:?Set OPENOBSERVE_BACKUP_DIR}:/backup
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
  openobserve:
    # OSS edition (AGPL-3.0). The o2cr.ai "openobserve-enterprise" image from the
    # upstream quickstart is under a commercial license.
    image: public.ecr.aws/zinclabs/openobserve:${OPENOBSERVE_VERSION:-v1.1.2}
    container_name: openobserve
    restart: unless-stopped
    # The image runs as root by default; openobserve-init gives /data to this user.
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      openobserve-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      ZO_DATA_DIR: /data
      # Only read on the first start, when the root user does not exist yet.
      ZO_ROOT_USER_EMAIL: "${ZO_ROOT_USER_EMAIL:?Set ZO_ROOT_USER_EMAIL}"
      ZO_ROOT_USER_PASSWORD: "${ZO_ROOT_USER_PASSWORD:?Set ZO_ROOT_USER_PASSWORD}"
      ZO_WEB_URL: "https://${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}"
      # Served over HTTPS by Traefik only, so the auth cookie must never travel in clear.
      ZO_COOKIE_SECURE_ONLY: "true"
      # Upstream default is true: anonymous usage data is sent to the vendor.
      ZO_TELEMETRY: "false"
      # Upstream default is 3650 days, which can fill the data disk.
      ZO_COMPACT_DATA_RETENTION_DAYS: "${ZO_COMPACT_DATA_RETENTION_DAYS:-30}"
    volumes:
      - ${OPENOBSERVE_DATA_DIR:?Set OPENOBSERVE_DATA_DIR}:/data
    networks:
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.openobserve.loadbalancer.server.port: "5080"

      traefik.http.routers.openobserve_http.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`)"
      traefik.http.routers.openobserve_http.entrypoints: web
      traefik.http.routers.openobserve_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.openobserve.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`)"
      traefik.http.routers.openobserve.entrypoints: "websecure"
      traefik.http.routers.openobserve.tls: "true"
      traefik.http.routers.openobserve.tls.certresolver: "stepca"
      # Web UI and query API behind Authentik forward auth (management stack).
      # authentik@docker comes first: it fails closed when Authentik is down.
      traefik.http.routers.openobserve.middlewares: "authentik@docker"
      # Ingestion bypass: POST to the ingestion endpoints only (JSON, multi,
      # bulk, OTLP/HTTP, Prometheus remote write). They keep OpenObserve
      # Basic auth; senders cannot follow a browser login. Searches, the UI
      # and every GET stay behind forward auth. $$ is a literal $ in Compose.
      traefik.http.routers.openobserve_ingest.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`) && Method(`POST`) && PathRegexp(`^/api/[^/]+/([^/]+/_(json|multi)|_bulk|v1/(logs|metrics|traces)|prometheus/api/v1/write)$$`)"
      traefik.http.routers.openobserve_ingest.entrypoints: "websecure"
      traefik.http.routers.openobserve_ingest.tls: "true"
      traefik.http.routers.openobserve_ingest.tls.certresolver: "stepca"
      traefik.http.routers.openobserve_ingest.service: "openobserve"
      # Health check bypass: GET/HEAD on /healthz only, which returns
      # {"status":"ok"} without auth. Uptime Kuma cannot follow a browser
      # login, and a 302 to Authentik would only prove Authentik is up.
      traefik.http.routers.openobserve_health.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`) && (Method(`GET`) || Method(`HEAD`)) && Path(`/healthz`)"
      traefik.http.routers.openobserve_health.entrypoints: "websecure"
      traefik.http.routers.openobserve_health.tls: "true"
      traefik.http.routers.openobserve_health.tls.certresolver: "stepca"
      traefik.http.routers.openobserve_health.service: "openobserve"
      # MCP bypass: the OpenObserve MCP server (Streamable HTTP: POST, GET for
      # the event stream, DELETE to end a session) on /api/<org>/mcp only.
      # MCP clients send a static Basic auth header and cannot follow a
      # browser login; OpenObserve checks that header itself. $$ is a literal $.
      traefik.http.routers.openobserve_mcp.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`) && (Method(`POST`) || Method(`GET`) || Method(`DELETE`)) && PathRegexp(`^/api/[^/]+/mcp$$`)"
      traefik.http.routers.openobserve_mcp.entrypoints: "websecure"
      traefik.http.routers.openobserve_mcp.tls: "true"
      traefik.http.routers.openobserve_mcp.tls.certresolver: "stepca"
      traefik.http.routers.openobserve_mcp.service: "openobserve"

    logging: *default-logging
  # Online copy of the SQLite metadata (users, alerts, dashboards, functions,
  # list of Parquet files) to OPENOBSERVE_BACKUP_DIR, with retention. Script in
  # the backup_script entry under configs: at the end of this file.
  openobserve-backup:
    image: python:3.13-alpine3.22
    container_name: openobserve-backup
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    network_mode: none
    # No read_only: true. Compose refuses to inject an inline (content:) config
    # into a read-only service ("`file` is the sole supported option"), and a
    # file: config would hit the Portainer relative-path issue described below.
    depends_on:
      openobserve-init:
        condition: service_completed_successfully
    command: ["python", "/opt/openobserve-backup.py"]
    environment:
      BACKUP_INTERVAL_HOURS: "${OPENOBSERVE_BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_KEEP_DAYS: "${OPENOBSERVE_BACKUP_KEEP_DAYS:-14}"
    configs:
      - source: backup_script
        target: /opt/openobserve-backup.py
    volumes:
      # Read-write: SQLite writes the -shm file of a WAL database even to read it.
      - ${OPENOBSERVE_DATA_DIR:?Set OPENOBSERVE_DATA_DIR}:/data
      - ${OPENOBSERVE_BACKUP_DIR:?Set OPENOBSERVE_BACKUP_DIR}:/backup
    healthcheck:
      # Unhealthy when the newest backup is older than twice the interval.
      test: ["CMD", "python", "/opt/openobserve-backup.py", "--check"]
      interval: 5m
      timeout: 30s
      start_period: 10m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
  # Syslog receiver (UDP) forwarding to OpenObserve over HTTP. Pipeline in the
  # vector_config entry under configs: at the end of this file.
  openobserve-syslog:
    image: timberio/vector:${VECTOR_VERSION:-0.61.0}-distroless-libc
    container_name: openobserve-syslog
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    tmpfs:
      - /var/lib/vector
    ports:
      - "${OPENOBSERVE_SYSLOG_PORT:-514}:5514/udp"
    secrets:
      - openobserve_ingest_user
      - openobserve_ingest_password
    # Inline config instead of a ./vector.yaml bind mount: Portainer resolves
    # relative paths on its own disk, so Docker created an empty directory on
    # the host and failed with "mkdirat etc/vector/vector.yaml: file exists".
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml
    networks:
      - traefik_gateway
    depends_on:
      - openobserve
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
networks:
  traefik_gateway:
    external: true
secrets:
  openobserve_ingest_user:
    environment: OPENOBSERVE_INGEST_USER
  openobserve_ingest_password:
    environment: OPENOBSERVE_INGEST_PASSWORD
configs:
  # Backup script of openobserve-backup. Compose interpolates $ here too: the
  # script must not contain one.
  backup_script:
    content: |
      """Online backup of the OpenObserve SQLite metadata, with retention.

      Without argument: loop, one backup every BACKUP_INTERVAL_HOURS (at start if
      the newest one is older), then deletion of the backups older than
      BACKUP_KEEP_DAYS. --once: one backup now. --check: healthcheck, fails when
      the newest backup is older than twice the interval.
      """
      import datetime
      import gzip
      import os
      import pathlib
      import shutil
      import sqlite3
      import sys
      import time

      SOURCE = pathlib.Path(os.environ.get("BACKUP_SOURCE", "/data/db/metadata.sqlite"))
      TARGET_DIR = pathlib.Path(os.environ.get("BACKUP_DIR", "/backup"))
      PREFIX = "metadata-"
      SUFFIX = ".sqlite.gz"
      RETRY_SECONDS = 3600


      def log(level, message):
          now = datetime.datetime.now(datetime.timezone.utc)
          print(f"{now:%Y-%m-%dT%H:%M:%SZ} {level} {message}", flush=True)


      def positive_setting(name):
          try:
              value = float(os.environ[name])
          except (KeyError, ValueError):
              value = 0
          if value <= 0:
              log("ERROR", f"{name} must be a positive number")
              sys.exit(2)
          return value


      def existing_backups():
          """Backups made by this script, oldest first."""
          return sorted(TARGET_DIR.glob(PREFIX + "*" + SUFFIX), key=lambda p: p.stat().st_mtime)


      def backup_once():
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          final = TARGET_DIR / f"{PREFIX}{stamp}{SUFFIX}"
          tmp_db = TARGET_DIR / f".{PREFIX}{stamp}.sqlite.tmp"
          tmp_gz = TARGET_DIR / f".{PREFIX}{stamp}{SUFFIX}.tmp"
          try:
              # mode=ro: never creates the source when it is missing.
              source = sqlite3.connect(f"file:{SOURCE}?mode=ro", uri=True, timeout=60)
              try:
                  copy = sqlite3.connect(tmp_db)
                  try:
                      # SQLite online backup API: a consistent snapshot while
                      # OpenObserve keeps writing.
                      source.backup(copy)
                      result = copy.execute("PRAGMA integrity_check").fetchone()[0]
                  finally:
                      copy.close()
              finally:
                  source.close()
              if result != "ok":
                  raise RuntimeError(f"integrity_check of the copy failed: {result}")
              with open(tmp_db, "rb") as raw, gzip.open(tmp_gz, "wb") as packed:
                  shutil.copyfileobj(raw, packed)
              os.replace(tmp_gz, final)
          finally:
              tmp_db.unlink(missing_ok=True)
              tmp_gz.unlink(missing_ok=True)
          log("INFO", f"backup written: {final} ({final.stat().st_size} bytes)")
          return final


      def prune(keep_seconds, newest):
          """Deletes old backups, only after a successful one, never the newest."""
          cutoff = time.time() - keep_seconds
          for path in existing_backups():
              if path != newest and path.stat().st_mtime < cutoff:
                  path.unlink()
                  log("INFO", f"backup deleted (retention): {path}")


      def seconds_until_due(interval_seconds):
          backups = existing_backups()
          if not backups:
              return 0
          return max(0, backups[-1].stat().st_mtime + interval_seconds - time.time())


      def main():
          interval_seconds = positive_setting("BACKUP_INTERVAL_HOURS") * 3600
          keep_seconds = positive_setting("BACKUP_KEEP_DAYS") * 86400
          mode = sys.argv[1] if len(sys.argv) > 1 else ""
          if mode == "--check":
              backups = existing_backups()
              fresh = bool(backups) and time.time() - backups[-1].stat().st_mtime < 2 * interval_seconds
              sys.exit(0 if fresh else 1)
          if mode == "--once":
              prune(keep_seconds, backup_once())
              return
          log("INFO", f"backing up {SOURCE} to {TARGET_DIR} every {interval_seconds / 3600:g} h")
          while True:
              wait = seconds_until_due(interval_seconds)
              if wait > 0:
                  time.sleep(wait)
                  continue
              try:
                  prune(keep_seconds, backup_once())
              except Exception as error:  # Logged and retried: the loop must not die.
                  log("ERROR", f"backup failed, retry in {RETRY_SECONDS} s: {error!r}")
                  time.sleep(RETRY_SECONDS)


      if __name__ == "__main__":
          main()
  # Vector pipeline. Compose interpolates $ here: write $$ for a literal $.
  vector_config:
    content: |
      # Syslog relay: OpenObserve removed its own syslog listener in v0.16.0.
      # Receives UDP syslog (UniFi, network gear) and forwards it to OpenObserve.
      data_dir: /var/lib/vector

      # Vector does not expand $${VAR} by default. Credentials come from the Compose
      # secrets mounted in /run/secrets (see docker-compose.yml).
      secret:
        compose:
          type: directory
          path: /run/secrets
          remove_trailing_whitespace: true

      sources:
        syslog_udp:
          # Raw socket instead of the "syslog" source, so messages that are not valid
          # RFC 3164/5424 (CEF, vendor formats) are kept instead of being dropped.
          type: socket
          mode: udp
          address: 0.0.0.0:5514
          host_key: source_ip
          port_key: source_port

      transforms:
        parse_syslog:
          type: remap
          inputs: [syslog_udp]
          source: |
            parsed, err = parse_syslog(string!(.message))
            if err == null {
              # Device clocks drift and RFC 3164 has no year, while OpenObserve rejects
              # old timestamps: keep the receive time as _timestamp.
              parsed.syslog_timestamp = del(parsed.timestamp)
              . = merge(., parsed)
            } else {
              .parse_error = err
            }
            # UniFi CEF events. parse_syslog reads "CEF" as the appname and leaves
            # "0|Ubiquiti|..." in message, so the "CEF:" prefix is put back before
            # parsing. message stays untouched: the alerts match on it.
            raw = string(.message) ?? ""
            cef_input = if .appname == "CEF" { "CEF:" + raw } else { raw }
            if contains(cef_input, "CEF:") {
              cef, cef_err = parse_cef(cef_input)
              if cef_err == null {
                .cef_version = del(cef.cefVersion)
                .cef_vendor = del(cef.deviceVendor)
                .cef_product = del(cef.deviceProduct)
                .cef_product_version = del(cef.deviceVersion)
                .cef_signature_id = del(cef.deviceEventClassId)
                .cef_name = del(cef.name)
                # Numeric (0-10) for UniFi. CEF also allows Low/Medium/High/Very-High:
                # kept apart so that cef_severity always has the same type.
                cef_severity = del(cef.severity)
                .cef_severity = to_int(cef_severity) ?? null
                if .cef_severity == null {
                  .cef_severity_label = cef_severity
                }
                # Extension keys (UNIFIcategory, src, msg...) become top-level
                # fields. An existing field of the event wins over a key of the same name.
                . = merge(cef, .)
              } else {
                .cef_parse_error = cef_err
              }
            }
            # UniFi gateway firewall logs (iptables LOG lines with the rule as prefix):
            # [LAN_WAN-D-40001] DESCR="block-dns" IN=br0 OUT=eth6 SRC=... PROTO=UDP DPT=53 LEN=40
            # Fields get a fw_ prefix: they never collide with the CEF src/dst/proto.
            # message stays untouched.
            fw, fw_err = parse_regex(raw, r'^\[(?P<rule>(?P<ruleset>[A-Za-z0-9_]+)-(?P<code>[A-Z])-(?P<rule_id>\d+))\]\s+(?P<fields>.*SRC=.*)$$')
            if fw_err == null {
              # The quoted original packet of ICMP errors ("[SRC=... ]") would repeat
              # the keys of the packet itself: it is dropped from the fields.
              fields = replace(string!(fw.fields), r'\s*\[[^\]]*\]', "")
              # An empty value ("OUT= MAC=...") would make parse_key_value read the
              # next pair as its value: it is written as "" first.
              fields = replace(fields, "= ", "=\"\" ")
              if ends_with(fields, "=") {
                fields = fields + "\"\""
              }
              # LEN appears twice: IP length before PROTO=, layer 4 length after it.
              parts = split(fields, " PROTO=", limit: 2)
              ip_kv = parse_key_value(string!(parts[0]), key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true) ?? {}
              l4_kv = {}
              if length(parts) == 2 {
                l4_kv = parse_key_value("PROTO=" + string!(parts[1]), key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true) ?? {}
                if exists(l4_kv.LEN) {
                  l4_kv.L4_LEN = del(l4_kv.LEN)
                }
              }
              kv = map_keys(merge(ip_kv, l4_kv)) -> |key| { "fw_" + downcase(key) }
              kv.fw_rule = fw.rule
              kv.fw_ruleset = fw.ruleset
              kv.fw_rule_id = to_int(fw.rule_id) ?? fw.rule_id
              kv.fw_action_code = fw.code
              kv.fw_action = if fw.code == "A" { "accept" } else if fw.code == "D" { "drop" } else if fw.code == "R" { "reject" } else { fw.code }
              # Numbers that are queried by range or summed; the rest stays a string.
              for_each(["fw_spt", "fw_dpt", "fw_len", "fw_l4_len", "fw_ttl", "fw_hoplimit"]) -> |_index, name| {
                value = get(kv, [name]) ?? null
                if is_string(value) {
                  kv = set!(kv, [name], to_int(value) ?? value)
                }
              }
              . = merge(kv, .)
            }
            # host_name (FQDN, as in the streams of the hosts) and device_vendor
            # from the OPENOBSERVE_SYSLOG_SENDERS table, by source IP. A sender
            # not listed is named by its syslog hostname, else by its IP.
            senders = object(parse_json(s'${OPENOBSERVE_SYSLOG_SENDERS:-}') ?? {}) ?? {}
            sender = object(get(senders, [to_string(.source_ip) ?? ""]) ?? {}) ?? {}
            .host_name = sender.name
            if !is_string(.host_name) {
              hostname = to_string(.hostname) ?? ""
              .host_name = if hostname != "" && hostname != "-" { downcase(hostname) } else { .source_ip }
            }
            if is_string(sender.vendor) {
              .device_vendor = sender.vendor
            }
            ._timestamp = del(.timestamp)
            del(.source_type)

        # Gateway firewall logs go to their own stream: they outnumber the rest of
        # syslog and have their own fields. Everything else stays in syslog.
        split_streams:
          type: route
          inputs: [parse_syslog]
          route:
            firewall: exists(.fw_rule)

      sinks:
        openobserve:
          type: http
          inputs: [split_streams._unmatched]
          uri: http://openobserve:5080/api/default/syslog/_json
          method: post
          auth:
            strategy: basic
            user: SECRET[compose.openobserve_ingest_user]
            password: SECRET[compose.openobserve_ingest_password]
          encoding:
            codec: json
            timestamp_format: rfc3339
          batch:
            max_events: 1000
            timeout_secs: 5
          # OpenObserve may still be starting; events are retried, not lost.
          healthcheck:
            enabled: false
        openobserve_firewall:
          type: http
          inputs: [split_streams.firewall]
          uri: http://openobserve:5080/api/default/firewall/_json
          method: post
          auth:
            strategy: basic
            user: SECRET[compose.openobserve_ingest_user]
            password: SECRET[compose.openobserve_ingest_password]
          encoding:
            codec: json
            timestamp_format: rfc3339
          batch:
            max_events: 1000
            timeout_secs: 5
          # OpenObserve may still be starting; events are retried, not lost.
          healthcheck:
            enabled: false
