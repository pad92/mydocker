x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  # Gives the data directory to the OpenObserve user before each start. Docker
  # creates a missing bind-mount source as root, and an earlier root run leaves
  # root-owned files; both make OpenObserve panic with "Permission denied".
  openobserve-init:
    image: busybox:1.37
    container_name: openobserve-init
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - sh
      - -c
      - find /data \( ! -user "$$PUID" -o ! -group "$$PGID" \) -exec chown -h "$$PUID:$$PGID" {} +
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
    volumes:
      - ${OPENOBSERVE_DATA_DIR:?Set OPENOBSERVE_DATA_DIR}:/data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
  openobserve:
    # OSS edition (AGPL-3.0). The o2cr.ai "openobserve-enterprise" image from the
    # upstream quickstart is under a commercial license.
    # v1.1.2 is not published on public.ecr.aws yet (checked 2026-11-07).
    image: public.ecr.aws/zinclabs/openobserve:${OPENOBSERVE_VERSION:-v1.1.1}
    container_name: openobserve
    restart: unless-stopped
    # The image runs as root by default; openobserve-init gives /data to this user.
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      openobserve-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      ZO_DATA_DIR: /data
      # Only read on the first start, when the root user does not exist yet.
      ZO_ROOT_USER_EMAIL: "${ZO_ROOT_USER_EMAIL:?Set ZO_ROOT_USER_EMAIL}"
      ZO_ROOT_USER_PASSWORD: "${ZO_ROOT_USER_PASSWORD:?Set ZO_ROOT_USER_PASSWORD}"
      ZO_WEB_URL: "https://${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}"
      # Served over HTTPS by Traefik only, so the auth cookie must never travel in clear.
      ZO_COOKIE_SECURE_ONLY: "true"
      # Upstream default is true: anonymous usage data is sent to the vendor.
      ZO_TELEMETRY: "false"
      # Upstream default is 3650 days, which can fill the data disk.
      ZO_COMPACT_DATA_RETENTION_DAYS: "${ZO_COMPACT_DATA_RETENTION_DAYS:-30}"
    volumes:
      - ${OPENOBSERVE_DATA_DIR:?Set OPENOBSERVE_DATA_DIR}:/data
    networks:
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.openobserve.loadbalancer.server.port: "5080"

      traefik.http.routers.openobserve_http.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`)"
      traefik.http.routers.openobserve_http.entrypoints: web
      traefik.http.routers.openobserve_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.openobserve.rule: "Host(`${OPENOBSERVE_DOMAIN:?Set OPENOBSERVE_DOMAIN}`)"
      traefik.http.routers.openobserve.entrypoints: "websecure"
      traefik.http.routers.openobserve.tls: "true"
      traefik.http.routers.openobserve.tls.certresolver: "stepca"

    logging: *default-logging
networks:
  traefik_gateway:
    external: true
