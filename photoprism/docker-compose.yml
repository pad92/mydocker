x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  photoprism:
    image: photoprism/photoprism:latest
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      - mariadb
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ## Before you start the service, please check the following config options (and change them as needed):
    ## https://docs.photoprism.app/getting-started/config-options/
    environment:
      PHOTOPRISM_ADMIN_USER: "${PHOTOPRISM_ADMIN_USER}" # admin login username
      PHOTOPRISM_ADMIN_PASSWORD: "${PHOTOPRISM_ADMIN_PASSWORD}"          # initial admin password (8-72 characters)
      PHOTOPRISM_AUTH_MODE: "${PHOTOPRISM_AUTH_MODE}" # authentication mode (public, password)
      PHOTOPRISM_SITE_URL: "${PHOTOPRISM_SITE_URL}" # server URL in the format "http(s)://domain.name(:port)/(path)"
      PHOTOPRISM_DISABLE_TLS: "${PHOTOPRISM_DISABLE_TLS}" # disables HTTPS/TLS even if the site URL starts with https:// and a certificate is available
      PHOTOPRISM_DEFAULT_TLS: "${PHOTOPRISM_DEFAULT_TLS}" # defaults to a self-signed HTTPS/TLS certificate if no other certificate is available
      PHOTOPRISM_ORIGINALS_LIMIT: "${PHOTOPRISM_ORIGINALS_LIMIT}" # file size limit for originals in MB (increase for high-res video)
      PHOTOPRISM_HTTP_COMPRESSION: "${PHOTOPRISM_HTTP_COMPRESSION}" # improves transfer speed and bandwidth utilization (none or gzip)
      PHOTOPRISM_LOG_LEVEL: "${PHOTOPRISM_LOG_LEVEL}" # log level: trace, debug, info, warning, error, fatal, or panic
      PHOTOPRISM_READONLY: "${PHOTOPRISM_READONLY}" # do not modify originals directory (reduced functionality)
      PHOTOPRISM_EXPERIMENTAL: "${PHOTOPRISM_EXPERIMENTAL}" # enables experimental features
      PHOTOPRISM_DISABLE_CHOWN: "${PHOTOPRISM_DISABLE_CHOWN}" # disables updating storage permissions via chmod and chown on startup
      PHOTOPRISM_DISABLE_WEBDAV: "${PHOTOPRISM_DISABLE_WEBDAV}" # disables built-in WebDAV server
      PHOTOPRISM_DISABLE_SETTINGS: "${PHOTOPRISM_DISABLE_SETTINGS}" # disables settings UI and API
      PHOTOPRISM_DISABLE_TENSORFLOW: "${PHOTOPRISM_DISABLE_TENSORFLOW}" # disables all features depending on TensorFlow
      PHOTOPRISM_DISABLE_FACES: "${PHOTOPRISM_DISABLE_FACES}" # disables face detection and recognition (requires TensorFlow)
      PHOTOPRISM_DISABLE_CLASSIFICATION: "${PHOTOPRISM_DISABLE_CLASSIFICATION}" # disables image classification (requires TensorFlow)
      PHOTOPRISM_DISABLE_VECTORS: "${PHOTOPRISM_DISABLE_VECTORS}" # disables vector graphics support
      PHOTOPRISM_DISABLE_RAW: "${PHOTOPRISM_DISABLE_RAW}" # disables indexing and conversion of RAW images
      PHOTOPRISM_RAW_PRESETS: "${PHOTOPRISM_RAW_PRESETS}" # enables applying user presets when converting RAW images (reduces performance)
      PHOTOPRISM_SIDECAR_YAML: "${PHOTOPRISM_SIDECAR_YAML}" # creates YAML sidecar files to back up picture metadata
      PHOTOPRISM_BACKUP_ALBUMS: "${PHOTOPRISM_BACKUP_ALBUMS}" # creates YAML files to back up album metadata
      PHOTOPRISM_BACKUP_DATABASE: "${PHOTOPRISM_BACKUP_DATABASE}" # creates regular backups based on the configured schedule
      PHOTOPRISM_BACKUP_SCHEDULE: "${PHOTOPRISM_BACKUP_SCHEDULE}" # backup SCHEDULE in cron format (e.g. "0 12 * * *" for daily at noon) or at a random time (daily, weekly)
      PHOTOPRISM_INDEX_SCHEDULE: ""                  # indexing SCHEDULE in cron format (e.g. "@every 3h" for every 3 hours; "" to disable)
      PHOTOPRISM_AUTO_INDEX: "${PHOTOPRISM_AUTO_INDEX}" # delay before automatically indexing files in SECONDS when uploading via WebDAV (-1 to disable)
      PHOTOPRISM_AUTO_IMPORT: "${PHOTOPRISM_AUTO_IMPORT}" # delay before automatically importing files in SECONDS when uploading via WebDAV (-1 to disable)
      PHOTOPRISM_DETECT_NSFW: "${PHOTOPRISM_DETECT_NSFW}" # automatically flags photos as private that MAY be offensive (requires TensorFlow)
      PHOTOPRISM_UPLOAD_NSFW: "${PHOTOPRISM_UPLOAD_NSFW}" # allows uploads that MAY be offensive (no effect without TensorFlow)
      # PHOTOPRISM_DATABASE_DRIVER: "sqlite"         # SQLite is an embedded database that does not require a separate database server
      PHOTOPRISM_DATABASE_DRIVER: "${PHOTOPRISM_DATABASE_DRIVER}" # MariaDB 10.5.12+ (MySQL successor) offers significantly better performance compared to SQLite
      PHOTOPRISM_DATABASE_SERVER: "${PHOTOPRISM_DATABASE_SERVER}" # MariaDB database server (hostname:port)
      PHOTOPRISM_DATABASE_NAME: "${PHOTOPRISM_DATABASE_NAME}" # MariaDB database schema name
      PHOTOPRISM_DATABASE_USER: "${PHOTOPRISM_DATABASE_USER}" # MariaDB database user name
      PHOTOPRISM_DATABASE_PASSWORD: "${PHOTOPRISM_DATABASE_PASSWORD}"       # MariaDB database user password
      PHOTOPRISM_SITE_CAPTION: "${PHOTOPRISM_SITE_CAPTION}"
      PHOTOPRISM_SITE_DESCRIPTION: ""                # meta site description
      PHOTOPRISM_SITE_AUTHOR: ""                     # meta site author
      ## Video Transcoding (https://docs.photoprism.app/getting-started/advanced/transcoding/):
      # PHOTOPRISM_FFMPEG_ENCODER: "software"        # H.264/AVC encoder (software, intel, nvidia, apple, raspberry, or vaapi)
      # PHOTOPRISM_FFMPEG_SIZE: "1920"               # video size limit in pixels (720-7680) (default: 3840)
      # PHOTOPRISM_FFMPEG_BITRATE: "32"              # video bitrate limit in Mbit/s (default: 50)
      ## Run/install on first startup (options: update https gpu ffmpeg tensorflow davfs clitools clean):
      # PHOTOPRISM_INIT: "https gpu tensorflow"
      ## Run as a non-root user after initialization (supported: 0, 33, 50-99, 500-600, and 900-1200):
      # PHOTOPRISM_UID: 1000
      # PHOTOPRISM_GID: 1000
      # PHOTOPRISM_UMASK: 0000
    ## Start as non-root user before initialization (supported: 0, 33, 50-99, 500-600, and 900-1200):
    # user: "1000:1000"
    ## Share hardware devices with FFmpeg and TensorFlow (optional):
    devices:
      - "/dev/dri:/dev/dri"                        # Intel QSV
      - "/dev/nvidia0:/dev/nvidia0"                # Nvidia CUDA
      - "/dev/nvidiactl:/dev/nvidiactl"
    # - "/dev/nvidia-modeset:/dev/nvidia-modeset"
    # - "/dev/nvidia-nvswitchctl:/dev/nvidia-nvswitchctl"
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
    #  - "/dev/video11:/dev/video11"                 # Video4Linux Video Encode Device (h264_v4l2m2m)
    working_dir: "/photoprism" # do not change or remove
    volumes:
      - "${PHOTOPRISM_PHOTOS_DATA_DIR}:/photoprism/originals:ro"               # Original media files (DO NOT REMOVE)
      - "${PHOTOPRISM_DATA_DIR}:/photoprism/storage"                  # *Writable* storage folder for cache, database, and sidecar files (DO NOT REMOVE)
    networks:
      - photoprism
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.prowlarr.loadbalancer.server.port: "2342"
      traefik.http.routers.prowlarr-local.rule: "Host(`${PHOTOPRISM_DOMAIN}`)"

    logging: *default-logging
  mariadb:
    image: mariadb:11
    ## If MariaDB gets stuck in a restart loop, this points to a memory or filesystem issue:
    ## https://docs.photoprism.app/getting-started/troubleshooting/#fatal-server-errors
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt: # see https://github.com/MariaDB/mariadb-docker/issues/434#issuecomment-1136151239
      - seccomp:unconfined
      - apparmor:unconfined
    command: --innodb-buffer-pool-size=512M 
      --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci --max-connections=512 
      --innodb-rollback-on-timeout=OFF --innodb-lock-wait-timeout=120
    ## Never store database files on an unreliable device such as a USB flash drive, an SD card, or a shared network folder:
    volumes:
      - "${CONF_DIR}/photoprism/database:/var/lib/mysql" # DO NOT REMOVE
    environment:
      MARIADB_AUTO_UPGRADE: "${MARIADB_AUTO_UPGRADE}"
      MARIADB_INITDB_SKIP_TZINFO: "${MARIADB_INITDB_SKIP_TZINFO}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    networks:
      - photoprism

    logging: *default-logging
networks:
  photoprism:
  traefik_gateway:
    external: true
