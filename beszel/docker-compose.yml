x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
# Beszel agent of chataigne (NVIDIA image, all disks). The hub runs on ns01:
# see the beszel-hub stack.
services:
  beszel-agent:
    # image: henrygd/beszel-agent-nvidia:0.17
    image: henrygd/beszel-agent-nvidia:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
      - /dev/sdf:/dev/sdf
      - /dev/sdg:/dev/sdg
      - /dev/sdh:/dev/sdh
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BESZEL_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:${BESZEL_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:ro
      - ${BESZEL_AGENT_DATA_DIR}:/var/lib/beszel-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - utility
    environment:
      LISTEN: "${LISTEN}"
      KEY: "${KEY}"
      TOKEN: "${TOKEN}"
      HUB_URL: "${HUB_URL}"
    logging: *default-logging
