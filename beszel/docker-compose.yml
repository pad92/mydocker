services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    volumes:
      - ${BESZEL_DATA_DIR}:/beszel_data
    networks:
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.beszel.loadbalancer.server.port: "8090"

      traefik.http.routers.beszel_http.rule: "Host(`${BESZEL_DOMAIN}`)"
      traefik.http.routers.beszel_http.entrypoints: web
      traefik.http.routers.beszel_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true
      
      traefik.http.routers.beszel.rule: "Host(`${BESZEL_DOMAIN}`)"
      traefik.http.routers.beszel.entrypoints: "websecure"
      traefik.http.routers.beszel.tls: "true"
      traefik.http.routers.beszel.tls.certresolver: "stepca"


  beszel-agent:
    # image: henrygd/beszel-agent-nvidia:0.17
    image: henrygd/beszel-agent-nvidia:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
      - /dev/sdf:/dev/sdf
      - /dev/sdg:/dev/sdg
      - /dev/sdh:/dev/sdh
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BESZEL_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:${BESZEL_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:ro
      - ${BESZEL_AGENT_DATA_DIR}:/var/lib/beszel-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - utility
    environment:
      LISTEN: "${LISTEN}"
      KEY: "${KEY}"
      TOKEN: "${TOKEN}"
      HUB_URL: "${HUB_URL}"
      
networks:
  traefik_gateway:
    external: true
