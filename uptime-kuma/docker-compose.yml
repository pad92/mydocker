# Uptime Kuma, deployed on ns01 (Portainer endpoint ns01) so that monitoring
# and alerting keep working when chataigne is down. Traefik on chataigne
# routes UPTIME_HOST_LOCAL to this port (file provider, see
# management/traefik_dynamic.toml.example), behind Authentik forward auth.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # The port is reachable from the LAN without Authentik: keep the
      # built-in login of Uptime Kuma enabled (Settings > Security).
      - "${UPTIME_KUMA_BIND_ADDRESS:?Set UPTIME_KUMA_BIND_ADDRESS in .env}:3001:3001"
    volumes:
      - ${UPTIME_KUMA_DATA_DIR:?Set UPTIME_KUMA_DATA_DIR in .env}:/app/data
      # Home root CA: HTTPS monitors of the home hosts and the Docker proxy.
      - ${UPTIME_KUMA_CA_CERTIFICATES_DIR:?Set UPTIME_KUMA_CA_CERTIFICATES_DIR in .env}:/app/data/docker-tls:ro
    environment:
      NODE_EXTRA_CA_CERTS: /app/data/docker-tls/${CA_CERT_NAME:?Set CA_CERT_NAME in .env}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
