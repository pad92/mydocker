x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-localtime-volume: &localtime-volume /etc/localtime:/etc/localtime:ro

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"

    max-file: '3'
x-traefik-labels: &traefik-labels
  traefik.enable: "true"
  traefik.docker.network: "traefik_gateway"

x-nfs-driver-opts: &nfs-driver-opts
  type: nfs
  o: addr=${NFS_SERVER_IP},rw,noatime,proto=tcp,clientaddr=${NFS_CLIENT_IP}

services:
  radarr:
    # Films
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
      # Login handled by Authentik forward auth; overrides config.xml.
      # The API key is still required on every API call.
      RADARR__AUTH__METHOD: External
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/radarr:/config
      - movies:/movies
      - movies_family:/movies_family
      - download:/download
      - ${TORRENTS_PATH}:/torrents
      - trash:/trash
      - backups:/config/Backups
    restart: unless-stopped
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.radarr.loadbalancer.server.port: "${RADARR_PORT}"

      traefik.http.routers.radarr_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/radarr`)"
      traefik.http.routers.radarr_http.entrypoints: web
      traefik.http.routers.radarr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.radarr.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/radarr`)"
      traefik.http.routers.radarr.entrypoints: "websecure"
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr.middlewares: "authentik@docker"
      traefik.http.routers.radarr.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.radarr_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/radarr/(api|feed)(/|$$)`)"
      traefik.http.routers.radarr_api.entrypoints: "websecure"
      traefik.http.routers.radarr_api.tls: "true"
      traefik.http.routers.radarr_api.tls.certresolver: "stepca"
      traefik.http.routers.radarr_api.service: "radarr"

  sonarr:
    # Series
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      # Login handled by Authentik forward auth; overrides config.xml.
      # The API key is still required on every API call.
      SONARR__AUTH__METHOD: External
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/sonarr:/config
      - ${SERIES_LOCAL_PATH}:/tv_local
      - series:/tv
      - series_family:/tv_family
      - download:/my-media/download
      - ${TORRENTS_PATH}:/torrents
      - trash:/trash
      - backups:/config/Backups
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.sonarr.loadbalancer.server.port: "${SONARR_PORT}"
      traefik.http.routers.sonarr_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/sonarr`)"
      traefik.http.routers.sonarr_http.entrypoints: web
      traefik.http.routers.sonarr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.sonarr.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/sonarr`)"
      traefik.http.routers.sonarr.entrypoints: "websecure"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.middlewares: "authentik@docker"
      traefik.http.routers.sonarr.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.sonarr_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/sonarr/(api|feed)(/|$$)`)"
      traefik.http.routers.sonarr_api.entrypoints: "websecure"
      traefik.http.routers.sonarr_api.tls: "true"
      traefik.http.routers.sonarr_api.tls.certresolver: "stepca"
      traefik.http.routers.sonarr_api.service: "sonarr"

  bazarr:
    # sous titres
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/bazarr:/config
      - movies:/movies
      - movies_family:/movies_family
      - series:/tv
      - series_family:/tv_family
      - ${SERIES_LOCAL_PATH}:/tv_local
      - backups:/config/backup
    restart: unless-stopped
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.bazarr.loadbalancer.server.port: "${BAZARR_PORT}"
      traefik.http.routers.bazarr_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/bazarr`)"
      traefik.http.routers.bazarr_http.entrypoints: web
      traefik.http.routers.bazarr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.bazarr.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/bazarr`)"
      traefik.http.routers.bazarr.entrypoints: "websecure"
      traefik.http.routers.bazarr.tls: "true"
      traefik.http.routers.bazarr.middlewares: "authentik@docker"
      traefik.http.routers.bazarr.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.bazarr_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/bazarr/api(/|$$)`)"
      traefik.http.routers.bazarr_api.entrypoints: "websecure"
      traefik.http.routers.bazarr_api.tls: "true"
      traefik.http.routers.bazarr_api.tls.certresolver: "stepca"
      traefik.http.routers.bazarr_api.service: "bazarr"

  lidarr:
    # Music
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    environment:
      <<: *common-env
      # Login handled by Authentik forward auth; overrides config.xml.
      # The API key is still required on every API call.
      LIDARR__AUTH__METHOD: External
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/lidarr:/config
      - music:/music
      - download:/downloads # Note: Specific container path
      - ${TORRENTS_PATH}:/torrents
      - backups:/config/Backups
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
    logging: *default-logging
    restart: unless-stopped
    labels:
      <<: *traefik-labels
      traefik.http.services.lidarr.loadbalancer.server.port: "${LIDARR_PORT}"
      traefik.http.routers.lidarr_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/lidarr`)"
      traefik.http.routers.lidarr_http.entrypoints: web
      traefik.http.routers.lidarr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.lidarr.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/lidarr`)"
      traefik.http.routers.lidarr.entrypoints: "websecure"
      traefik.http.routers.lidarr.tls: "true"
      traefik.http.routers.lidarr.middlewares: "authentik@docker"
      traefik.http.routers.lidarr.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.lidarr_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/lidarr/(api|feed)(/|$$)`)"
      traefik.http.routers.lidarr_api.entrypoints: "websecure"
      traefik.http.routers.lidarr_api.tls: "true"
      traefik.http.routers.lidarr_api.tls.certresolver: "stepca"
      traefik.http.routers.lidarr_api.service: "lidarr"

  sabnzbd:
    # NZB Download
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/sabnzbd:/config
      - ${DOCKER_CONFIG_PATH}/sabnzbd_custom-cont-init.d:/custom-cont-init.d:ro
      - music:/my-media/Music
      - movies:/my-media/Movie
      - series:/my-media/TV
      - download:/my-media/download
      - download_incomming:/my-media/incomming
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.sabnzbd.loadbalancer.server.port: "${SABNZBD_PORT}"

      traefik.http.routers.sabnzbd_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/sabnzbd`)"
      traefik.http.routers.sabnzbd_http.entrypoints: web
      traefik.http.routers.sabnzbd_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.sabnzbd.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/sabnzbd`)"
      traefik.http.routers.sabnzbd.entrypoints: "websecure"
      traefik.http.routers.sabnzbd.tls: "true"
      traefik.http.routers.sabnzbd.middlewares: "authentik@docker"
      traefik.http.routers.sabnzbd.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.sabnzbd_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/sabnzbd/api(/|$$)`)"
      traefik.http.routers.sabnzbd_api.entrypoints: "websecure"
      traefik.http.routers.sabnzbd_api.tls: "true"
      traefik.http.routers.sabnzbd_api.tls.certresolver: "stepca"
      traefik.http.routers.sabnzbd_api.service: "sabnzbd"

  prowlarr:
    # NZB Proxy
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      <<: *common-env
      # Login handled by Authentik forward auth; overrides config.xml.
      # The API key is still required on every API call.
      PROWLARR__AUTH__METHOD: External
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/prowlarr:/config
      - backups:/config/Backups
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.prowlarr.loadbalancer.server.port: "${PROWLARR_PORT}"

      traefik.http.routers.prowlarr_http.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/prowlarr`)"
      traefik.http.routers.prowlarr_http.entrypoints: web
      traefik.http.routers.prowlarr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.prowlarr.rule: "Host(`${TRAEFIK_FQDN}`) && PathPrefix(`/prowlarr`)"
      traefik.http.routers.prowlarr.entrypoints: "websecure"
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.middlewares: "authentik@docker"
      traefik.http.routers.prowlarr.tls.certresolver: "stepca"
      # API calls (apikey) bypass forward auth; longer rule = higher priority.
      traefik.http.routers.prowlarr_api.rule: "Host(`${TRAEFIK_FQDN}`) && PathRegexp(`^/prowlarr/([0-9]+/)?(api|download)(/|$$)`)"
      traefik.http.routers.prowlarr_api.entrypoints: "websecure"
      traefik.http.routers.prowlarr_api.tls: "true"
      traefik.http.routers.prowlarr_api.tls.certresolver: "stepca"
      traefik.http.routers.prowlarr_api.service: "prowlarr"

  seerr:
    # Demandes de films/séries par les utilisateurs (Plex + Radarr/Sonarr)
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Pas de PUID/PGID : l'image tourne en utilisateur fixe "node" (UID 1000).
      # Le dossier ${DOCKER_CONFIG_PATH}/seerr doit lui appartenir (chown 1000:1000).
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/seerr:/app/config
    networks:
      - traefik_gateway
      - ng
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.seerr.loadbalancer.server.port: "${SEERR_PORT}"

      traefik.http.routers.seerr_http.rule: "Host(`${SEERR_DOMAIN}`)"
      traefik.http.routers.seerr_http.entrypoints: web
      traefik.http.routers.seerr_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.seerr.rule: "Host(`${SEERR_DOMAIN}`)"
      traefik.http.routers.seerr.entrypoints: "websecure"
      traefik.http.routers.seerr.tls: "true"
      traefik.http.routers.seerr.tls.certresolver: "stepca"

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    init: true
    user: ${PUID}:${PGID} # Note: User retained as it's specific
    networks:
      - ng # Note: Network retained
    volumes:
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/recyclarr:/config # Note: Specific volume retained
    environment:
      <<: *common-env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  h5ai:
    image: pad92/docker-h5ai:latest
    container_name: h5ai
    restart: unless-stopped
    environment:
      <<: *common-env
      REAL_IP_FROM: "172.18.0.0/16"
      # Admin page password, hashed at each start. Empty keeps the stored
      # passhash (login disabled if that hash is empty too).
      H5AI_ADMIN_PASSWORD: ${H5AI_ADMIN_PASSWORD:-}
    volumes:
      - *localtime-volume
      - ${LOCAL_CA_CERT_PATH}:/etc/ssl/certs/ca.crt:ro
      - ${DOCKER_CONFIG_PATH}/h5ai/cache:/usr/share/h5ai/_h5ai/public/cache
      # Thumbnail index, remembered capture failures and folder sizes. Kept
      # apart from the public cache, which is served over HTTP.
      - ${DOCKER_CONFIG_PATH}/h5ai/cache-private:/usr/share/h5ai/_h5ai/private/cache
      # Folders under /share: one slot per folder, set in .env or in the
      # Portainer/Dockhand stack variables as <source>:/share/<name> (see
      # README, section h5ai). Always read-only. An unset slot mounts the
      # empty volume h5ai_unused outside /share, so h5ai does not show it.
      # Add lines here past H5AI_SHARE_20 if 20 is not enough.
      - ${H5AI_SHARE_01:-h5ai_unused:/.h5ai-unused/01}:ro
      - ${H5AI_SHARE_02:-h5ai_unused:/.h5ai-unused/02}:ro
      - ${H5AI_SHARE_03:-h5ai_unused:/.h5ai-unused/03}:ro
      - ${H5AI_SHARE_04:-h5ai_unused:/.h5ai-unused/04}:ro
      - ${H5AI_SHARE_05:-h5ai_unused:/.h5ai-unused/05}:ro
      - ${H5AI_SHARE_06:-h5ai_unused:/.h5ai-unused/06}:ro
      - ${H5AI_SHARE_07:-h5ai_unused:/.h5ai-unused/07}:ro
      - ${H5AI_SHARE_08:-h5ai_unused:/.h5ai-unused/08}:ro
      - ${H5AI_SHARE_09:-h5ai_unused:/.h5ai-unused/09}:ro
      - ${H5AI_SHARE_10:-h5ai_unused:/.h5ai-unused/10}:ro
      - ${H5AI_SHARE_11:-h5ai_unused:/.h5ai-unused/11}:ro
      - ${H5AI_SHARE_12:-h5ai_unused:/.h5ai-unused/12}:ro
      - ${H5AI_SHARE_13:-h5ai_unused:/.h5ai-unused/13}:ro
      - ${H5AI_SHARE_14:-h5ai_unused:/.h5ai-unused/14}:ro
      - ${H5AI_SHARE_15:-h5ai_unused:/.h5ai-unused/15}:ro
      - ${H5AI_SHARE_16:-h5ai_unused:/.h5ai-unused/16}:ro
      - ${H5AI_SHARE_17:-h5ai_unused:/.h5ai-unused/17}:ro
      - ${H5AI_SHARE_18:-h5ai_unused:/.h5ai-unused/18}:ro
      - ${H5AI_SHARE_19:-h5ai_unused:/.h5ai-unused/19}:ro
      - ${H5AI_SHARE_20:-h5ai_unused:/.h5ai-unused/20}:ro
    networks:
      - traefik_gateway
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging
    labels:
      <<: *traefik-labels
      traefik.http.services.h5ai.loadbalancer.server.port: "80"

      traefik.http.routers.h5ai_http.rule: "Host(`${TRAEFIK_FQDN}`)"
      traefik.http.routers.h5ai_http.entrypoints: web
      traefik.http.routers.h5ai_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.h5ai.rule: "Host(`${TRAEFIK_FQDN}`)"
      traefik.http.routers.h5ai.entrypoints: "websecure"
      traefik.http.routers.h5ai.tls: "true"
      traefik.http.routers.h5ai.tls.certresolver: "stepca"

volumes:
  download:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${DOWNLOAD_PATH}
  download_incomming:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SABNZBD_DOWNLOAD_PATH}
  movies_family:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MEDIA_BASE_PATH}/Movies_Family
  movies:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MEDIA_BASE_PATH}/Movies
  series_family:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MEDIA_BASE_PATH}/Series_Family
  series:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MEDIA_BASE_PATH}/Series
  music:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MUSIC_PATH}
  trash:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${MEDIA_BASE_PATH}/#recycle
  backups:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${BACKUPS_PATH}
  # Always empty: target of the unset h5ai slots.
  h5ai_unused:
  # NFS exports that h5ai slots can mount, e.g. H5AI_SHARE_07=h5ai_nfs_01:/share/music.
  # Docker creates them only when a slot uses them.
  h5ai_nfs_01:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${H5AI_NFS_01:-/h5ai-nfs-01-unset}
  h5ai_nfs_02:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${H5AI_NFS_02:-/h5ai-nfs-02-unset}
  h5ai_nfs_03:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${H5AI_NFS_03:-/h5ai-nfs-03-unset}
  h5ai_nfs_04:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${H5AI_NFS_04:-/h5ai-nfs-04-unset}
  h5ai_nfs_05:
    driver: local
    driver_opts:
      <<: *nfs-driver-opts
      device: :${H5AI_NFS_05:-/h5ai-nfs-05-unset}

networks:
  traefik_gateway:
    external: true
  ng:
