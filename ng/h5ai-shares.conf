# Folders served by h5ai, one per line. Each one is mounted read-only at
# /share/<name>. After any change, regenerate the compose file and commit both:
#
#   python3 -I ng/scripts/h5ai_shares.py
#
# Format: <name> <type> <source>
#   name    folder name under /share (letters, digits, '_', '.', '-')
#   type    volume  source is a named volume already declared in
#                   docker-compose.yml (shared with the other services)
#           nfs     source is a path exported by ${NFS_SERVER_IP}; a dedicated
#                   volume h5ai_share_<name> is generated
#           bind    source is a path on the Docker host
#   source  for nfs and bind: an absolute path, or one that starts with
#           ${VAR}, set in .env or in the Portainer/Dockhand stack variables
#
# Lines starting with '#' are comments.

movies          volume  movies
movies_family   volume  movies_family
moviez          bind    /volume1/medias/movies
series          volume  series
series_family   volume  series_family
seriez          bind    /volume1/medias/series
music           volume  music_library
photos          bind    ${PHOTOS_PATH}
