# Folders served by h5ai, one per line, as many as needed. Each one is mounted
# read-only at /share/<destination> and depends on nothing else in the stack:
# it does not reuse the volumes of the other services (download, backups, ...).
#
# Format: <source>:<destination>
#   source       nfs:<path>  a path exported by ${NFS_SERVER_IP}; a dedicated
#                            volume h5ai_share_<destination> is generated
#                <path>      a path on the Docker host (bind mount). Start it
#                            with ${H5AI_BIND_ROOT}: the pre-commit hook refuses
#                            a host path written out in full in docker-compose.yml
#                A path is absolute or starts with a ${VAR} reference set in .env
#                or in the Portainer/Dockhand stack variables. No spaces, and no
#                ':' other than the separators.
#   destination  folder name under /share (letters, digits, '_', '.', '-')
#
# Commit this file: the pre-commit hook regenerates the h5ai mounts of
# docker-compose.yml and adds it to the commit. To regenerate by hand:
#
#   python3 -I ng/scripts/h5ai_shares.py
#
# Lines starting with '#' are comments.

nfs:/volume1/Medias/Movies:movies
nfs:/volume1/Medias/Movies_Family:movies_family
${H5AI_BIND_ROOT}/medias/movies:moviez
nfs:/volume1/Medias/Series:series
nfs:/volume1/Medias/Series_Family:series_family
${H5AI_BIND_ROOT}/medias/series:seriez
nfs:/volume1/music/library:music
${H5AI_BIND_ROOT}/photos/public:photos
