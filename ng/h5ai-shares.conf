# Folders served by h5ai, one per line, as many as needed. Each one is mounted
# read-only at /share/<name> and depends on nothing else in the stack: it does
# not reuse the volumes of the other services (download, backups, ...).
# After any change, regenerate the compose file and commit both:
#
#   python3 -I ng/scripts/h5ai_shares.py
#
# Format: <name> <type> <source>
#   name    folder name under /share (letters, digits, '_', '.', '-')
#   type    nfs     source is a path exported by ${NFS_SERVER_IP}; a dedicated
#                   volume h5ai_share_<name> is generated
#           bind    source is a path on the Docker host. Start it with
#                   ${H5AI_BIND_ROOT}: the pre-commit hook refuses a host path
#                   written out in full in docker-compose.yml
#   source  an absolute path, or one that starts with a ${VAR} reference set
#           in .env or in the Portainer/Dockhand stack variables
#
# Lines starting with '#' are comments.

movies          nfs     /volume1/Medias/Movies
movies_family   nfs     /volume1/Medias/Movies_Family
moviez          bind    ${H5AI_BIND_ROOT}/medias/movies
series          nfs     /volume1/Medias/Series
series_family   nfs     /volume1/Medias/Series_Family
seriez          bind    ${H5AI_BIND_ROOT}/medias/series
music           nfs     /volume1/music/library
photos          bind    ${H5AI_BIND_ROOT}/photos/public
