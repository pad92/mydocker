x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-common-env: &common-env
  PGID: ${PGID}
  PUID: ${PUID}
  TZ: ${TZ}
x-plex-volumes: &plex-volumes
  - ${PLEX_DATA_DIR}:/config
  - ${PLEX_LOCAL_MEDIA_DIR}:/opt/medias_local:ro
  # Séries et films
  - media_nas:/opt/medias:ro
  - photo_nas:/opt/photo:ro
  - music_nas:/opt/music:ro
services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      PLEX_UID: ${PUID}
      PLEX_GID: ${PGID}
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    devices:
      - /dev/dri:/dev/dri
    volumes: *plex-volumes
    tmpfs:
      - /transcode
    restart: unless-stopped

    logging: *default-logging
  tautulli:
    image: linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      <<: *common-env
    volumes:
      - ${PLEX_TAUTULLI_DATA_DIR}:/config
      - ${PLEX_MEDIA_SERVER_LOGS_DATA_DIR}:/plex_logs:ro
    networks:
      - traefik_gateway
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.tautulli.loadbalancer.server.port: "8181"

      traefik.http.routers.tautulli_http.rule: "Host(`${TAUTULLI_DOMAIN:?Set TAUTULLI_DOMAIN in .env}`)"
      traefik.http.routers.tautulli_http.entrypoints: "web"
      traefik.http.routers.tautulli_http.middlewares: "redirect-https"

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.tautulli.rule: "Host(`${TAUTULLI_DOMAIN:?Set TAUTULLI_DOMAIN in .env}`)"
      traefik.http.routers.tautulli.entrypoints: "websecure"
      traefik.http.routers.tautulli.tls: "true"
      traefik.http.routers.tautulli.tls.certresolver: "stepca"

      homepage.group: Medias
      homepage.name: Tautulli
      homepage.icon: tautulli.png
      homepage.href: https://${TAUTULLI_DOMAIN:?Set TAUTULLI_DOMAIN in .env}/
      homepage.description: Plex stats
      homepage.showStats: true

    logging: *default-logging
volumes:
  media_nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${PLEX_IP},nolock,soft,rw,vers=4
      device: :${PLEX_MEDIA_NFS_PATH}
  music_nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${PLEX_IP},nolock,soft,ro,vers=4
      device: :${PLEX_MUSIC_NFS_PATH}
  photo_nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${PLEX_IP},nolock,soft,ro,vers=4
      device: :${PLEX_PHOTO_NFS_PATH}

networks:
  traefik_gateway:
    external: true
