x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    environment:
      MODEL_DOWNLOAD_DIR: "${MODEL_DOWNLOAD_DIR:-}"
      # Reach Ollama on the internal network. Without it Open WebUI falls back
      # to the host gateway on port 11434, which no longer answers once the
      # published port is bound to the LAN address only.
      OLLAMA_BASE_URL: "http://ollama:11434"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Signs the session tokens: a known value lets anyone forge them.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY}"
    volumes:
      - ${OLLAMA_OPEN_WEBUI_DATA_DIR:?Set OLLAMA_OPEN_WEBUI_DATA_DIR}:/data
      - ${OLLAMA_MODELS_DATA_DIR:?Set OLLAMA_MODELS_DATA_DIR}:/models
      - ${OLLAMA_OPEN_WEBUI_BACKEND_DATA_DIR:?Set OLLAMA_OPEN_WEBUI_BACKEND_DATA_DIR}:/app/backend/data

    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ollama
      - traefik_gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_gateway"
      - "traefik.http.routers.webui.rule=Host(`${OLLAMA_DOMAIN:?Set OLLAMA_DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
    logging: *default-logging
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    restart: unless-stopped
    volumes:
      - ${OLLAMA_OLLAMA_DATA_DIR:?Set OLLAMA_OLLAMA_DATA_DIR}:/root/.ollama
      - ${OLLAMA_MODELS_DATA_DIR:?Set OLLAMA_MODELS_DATA_DIR}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    environment:
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      # Listen on every interface of the container; the published port below
      # decides who reaches it from outside.
      OLLAMA_HOST: "0.0.0.0:11434"
      # Context window in tokens. Set explicitly: Ollama otherwise picks it
      # from the free VRAM, and a short one silently truncates long prompts
      # (Gramps Web sends about 5k tokens of tree context). 8192 fits next to
      # a 7B model in Q4 on a 6 GB card.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
      # An empty NVIDIA_VISIBLE_DEVICES hides the GPU from the container.
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
    # The API has no authentication: publish it on one host address (the LAN
    # one that Gramps Web uses), never on every interface.
    ports:
      - target: 11434
        published: "11434"
        host_ip: "${OLLAMA_BIND_ADDRESS:?Set OLLAMA_BIND_ADDRESS}"
        protocol: tcp
    networks:
      - ollama

    logging: *default-logging
networks:
  traefik_gateway:
    external: true
  ollama:
    driver: bridge
