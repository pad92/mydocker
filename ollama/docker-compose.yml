x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  open-webui:
    container_name: open-webui
    # Pinned: the "main" tag follows the development branch.
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.13.5}
    environment:
      # Reach Ollama on the internal network. Without it Open WebUI falls back
      # to the host gateway on port 11434, which no longer answers once the
      # published port is bound to the LAN address only.
      OLLAMA_BASE_URL: "http://ollama:11434"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Signs the session tokens: a known value lets anyone forge them.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY}"
      # Public URL, used in links and as the OAuth base.
      WEBUI_URL: "https://${OLLAMA_DOMAIN:?Set OLLAMA_DOMAIN}"
      # Sign-in through Authentik (OpenID Connect). The provider, its groups
      # and the redirect URI below come from the management blueprint
      # 20-forward-auth-apps.yaml. Open WebUI reads these OAuth variables at
      # each start (they are not kept in its database).
      OAUTH_PROVIDER_NAME: Authentik
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: "${OPEN_WEBUI_OIDC_CLIENT_SECRET:?Set OPEN_WEBUI_OIDC_CLIENT_SECRET}"
      OPENID_PROVIDER_URL: "https://${AUTHENTIK_DOMAIN:?Set AUTHENTIK_DOMAIN}/application/o/open-webui/.well-known/openid-configuration"
      # Explicit: behind Traefik the computed default may use http, which
      # Authentik rejects (strict redirect URI).
      OPENID_REDIRECT_URI: "https://${OLLAMA_DOMAIN:?Set OLLAMA_DOMAIN}/oauth/oidc/login/callback"
      # Create the account at the first Authentik sign-in, or attach it to the
      # local account with the same e-mail address (Authentik is trusted to
      # verify e-mail addresses).
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      # Role from the Authentik groups at each sign-in: open-webui-admins gives
      # admin, open-webui-users gives user, anything else is refused (403).
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ALLOWED_ROLES: open-webui-users
      OAUTH_ADMIN_ROLES: open-webui-admins
      # Authentik uses a certificate of the internal CA: trust the host bundle
      # (httpx, aiohttp and requests each read their own variable).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      AIOHTTP_CLIENT_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      # Database, uploads and settings: the only state Open WebUI keeps.
      - ${OLLAMA_OPEN_WEBUI_BACKEND_DATA_DIR:?Set OLLAMA_OPEN_WEBUI_BACKEND_DATA_DIR}:/app/backend/data
      # Host CA bundle, which includes the internal CA (see above).
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      - ollama
    networks:
      - ollama
      - traefik_gateway
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.open-webui.loadbalancer.server.port: "8080"

      traefik.http.routers.open-webui_http.rule: "Host(`${OLLAMA_DOMAIN:?Set OLLAMA_DOMAIN}`)"
      traefik.http.routers.open-webui_http.entrypoints: web
      traefik.http.routers.open-webui_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.open-webui.rule: "Host(`${OLLAMA_DOMAIN:?Set OLLAMA_DOMAIN}`)"
      traefik.http.routers.open-webui.entrypoints: "websecure"
      traefik.http.routers.open-webui.tls: "true"
      traefik.http.routers.open-webui.tls.certresolver: "stepca"
    logging: *default-logging
  ollama:
    # Pinned to the last release that uses the GPU with NVIDIA driver 550:
    # from 0.30.0 Ollama wants driver 570 or newer and falls back to the CPU
    # without an error (only a "driver too old" warning in the logs). Raise
    # it only after a driver upgrade, and check `ollama ps` (100% GPU).
    image: docker.io/ollama/ollama:${OLLAMA_VERSION:-0.24.0}
    container_name: ollama
    restart: unless-stopped
    volumes:
      # Models live in /root/.ollama/models.
      - ${OLLAMA_OLLAMA_DATA_DIR:?Set OLLAMA_OLLAMA_DATA_DIR}:/root/.ollama
    # Gives the GPU to the container through the NVIDIA Container Toolkit;
    # the image already sets NVIDIA_VISIBLE_DEVICES and the driver features.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    environment:
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      # Listen on every interface of the container; the published port below
      # decides who reaches it from outside.
      OLLAMA_HOST: "0.0.0.0:11434"
      # Context window in tokens. Set explicitly: Ollama otherwise picks it
      # from the free VRAM, and a short one silently truncates long prompts
      # (Gramps Web sends about 5k tokens of tree context). 8192 fits next to
      # a 7B model in Q4 on a 6 GB card.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    # The API has no authentication: publish it on one host address (the LAN
    # one that Gramps Web uses), never on every interface.
    ports:
      - target: 11434
        published: "11434"
        host_ip: "${OLLAMA_BIND_ADDRESS:?Set OLLAMA_BIND_ADDRESS}"
        protocol: tcp
    networks:
      - ollama
    logging: *default-logging
networks:
  traefik_gateway:
    external: true
  ollama:
    driver: bridge
