x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  sd-webui:
    image: goolashe/automatic1111-sd-webui
    container_name: sd-webui
    ports:
      - "7860:7860"
    volumes:
      - ${STABLE_DIFFUSION_SD_DATA_DIR}:/stable-diffusion-webui/outputs
    environment:
      - CLI_ARGS=${CLI_ARGS}
    restart: unless-stopped
    logging: *default-logging
