x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    environment:
      - TZ=${TZ}
    ports:
      - 8123:8123
    volumes:
      - ${HOMEASSISTANT_DATA_DIR}:/config
    restart: unless-stopped
    logging: *default-logging
