x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  server:
    restart: unless-stopped
    container_name: vaultwarden
    volumes:
      - '${VAULTWARDEN_DATA_DIR}:/data/'
    ports:
      - '8000:80'
    image: vaultwarden/server:latest
    logging: *default-logging
