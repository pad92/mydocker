x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  s3:
    container_name: minio
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    volumes:
      - ${MINIO_S3_DATA_DIR}:/data
    environment:
      # Keep the existing variable names for a transparent migration while
      # using RustFS's canonical credentials configuration.
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
    logging: *default-logging
