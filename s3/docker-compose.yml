x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  s3:
    container_name: s3
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    volumes:
      - ${RUSTFS_DATA_DIR}:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_UID: ${RUSTFS_UID:-10001}
      RUSTFS_GID: ${RUSTFS_GID:-10001}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    networks:
      - traefik_gateway
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_gateway"
      - "traefik.http.routers.rustfs-api.rule=Host(`${RUSTFS_S3_HOST}`)"
      - "traefik.http.routers.rustfs-api.service=rustfs-api-svc"
      - "traefik.http.services.rustfs-api-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.rustfs-console.rule=Host(`${RUSTFS_CONSOLE_HOST}`)"
      - "traefik.http.routers.rustfs-console.service=rustfs-console-svc"
      - "traefik.http.services.rustfs-console-svc.loadbalancer.server.port=9001"
    logging: *default-logging
networks:
  traefik_gateway:
    external: true
