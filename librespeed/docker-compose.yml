services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CUSTOM_RESULTS=${CUSTOM_RESULTS}
      - DB_TYPE=${DB_TYPE}
      - USE_NEW_DESIGN=${USE_NEW_DESIGN}
    volumes:
      - ${LIBRESPEED_DATA_DIR}:/config
    restart: unless-stopped
    networks:
      traefik_gateway:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.librespeed.loadbalancer.server.port: "80"
      traefik.http.routers.librespeed.rule: "Host(`${LIBRESPEED_DOMAIN}`)"
      traefik.http.routers.librespeed.entrypoints: "web"
      traefik.http.routers.librespeed.tls: "false"

networks:
  traefik_gateway:
    external: true
