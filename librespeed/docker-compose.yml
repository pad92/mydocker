x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
      TZ: "${TZ:-Etc/UTC}"
      CUSTOM_RESULTS: "${CUSTOM_RESULTS:-false}"
      DB_TYPE: "${DB_TYPE:-sqlite}"
      # Password of /results/stats.php. The image writes it as-is into
      # telemetry_settings.php: an empty value lets anyone log in with an empty
      # password, hence the required variable.
      PASSWORD: "${LIBRESPEED_STATS_PASSWORD:?Set LIBRESPEED_STATS_PASSWORD}"
    volumes:
      - ${LIBRESPEED_DATA_DIR:?Set LIBRESPEED_DATA_DIR}:/config
    # The image has no variable for the design: it reads useNewDesign from this
    # file. Compose rewrites it on each container creation, so edits made by
    # hand in the data directory are lost.
    configs:
      - source: design_config
        target: /config/www/config.json
      # Run by the image after its own init, see migrate_index under configs:.
      - source: migrate_index
        target: /custom-cont-init.d/10-migrate-index
        mode: 0755
    restart: unless-stopped
    # The image drops to PUID:PGID through s6 and never needs to gain privileges.
    security_opt:
      - no-new-privileges:true
    networks:
      traefik_gateway:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.librespeed.loadbalancer.server.port: "80"

      traefik.http.routers.librespeed_http.rule: "Host(`${LIBRESPEED_DOMAIN:?Set LIBRESPEED_DOMAIN}`)"
      traefik.http.routers.librespeed_http.entrypoints: web
      traefik.http.routers.librespeed_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      # getIP.php trusts Client-IP before X-Forwarded-For. Traefik rewrites
      # X-Forwarded-For and X-Real-Ip but forwards Client-IP untouched, so a
      # client could fake the IP shown and stored in the results.
      traefik.http.middlewares.librespeed-drop-client-ip.headers.customrequestheaders.Client-IP: ""

      # No compress middleware: it would skew the download measurement.
      traefik.http.routers.librespeed.rule: "Host(`${LIBRESPEED_DOMAIN:?Set LIBRESPEED_DOMAIN}`)"
      traefik.http.routers.librespeed.entrypoints: "websecure"
      traefik.http.routers.librespeed.tls: "true"
      traefik.http.routers.librespeed.tls.certresolver: "stepca"
      traefik.http.routers.librespeed.middlewares: librespeed-drop-client-ip

    logging: *default-logging
networks:
  traefik_gateway:
    external: true
configs:
  # Inline rather than a ./config.json bind mount, which Portainer would resolve
  # on its own disk (see openobserve/README.md). Needs Docker Compose 2.23+.
  design_config:
    content: |
      {
        "useNewDesign": ${LIBRESPEED_NEW_DESIGN:-true}
      }
  # The image copies index.html into /config only when it is missing, so a data
  # directory from an older image keeps a classic page that never loads
  # design-switch.js and ignores useNewDesign. This puts the current switcher in
  # place once and keeps the old page as index.html.old. A page that already
  # loads design-switch.js, customised or not, is left alone. Compose
  # interpolates $ here: write $$ for a literal $.
  migrate_index:
    content: |
      #!/bin/bash
      page=/config/www/index.html
      switcher=/app/www/public/index.html.bak
      if [ -f "$$page" ] && ! grep -q design-switch.js "$$page" \
        && grep -q design-switch.js "$$switcher"; then
        mv "$$page" "$$page.old"
        cp "$$switcher" "$$page"
        chown abc:abc "$$page" "$$page.old"
        echo "[migrate-index] old index.html moved to index.html.old, design switcher installed"
      fi
