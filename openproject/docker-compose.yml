x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-localtime-volume: &localtime-volume "/etc/localtime:/etc/localtime:ro"
name: openproject
services:
  openproject:
    container_name: openproject
    image: openproject/openproject:14
    networks:
      - traefik_gateway
    volumes:
      - *localtime-volume
      - ${OPENPROJECT_PGDATA_DATA_DIR}:/var/openproject/pgdata
      - ${OPENPROJECT_ASSETS_DATA_DIR}:/var/openproject/assets
    environment:
      - OPENPROJECT_SECRET_KEY_BASE=$OPENPROJECT_SECRET_KEY_BASE
      - OPENPROJECT_HOST__NAME=$OPENPROJECT_HOST__NAME
      - OPENPROJECT_HTTPS=$OPENPROJECT_HTTPS
      - OPENPROJECT_DEFAULT__LANGUAGE=$OPENPROJECT_DEFAULT__LANGUAGE
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.openproject.loadbalancer.server.port: "80"
      traefik.http.routers.openproject-local.rule: "Host(`${OPENPROJECT_HOST__NAME}`)"
    restart: unless-stopped
networks:
  traefik_gateway:
    external: true
