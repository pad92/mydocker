x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BESZEL_AGENT_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:${BESZEL_AGENT_DBUS_SYSTEM_BUS_SOCKET_DATA_DIR}:ro
      - ${BESZEL_AGENT_DATA_DIR}:/var/lib/beszel-agent
    devices:
      - /dev/sda:/dev/sda
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    environment:
      LISTEN: "${LISTEN}"
      KEY: "${KEY}"
      TOKEN: "${TOKEN}"
      HUB_URL: "${HUB_URL}"
    logging: *default-logging
