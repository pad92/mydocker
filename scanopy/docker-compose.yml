x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
name: scanopy

x-scanopy-env: &scanopy-env
  SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
  SCANOPY_SERVER_PORT: ${SCANOPY_SERVER_PORT:-60072}
  SCANOPY_DAEMON_PORT: ${SCANOPY_DAEMON_PORT:-60073}

services:
  daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    ports:
      - "${SCANOPY_DAEMON_PORT:-60073}:${SCANOPY_DAEMON_PORT:-60073}"
    environment:
      <<: *scanopy-env
      SCANOPY_SERVER_URL: ${SCANOPY_SERVER_URL:-http://127.0.0.1:60072}
      SCANOPY_PORT: ${SCANOPY_DAEMON_PORT:-60073}
      SCANOPY_BIND_ADDRESS: ${SCANOPY_BIND_ADDRESS:-0.0.0.0}
      SCANOPY_NAME: ${SCANOPY_NAME:-scanopy-daemon}
      SCANOPY_HEARTBEAT_INTERVAL: ${SCANOPY_HEARTBEAT_INTERVAL:-30}
      SCANOPY_MODE: ${SCANOPY_MODE:-Push}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SCANOPY_DAEMON_PORT:-60073}/api/health
            || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - ${SCANOPY_DAEMON_DATA_DIR}:/root/.config/daemon
      # Comment out the line below to disable docker discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging: *default-logging
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ${SCANOPY_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scanopy

    logging: *default-logging
  server:
    image: ghcr.io/scanopy/scanopy/server:latest
    ports:
      - "${SCANOPY_SERVER_PORT:-60072}:${SCANOPY_SERVER_PORT:-60072}"
    environment:
      <<: *scanopy-env
      SCANOPY_DATABASE_URL: "${SCANOPY_DATABASE_URL}"
      SCANOPY_WEB_EXTERNAL_PATH: "${SCANOPY_WEB_EXTERNAL_PATH}"
      SCANOPY_PUBLIC_URL: 
        ${SCANOPY_PUBLIC_URL:-http://localhost:${SCANOPY_SERVER_PORT:-60072}}
      # How server reaches integrated daemon
      # 172.17.0.1 is Docker's default bridge gateway. If your's is different, make sure to change it.
      SCANOPY_INTEGRATED_DAEMON_URL: "${SCANOPY_INTEGRATED_DAEMON_URL}"
    volumes:
      - ${SCANOPY_DATA_DIR}:/data
    depends_on:
      postgres:
        condition: service_healthy
      daemon:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scanopy

    logging: *default-logging
networks:
  scanopy:
    driver: bridge
    ipam:
      config:
        - subnet: ${SCANOPY_IP_1}/16
          gateway: ${SCANOPY_IP_2}
