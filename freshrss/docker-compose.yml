---
services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${FRESHRSS_DATA_DIR}:/config
    restart: unless-stopped
    networks:
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.freshrss.loadbalancer.server.port: 80
      traefik.http.routers.freshrss.rule: "Host(`${FRESHRSS_DOMAIN}`)"
      traefik.http.routers.freshrss.entrypoints: "web"
      traefik.http.routers.freshrss.tls: "false"
      
networks:
  traefik_gateway:
    external: true
