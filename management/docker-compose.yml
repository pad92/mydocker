  # --- Docker socket proxy (read-only) ------------------------------------
  # Uptime Kuma runs on ns01 (uptime-kuma/ stack) so that monitoring survives
  # an outage of this host. Its "docker" monitors read the state of the
  # containers of this host through this proxy: Docker API in read-only mode,
  # containers endpoints only, served by Traefik in HTTPS and limited to the
  # IP of ns01. The inspect endpoint returns the environment of each
  # container, so never widen DOCKER_PROXY_ALLOWED_IPS beyond trusted hosts.
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.2.4
    container_name: docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      PING: 1
      VERSION: 1
      INFO: 0
      POST: 0
    networks:
      - traefik_gateway
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.docker_proxy.loadbalancer.server.port: "2375"
      traefik.http.routers.docker_proxy.rule: "Host(`${DOCKER_PROXY_HOST_LOCAL:?Set DOCKER_PROXY_HOST_LOCAL in .env}`)"
      traefik.http.routers.docker_proxy.entrypoints: "websecure"
      traefik.http.routers.docker_proxy.tls: "true"
      traefik.http.routers.docker_proxy.tls.certresolver: "stepca"
      traefik.http.routers.docker_proxy.middlewares: "docker_proxy_allow"
      traefik.http.middlewares.docker_proxy_allow.ipallowlist.sourcerange: "${DOCKER_PROXY_ALLOWED_IPS:?Set DOCKER_PROXY_ALLOWED_IPS in .env}"

  # --- Authentik (SSO / identity provider) -------------------------------
  # Based on the official compose file (https://goauthentik.io/compose.yml).
  # Redis is no longer needed since 2025.10: cache, tasks and websockets
  # use PostgreSQL.
  authentik_postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?Set AUTHENTIK_PG_PASS in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/database:/var/lib/postgresql/data
    # Private network only: the database is never reachable from Traefik.
    networks:
      - authentik
    security_opt:
      - no-new-privileges:true

  authentik_server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.6}
    container_name: authentik_server
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik_postgresql:
        condition: service_healthy
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik_postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:?Set AUTHENTIK_PG_PASS in .env}
      # No data sent to the vendor (Sentry error reports, startup analytics).
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/data:/data
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/custom-templates:/templates
      # Branding files (logo, background, app icons) of the blueprints, served
      # by the server as "homelab/..." (authentik/blueprints/30-branding.yaml).
      - ./authentik/media:/data/media/public/homelab:ro
      - *localtime-volume
    networks:
      - authentik
      - traefik_gateway
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.authentik.loadbalancer.server.port: "9000"

      # Internal host (.lan) and optional public host. When
      # AUTHENTIK_HOST_PUBLIC is empty, the second Host() repeats the internal
      # one, so the rule stays valid without a public name.
      traefik.http.routers.authentik_http.rule: "Host(`${AUTHENTIK_HOST_LOCAL:?Set AUTHENTIK_HOST_LOCAL in .env}`) || Host(`${AUTHENTIK_HOST_PUBLIC:-${AUTHENTIK_HOST_LOCAL}}`)"
      traefik.http.routers.authentik_http.entrypoints: web
      traefik.http.routers.authentik_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      # One HTTPS router per host name, so each name gets its own certificate:
      # a failed ACME order for the public name must not take the internal
      # certificate down with it. When AUTHENTIK_HOST_PUBLIC is empty, the
      # public router repeats the internal host and is harmless.
      traefik.http.routers.authentik.rule: "Host(`${AUTHENTIK_HOST_LOCAL:?Set AUTHENTIK_HOST_LOCAL in .env}`)"
      traefik.http.routers.authentik.entrypoints: "websecure"
      traefik.http.routers.authentik.tls: "true"
      traefik.http.routers.authentik.tls.certresolver: "stepca"
      traefik.http.routers.authentik.service: "authentik"

      traefik.http.routers.authentik_pub.rule: "Host(`${AUTHENTIK_HOST_PUBLIC:-${AUTHENTIK_HOST_LOCAL}}`)"
      traefik.http.routers.authentik_pub.entrypoints: "websecure"
      traefik.http.routers.authentik_pub.tls: "true"
      traefik.http.routers.authentik_pub.tls.certresolver: "stepca"
      traefik.http.routers.authentik_pub.service: "authentik"

      # Embedded outpost callbacks (/outpost.goauthentik.io/...) on every
      # protected host. The high priority keeps it ahead of the host routers.
      # It matches every host, public ones included: see the README.
      traefik.http.routers.authentik_outpost.rule: "PathPrefix(`/outpost.goauthentik.io/`)"
      traefik.http.routers.authentik_outpost.entrypoints: "websecure"
      traefik.http.routers.authentik_outpost.tls: "true"
      traefik.http.routers.authentik_outpost.priority: "1000"
      traefik.http.routers.authentik_outpost.service: "authentik"

      # Forward-auth middleware, used by other routers as "authentik@docker".
      # Declared here on purpose: if this container is down, routers that use
      # it are disabled by Traefik instead of being served unauthenticated.
      traefik.http.middlewares.authentik.forwardauth.address: "http://authentik_server:9000/outpost.goauthentik.io/auth/traefik"
      traefik.http.middlewares.authentik.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authentik.forwardauth.authResponseHeaders: "X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"

  authentik_worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.6}
    container_name: authentik_worker
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik_postgresql:
        condition: service_healthy
    environment:
      <<: *authentik-env
      # Host names read by the blueprints (!Env). Kept out of the YAML files
      # so the repository holds no private name. The outpost sends browsers
      # to the public name when there is one (see the README), otherwise to
      # the internal name.
      BLUEPRINT_AUTHENTIK_HOST: ${AUTHENTIK_HOST_PUBLIC:-${AUTHENTIK_HOST_LOCAL:?Set AUTHENTIK_HOST_LOCAL in .env}}
      BLUEPRINT_UPTIME_HOST: ${UPTIME_HOST_LOCAL:?Set UPTIME_HOST_LOCAL in .env}
      # Must equal TRAEFIK_FQDN of the ng stack (host of the *arr paths).
      BLUEPRINT_NG_HOST: ${NG_HOST_LOCAL:?Set NG_HOST_LOCAL in .env}
      BLUEPRINT_PORTAINER_HOST: ${PORTAINER_HOST_LOCAL:?Set PORTAINER_HOST_LOCAL in .env}
      # Host of the Traefik dashboard router above.
      BLUEPRINT_TRAEFIK_HOST: ${TRAEFIK_HOST_LOCAL:?Set TRAEFIK_HOST_LOCAL in .env}
      # Must equal VICTORIA_LOGS_DOMAIN / VICTORIA_METRICS_DOMAIN /
      # VICTORIA_GRAFANA_DOMAIN of the victoria stack.
      BLUEPRINT_VICTORIA_LOGS_HOST: ${VICTORIA_LOGS_HOST_LOCAL:?Set VICTORIA_LOGS_HOST_LOCAL in .env}
      BLUEPRINT_VICTORIA_METRICS_HOST: ${VICTORIA_METRICS_HOST_LOCAL:?Set VICTORIA_METRICS_HOST_LOCAL in .env}
      BLUEPRINT_VICTORIA_GRAFANA_HOST: ${VICTORIA_GRAFANA_HOST_LOCAL:?Set VICTORIA_GRAFANA_HOST_LOCAL in .env}
      # Must equal ALERTMANAGER_DOMAIN of the victoria stack.
      BLUEPRINT_ALERTMANAGER_HOST: ${ALERTMANAGER_HOST_LOCAL:?Set ALERTMANAGER_HOST_LOCAL in .env}
      # Must equal FORGEJO_DOMAIN of the forgejo stack (OIDC redirect URI).
      BLUEPRINT_FORGEJO_HOST: ${FORGEJO_HOST_LOCAL:?Set FORGEJO_HOST_LOCAL in .env}
      # Must equal GRAMPSWEB_DOMAIN of the grampsweb stack (OIDC redirect URI).
      BLUEPRINT_GRAMPSWEB_HOST: ${GRAMPSWEB_HOST_LOCAL:?Set GRAMPSWEB_HOST_LOCAL in .env}
      # Must equal TRAEFIK_HOST_LOCAL of the immich stack (OIDC redirect URIs).
      BLUEPRINT_IMMICH_HOST: ${IMMICH_HOST_LOCAL:?Set IMMICH_HOST_LOCAL in .env}
      # Must equal TODO_DOMAIN of the todo stack (OIDC redirect URI).
      BLUEPRINT_DONETICK_HOST: ${DONETICK_HOST_LOCAL:?Set DONETICK_HOST_LOCAL in .env}
      # Must equal OLLAMA_DOMAIN of the ollama stack (OIDC redirect URI).
      BLUEPRINT_OLLAMA_HOST: ${OLLAMA_HOST_LOCAL:?Set OLLAMA_HOST_LOCAL in .env}
      # Library bookmarks of the network devices (host name or IP address).
      BLUEPRINT_UNIFI_HOST: ${UNIFI_HOST_LOCAL:?Set UNIFI_HOST_LOCAL in .env}
      BLUEPRINT_NAS_HOST: ${NAS_HOST_LOCAL:?Set NAS_HOST_LOCAL in .env}
      BLUEPRINT_SWITCH_HOST: ${SWITCH_HOST_LOCAL:?Set SWITCH_HOST_LOCAL in .env}
    # Unlike the official file, no "user: root" and no docker.sock: they are
    # only used to deploy extra outposts automatically. The embedded outpost
    # (inside authentik_server) is enough for Traefik forward auth.
    volumes:
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/data:/data
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/certs:/certs
      # Versioned blueprints, applied by the worker (see the README).
      - ./authentik/blueprints:/blueprints/custom:ro
      - ${MANAGEMENT_AUTHENTIK_DATA_DIR:?Set MANAGEMENT_AUTHENTIK_DATA_DIR in .env}/custom-templates:/templates
      - *localtime-volume
    networks:
      - authentik
    security_opt:
      - no-new-privileges:true

networks:
  traefik_gateway:
    name: traefik_gateway
  authentik:
    name: authentik
