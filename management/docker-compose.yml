x-localtime-volume: &localtime-volume "/etc/localtime:/etc/localtime:ro"
services:
  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api=true"
      - "--certificatesresolvers.stepca.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.stepca.acme.caserver=${ACME_CA_SERVER}"
    ports:
      - 80:80
      - 443:443
    environment:
      - LEGO_CA_CERTIFICATES=/etc/ssl/certs/${CA_CERT_NAME}
      - PROXMOX_HOST_LOCAL=${PROXMOX_HOST_LOCAL:?Set PROXMOX_HOST_LOCAL in .env}
      - PROXMOX_UPSTREAM_URL=${PROXMOX_UPSTREAM_URL:?Set PROXMOX_UPSTREAM_URL in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - *localtime-volume
      - ${MANAGEMENT_SHARE_CA_CERTIFICATES_DATA_DIR}/${CA_CERT_NAME}:/etc/ssl/certs/${CA_CERT_NAME}:ro
      - ./traefik.toml:/etc/traefik/traefik.toml:ro
      - ./acme:/etc/traefik/acme
      - ./traefik_dynamic.toml:/etc/traefik/traefik_dynamic.toml:ro
    networks:
      traefik_gateway:
    security_opt:
      - apparmor=docker-default
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.traefik.loadbalancer.server.port: "80"
      traefik.http.routers.traefik_http.rule: "Host(`${TRAEFIK_HOST_LOCAL}`) && (PathPrefix(`/traefik`)
        || PathPrefix(`/api`))"
      traefik.http.routers.traefik_http.entrypoints: "web"
      traefik.http.routers.traefik_http.middlewares: "redirect-https"
      traefik.http.routers.traefik.rule: "Host(`${TRAEFIK_HOST_LOCAL}`) && (PathPrefix(`/traefik`)
        || PathPrefix(`/api`))"
      traefik.http.routers.traefik.service: "api@internal"
      traefik.http.routers.traefik.entrypoints: "websecure"
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certresolver: "stepca"
      traefik.http.routers.traefik.middlewares: "traefik_strip"
      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true
      traefik.http.middlewares.traefik_strip.stripprefix.prefixes: "/traefik"

  portainer:
    container_name: portainer
    image: portainer/portainer-ee:alpine-sts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MANAGEMENT_PORTAINER_DATA_DIR}:/data
    networks:
      - traefik_gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.routers.portainer_http.rule: "Host(`${PORTAINER_HOST_LOCAL}`)"
      traefik.http.routers.portainer_http.entrypoints: web
      traefik.http.routers.portainer_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.services.portainer.loadbalancer.server.port: "9000"
      traefik.http.routers.portainer.rule: "Host(`${PORTAINER_HOST_LOCAL}`)"
      traefik.http.routers.portainer.entrypoints: "websecure"
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: "stepca"

      traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes: "/portainer"
      traefik.http.routers.portainer.middlewares: "portainer-stripprefix@docker"

