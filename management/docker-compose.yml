  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ${MANAGEMENT_UPTIME_KUMA_DATA_DIR}:/app/data
      - ${MANAGEMENT_SHARE_CA_CERTIFICATES_DATA_DIR}:/app/data/docker-tls:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_gateway
    environment:
      NODE_EXTRA_CA_CERTS: /app/data/docker-tls/${CA_CERT_NAME}
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.uptime.loadbalancer.server.port: "3001"
      traefik.http.routers.uptime_http.rule: "Host(`${UPTIME_HOST_LOCAL}`)"
      traefik.http.routers.uptime_http.entrypoints: web
      traefik.http.routers.uptime_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.uptime.rule: "Host(`${UPTIME_HOST_LOCAL}`)"
      traefik.http.routers.uptime.entrypoints: "websecure"
      traefik.http.routers.uptime.tls: "true"
      traefik.http.routers.uptime.tls.certresolver: "stepca"

networks:
  traefik_gateway:
    name: traefik_gateway
