# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Applications protected by Traefik forward auth, the embedded outpost that
# serves them, and Forgejo, which signs in through OpenID Connect instead
# (forward auth would break git over HTTPS, the API, fj and the runner).
#
# No host name is written here: they come from environment variables set on
# authentik_worker in docker-compose.yml (BLUEPRINT_* values, built from .env).
#
# Access is fail-closed: only members of the application group get through.
# Add users to the group in the admin UI (Directory > Groups).
#
# To protect another service: add a group, a provider, an application and a
# binding like the Uptime Kuma ones, add the provider to the outpost list at
# the end, then add the "authentik@docker" middleware to its Traefik router.
version: 1
metadata:
  name: Homelab - Forward auth applications
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # --- Uptime Kuma ---------------------------------------------------------
  - model: authentik_core.group
    id: uptime-kuma-group
    identifiers:
      name: uptime-kuma-users

  - model: authentik_providers_proxy.proxyprovider
    id: uptime-kuma-provider
    identifiers:
      name: Uptime Kuma
    attrs:
      mode: forward_single
      external_host: !Format ["https://%s", !Env BLUEPRINT_UPTIME_HOST]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12

  - model: authentik_core.application
    id: uptime-kuma-app
    identifiers:
      slug: uptime-kuma
    attrs:
      name: Uptime Kuma
      provider: !KeyOf uptime-kuma-provider
      meta_launch_url: !Format ["https://%s", !Env BLUEPRINT_UPTIME_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf uptime-kuma-app
      group: !KeyOf uptime-kuma-group
    attrs:
      order: 0

  # --- NG media stack ------------------------------------------------------
  # Radarr, Sonarr, Bazarr, Lidarr, SABnzbd and Prowlarr share one host, each
  # under its own path: one provider covers all of them. h5ai (root of that
  # host) and Seerr (own host, own logins) are not behind forward auth.
  - model: authentik_core.group
    id: media-group
    identifiers:
      name: media-users

  - model: authentik_providers_proxy.proxyprovider
    id: media-provider
    identifiers:
      name: NG media
    attrs:
      mode: forward_single
      external_host: !Format ["https://%s", !Env BLUEPRINT_NG_HOST]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12

  - model: authentik_core.application
    id: media-app
    identifiers:
      slug: ng-media
    attrs:
      name: NG media
      provider: !KeyOf media-provider
      meta_launch_url: !Format ["https://%s/radarr", !Env BLUEPRINT_NG_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf media-app
      group: !KeyOf media-group
    attrs:
      order: 0

  # --- Portainer -----------------------------------------------------------
  # Whole host behind forward auth, API included: the web UI calls /api with
  # the browser session. Portainer then signs users in through its own OAuth
  # client against the "Portainer SSO" OpenID Connect provider below.
  - model: authentik_core.group
    id: portainer-group
    identifiers:
      name: portainer-users

  - model: authentik_providers_proxy.proxyprovider
    id: portainer-provider
    identifiers:
      name: Portainer
    attrs:
      mode: forward_single
      external_host: !Format ["https://%s", !Env BLUEPRINT_PORTAINER_HOST]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12

  - model: authentik_core.application
    id: portainer-app
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      provider: !KeyOf portainer-provider
      meta_launch_url: !Format ["https://%s", !Env BLUEPRINT_PORTAINER_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf portainer-app
      group: !KeyOf portainer-group
    attrs:
      order: 0

  # Portainer OAuth login. Not a forward-auth provider: not in the outpost
  # list. Its own application, hidden from the library (blank://blank), so the
  # forward-auth one keeps the tile; same group. Authentik generates the
  # client secret on first apply and keeps it; copy it from the admin UI
  # (Applications > Providers > Portainer SSO) into the Portainer OAuth
  # settings, whose redirect URL must be the same root URL.
  - model: authentik_providers_oauth2.oauth2provider
    id: portainer-sso-provider
    identifiers:
      name: Portainer SSO
    attrs:
      client_type: confidential
      client_id: portainer
      # Empty by default on providers created by a blueprint: every
      # authorization request would fail ("otherwise malformed").
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/", !Env BLUEPRINT_PORTAINER_HOST]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: portainer-sso-app
    identifiers:
      slug: portainer-sso
    attrs:
      name: Portainer SSO
      provider: !KeyOf portainer-sso-provider
      meta_launch_url: blank://blank
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf portainer-sso-app
      group: !KeyOf portainer-group
    attrs:
      order: 0

  # --- OpenObserve ---------------------------------------------------------
  # Web UI behind forward auth. The ingestion endpoints (POST only) bypass it
  # in Traefik and keep OpenObserve Basic auth. OpenObserve keeps its own
  # login on top.
  - model: authentik_core.group
    id: openobserve-group
    identifiers:
      name: openobserve-users

  - model: authentik_providers_proxy.proxyprovider
    id: openobserve-provider
    identifiers:
      name: OpenObserve
    attrs:
      mode: forward_single
      external_host: !Format ["https://%s", !Env BLUEPRINT_OPENOBSERVE_HOST]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12

  - model: authentik_core.application
    id: openobserve-app
    identifiers:
      slug: openobserve
    attrs:
      name: OpenObserve
      provider: !KeyOf openobserve-provider
      meta_launch_url: !Format ["https://%s", !Env BLUEPRINT_OPENOBSERVE_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf openobserve-app
      group: !KeyOf openobserve-group
    attrs:
      order: 0

  # --- Forgejo (OpenID Connect) --------------------------------------------
  # Not a forward-auth provider: not in the outpost list. Authentik generates
  # the client secret on first apply and keeps it; copy it from the admin UI
  # (Applications > Providers > Forgejo) into the Forgejo authentication
  # source. The redirect URI matches a source named "authentik" in Forgejo.
  - model: authentik_core.group
    id: forgejo-group
    identifiers:
      name: forgejo-users

  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-provider
    identifiers:
      name: Forgejo
    attrs:
      client_type: confidential
      client_id: forgejo
      # Empty by default on providers created by a blueprint: every
      # authorization request would fail ("otherwise malformed").
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/user/oauth2/authentik/callback", !Env BLUEPRINT_FORGEJO_HOST]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: forgejo-app
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider
      meta_launch_url: !Format ["https://%s", !Env BLUEPRINT_FORGEJO_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf forgejo-app
      group: !KeyOf forgejo-group
    attrs:
      order: 0

  # --- Embedded outpost ----------------------------------------------------
  # The provider list is replaced as a whole: keep every forward-auth provider
  # here. authentik_host is the URL the browser is sent to for login.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      # Authentik creates this outpost at startup. Name and type are repeated
      # so the entry also works if the blueprint runs first.
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf uptime-kuma-provider
        - !KeyOf media-provider
        - !KeyOf portainer-provider
        - !KeyOf openobserve-provider
      config:
        authentik_host: !Format ["https://%s", !Env BLUEPRINT_AUTHENTIK_HOST]
        authentik_host_insecure: false
        log_level: info
