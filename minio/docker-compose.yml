
services:
  s3:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: [ "server", "/data"]
    volumes:
      - ${MINIO_S3_DATA_DIR}:/data
    environment: 
      MINIO_ACCESS_KEY: $MINIO_ACCESS_KEY
      MINIO_SECRET_KEY: $MINIO_SECRET_KEY
    ports:
      - "9000:9000"
