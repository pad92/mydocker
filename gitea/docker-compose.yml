x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-localtime-volume: &localtime-volume "/etc/localtime:/etc/localtime:ro"
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=${USER_UID:?Set USER_UID}
      - USER_GID=${USER_GID:?Set USER_GID}
      - GITEA__database__DB_TYPE=${GITEA__database__DB_TYPE:?Set GITEA__database__DB_TYPE}
      - GITEA__database__HOST=${GITEA__database__HOST:?Set GITEA__database__HOST}
      - GITEA__database__NAME=${GITEA__database__NAME:?Set GITEA__database__NAME}
      - GITEA__database__USER=${GITEA__database__USER:?Set GITEA__database__USER}
      - GITEA__database__PASSWD=${GITEA__database__PASSWD:?Set the existing database password}
      - GITEA__actions__ENABLED=${GITEA__actions__ENABLED}
      - GITEA__packages__ENABLED=${GITEA__packages__ENABLED}
      - GITEA__packages__DOCKER_V2_ENABLED=${GITEA__packages__DOCKER_V2_ENABLED}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__ROOT_URL=${GITEA__server__ROOT_URL:?Set GITEA__server__ROOT_URL}
    restart: always
    networks:
      - gitea
      - traefik_gateway
    volumes:
      - ${GITEA_DATA_DIR:?Set GITEA_DATA_DIR}:/data
      - /etc/timezone:/etc/timezone:ro
      - *localtime-volume
    ports:
      - "2222:22"
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.gitea.loadbalancer.server.port: "3000"

      traefik.http.routers.gitea_http.rule: "Host(`${GITEA_DOMAIN:?Set GITEA_DOMAIN}`)"
      traefik.http.routers.gitea_http.entrypoints: web
      traefik.http.routers.gitea_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      traefik.http.routers.gitea.rule: "Host(`${GITEA_DOMAIN:?Set GITEA_DOMAIN}`)"
      traefik.http.routers.gitea.entrypoints: "websecure"
      traefik.http.routers.gitea.tls: "true"
      traefik.http.routers.gitea.tls.certresolver: "stepca"

    logging: *default-logging
  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    container_name: gitea_db
    restart: always
    environment:
      - POSTGRES_USER=${GITEA__database__USER:?Set the existing database user}
      - POSTGRES_PASSWORD=${GITEA__database__PASSWD:?Set the existing database password}
      - POSTGRES_DB=${GITEA__database__NAME:?Set the existing database name}
    networks:
      - gitea
    volumes:
      - ${GITEA_DB_DATA_DIR:?Set the existing PostgreSQL directory}:/var/lib/postgresql/data

    logging: *default-logging
  runner:
    image: gitea/act_runner:latest
    container_name: gitea_runner
    restart: always
    depends_on:
      - gitea
    networks:
      - gitea
    volumes:
      - ${GITEA_RUNNER_DATA_DIR:?Set GITEA_RUNNER_DATA_DIR}:/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /var/run/docker.sock:/var/run/docker.sock   # Permet au runner de lancer des conteneurs Docker
    environment:
      - CONFIG_FILE=/data/config.yaml
      - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL:-http://gitea:3000}
        # Le token s'obtient dans l'interface Gitea (Admin > Actions > Runners)
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:?Set GITEA_RUNNER_NAME}
      - GITEA_RUNNER_LABELS=${GITEA_RUNNER_LABELS:?Set GITEA_RUNNER_LABELS}

    logging: *default-logging
networks:
  gitea:
    external: false
  traefik_gateway:
    external: true
