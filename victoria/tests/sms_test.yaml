# Unit tests for the sms_message transform of the vector_config pipeline: the
# Alertmanager webhook becomes the JSON body of the Free Mobile API.
# test_vector.sh sets FREE_MOBILE_USER=test-user and FREE_MOBILE_PASS=test-pass.
tests:
  - name: firing alerts become one line each, resolved ones are left out
    inputs:
      - insert_at: sms_message
        type: vrl
        source: |
          . = {
            "receiver": "sms", "status": "firing", "truncatedAlerts": 0,
            "groupLabels": {"alertname": "proxmox_storage_usage"},
            "alerts": [
              {"status": "firing", "labels": {"alertname": "proxmox_storage_usage", "storage": "local"},
               "annotations": {"summary": "Stockage Proxmox local occupe a 91%", "description": "x"}},
              {"status": "resolved", "labels": {"alertname": "proxmox_storage_usage", "storage": "nas"},
               "annotations": {"summary": "Stockage Proxmox nas occupe a 86%"}},
              {"status": "firing", "labels": {"alertname": "proxmox_storage_usage", "storage": "zfs"},
               "annotations": {"summary": "Stockage Proxmox zfs occupe a 88%"}}
            ]
          }
    outputs:
      - extract_from: sms_message
        conditions:
          - type: vrl
            source: |
              assert_eq!(., {
                "user": "test-user",
                "pass": "test-pass",
                "msg": "Stockage Proxmox local occupe a 91%\nStockage Proxmox zfs occupe a 88%"
              })

  - name: alerts cut by max_alerts are counted, a missing summary falls back to the alert name
    inputs:
      - insert_at: sms_message
        type: vrl
        source: |
          . = {
            "receiver": "sms", "status": "firing", "truncatedAlerts": 3,
            "alerts": [
              {"status": "firing", "labels": {"alertname": "authentik_silent"}, "annotations": {}}
            ]
          }
    outputs:
      - extract_from: sms_message
        conditions:
          - type: vrl
            source: |
              assert_eq!(.msg, "authentik_silent\n(+3 autres alertes)")

  - name: a long text is cut to 900 characters
    inputs:
      - insert_at: sms_message
        type: vrl
        source: |
          . = {"alerts": [{"status": "firing", "labels": {"alertname": "a"},
                           "annotations": {"summary": encode_base16(random_bytes!(600))}}]}
    outputs:
      - extract_from: sms_message
        conditions:
          - type: vrl
            source: |
              assert_eq!(strlen!(.msg), 900)

  - name: a webhook without firing alert sends nothing
    inputs:
      - insert_at: sms_message
        type: vrl
        source: |
          . = {"status": "resolved", "alerts": [{"status": "resolved", "labels": {"alertname": "a"},
                                                 "annotations": {"summary": "fini"}}]}
    no_outputs_from:
      - sms_message

  - name: a body that is not an Alertmanager webhook sends nothing
    inputs:
      - insert_at: sms_message
        type: vrl
        source: |
          . = {"msg": "spoofed", "user": "x"}
    no_outputs_from:
      - sms_message
