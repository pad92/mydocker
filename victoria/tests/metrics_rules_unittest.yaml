# Unit tests of the vmalert-metrics rules, run by test_alerting.sh with
# vmalert-tool on the rendered rules (production intervals, not the 5s
# test copy). Each rule gets a case that must fire and a case that must
# not. Expected labels are exact: the Alertmanager inhibit_rules match on
# host_name and device, so a label lost by an aggregation would silently
# inhibit the alert on every host.
rule_files:
  - metrics_rules.yml
evaluation_interval: 1m

tests:
  # A host that stops reporting fires after 10 minutes, with host_name
  # only; a host still reporting stays quiet.
  - name: host_metrics_silent
    interval: 1m
    input_series:
      - series: 'system_cpu_time_seconds_total{host_name="a", cpu="0", state="user"}'
        values: '0+60x10'
      - series: 'system_cpu_time_seconds_total{host_name="b", cpu="0", state="user"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 18m
        groupname: host_metrics
        alertname: host_metrics_silent
        exp_alerts: []
      - eval_time: 25m
        groupname: host_metrics
        alertname: host_metrics_silent
        exp_alerts:
          - exp_labels: {host_name: a, severity: critical}
            exp_annotations:
              summary: "Plus de metrique systeme de a depuis 10 minutes"
              description: "Le collecteur OpenTelemetry de l'hote n'envoie plus rien depuis 10 minutes : hote ou collecteur arrete"

  # Record read by the hosts and services dashboards: age of the newest
  # CPU sample, one series per host. With two CPUs, the host keeps the
  # oldest one (max), so a CPU that stops reporting still shows; a host
  # that still reports is at 0.
  - name: host_name:metrics_age_seconds:max record
    interval: 1m
    input_series:
      - series: 'system_cpu_time_seconds_total{host_name="a", cpu="0", state="user"}'
        values: '0+60x10'
      - series: 'system_cpu_time_seconds_total{host_name="a", cpu="1", state="user"}'
        values: '0+60x5'
      - series: 'system_cpu_time_seconds_total{host_name="b", cpu="0", state="user"}'
        values: '0+60x40'
    metricsql_expr_test:
      - expr: host_name:metrics_age_seconds:max
        eval_time: 25m
        exp_samples:
          - labels: 'host_name:metrics_age_seconds:max{host_name="a"}'
            value: 1200
          - labels: 'host_name:metrics_age_seconds:max{host_name="b"}'
            value: 0

  # A host gone for more than 24h leaves the lag window: the alert ends
  # once keep_firing_for (60m) is over instead of firing forever.
  - name: host_metrics_silent forgets a host after 24h
    interval: 10m
    input_series:
      - series: 'system_cpu_time_seconds_total{host_name="a", cpu="0", state="user"}'
        values: '0'
    alert_rule_test:
      - eval_time: 12h
        groupname: host_metrics
        alertname: host_metrics_silent
        exp_alerts:
          - exp_labels: {host_name: a, severity: critical}
            exp_annotations:
              summary: "Plus de metrique systeme de a depuis 10 minutes"
              description: "Le collecteur OpenTelemetry de l'hote n'envoie plus rien depuis 10 minutes : hote ou collecteur arrete"
      - eval_time: 26h
        groupname: host_metrics
        alertname: host_metrics_silent
        exp_alerts: []

  # Exporter freshness: 30 minutes without data, one alert per host
  # whatever the number of pools or disks.
  - name: zfs_data_missing and smart_data_missing
    interval: 1m
    input_series:
      - series: 'zfs_pool_health{host_name="a", pool="tank"}'
        values: '0x10'
      - series: 'zfs_pool_health{host_name="a", pool="rpool"}'
        values: '0x10'
      - series: 'zfs_pool_health{host_name="b", pool="tank"}'
        values: '0x60'
      - series: 'smartctl_device_smart_status{host_name="a", device="sda"}'
        values: '1x10'
      - series: 'smartctl_device_smart_status{host_name="a", device="sdb"}'
        values: '1x10'
      - series: 'smartctl_device_smart_status{host_name="b", device="sda"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 38m
        groupname: zfs
        alertname: zfs_data_missing
        exp_alerts: []
      - eval_time: 38m
        groupname: smart
        alertname: smart_data_missing
        exp_alerts: []
      - eval_time: 45m
        groupname: zfs
        alertname: zfs_data_missing
        exp_alerts:
          - exp_labels: {host_name: a, severity: warning}
            exp_annotations:
              summary: "Plus de donnee ZFS de a depuis 30 minutes"
              description: "zfs_exporter ou sa collecte est arrete : l'etat des pools n'est plus surveille"
      - eval_time: 45m
        groupname: smart
        alertname: smart_data_missing
        exp_alerts:
          - exp_labels: {host_name: a, severity: warning}
            exp_annotations:
              summary: "Plus de donnee SMART de a depuis 30 minutes"
              description: "smartctl_exporter ou sa collecte par le collecteur OpenTelemetry est arrete"

  # smart_status_failed carries host_name and device (inhibition source);
  # a healthy disk stays quiet.
  - name: smart_status_failed
    interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{host_name="a", device="sda"}'
        values: '1x5 0x10'
      - series: 'smartctl_device_smart_status{host_name="a", device="sdb"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 3m
        groupname: smart
        alertname: smart_status_failed
        exp_alerts: []
      - eval_time: 10m
        groupname: smart
        alertname: smart_status_failed
        exp_alerts:
          - exp_labels: {host_name: a, device: sda, severity: critical}
            exp_annotations:
              summary: "Disque sda de a : bilan SMART en echec"
              description: "Le disque annonce lui-meme une panne prochaine : sauvegarder et le remplacer"

  # A raw count that rises fires; a count that is high but constant (an
  # old disk, or a series that just appeared) does not.
  - name: smart_sectors_growing
    interval: 1m
    input_series:
      - series: 'smartctl_device_attribute{host_name="a", device="sda", attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"}'
        values: '0x5 2x10'
      - series: 'smartctl_device_attribute{host_name="a", device="sdb", attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"}'
        values: '_x5 8x10'
    alert_rule_test:
      - eval_time: 3m
        groupname: smart
        alertname: smart_sectors_growing
        exp_alerts: []
      - eval_time: 10m
        groupname: smart
        alertname: smart_sectors_growing
        exp_alerts:
          - exp_labels: {host_name: a, device: sda, attribute_name: Reallocated_Sector_Ct, severity: warning}
            exp_annotations:
              summary: "Disque sda de a : Reallocated_Sector_Ct +2 en 24h"
              description: "Des secteurs realloues, en attente ou illisibles apparaissent : le disque se degrade"

  # Inhibition pair: high (90-95%) and critical (>=95%) never fire for the
  # same filesystem. The aggregation keeps device and type, not host_name.
  - name: filesystem_usage high and critical are exclusive
    interval: 1m
    input_series:
      - series: 'system_filesystem_utilization_ratio{host_name="a", device="/dev/sda1", type="ext4"}'
        values: '0.92x30'
      - series: 'system_filesystem_utilization_ratio{host_name="a", device="/dev/sdb1", type="ext4"}'
        values: '0.97x30'
      - series: 'system_filesystem_utilization_ratio{host_name="a", device="/dev/sdc1", type="ext4"}'
        values: '0.5x30'
      - series: 'system_filesystem_utilization_ratio{host_name="a", device="tmpfs", type="tmpfs"}'
        values: '0.99x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: host_metrics
        alertname: filesystem_usage_high
        exp_alerts: []
      - eval_time: 20m
        groupname: host_metrics
        alertname: filesystem_usage_high
        exp_alerts:
          - exp_labels: {device: /dev/sda1, type: ext4, severity: warning}
            exp_annotations:
              summary: "Systeme de fichiers /dev/sda1 occupe a 92%"
              description: "Un systeme de fichiers depasse 90% d'occupation"
      - eval_time: 20m
        groupname: host_metrics
        alertname: filesystem_usage_critical
        exp_alerts:
          - exp_labels: {device: /dev/sdb1, type: ext4, severity: critical}
            exp_annotations:
              summary: "Systeme de fichiers /dev/sdb1 occupe a 97%"
              description: "Un systeme de fichiers depasse 95% d'occupation"

  # A unit failed for 5 minutes fires with host_name and the unit name;
  # a unit that fails and restarts within 2 minutes does not, nor the
  # active state series of a running unit. Two series of one unit (the
  # scope_version of two collector releases) give one alert. Once the
  # unit leaves the failed state, keep_firing_for holds the alert 5
  # minutes, then it resolves: no 24 hour tail as with the old log rule.
  - name: systemd_unit_failed
    interval: 1m
    input_series:
      - series: 'systemd_unit_state_ratio{host_name="a", systemd_unit_name="x.service", systemd_unit_active_state="failed", scope_version="1"}'
        values: '1x9 0x20'
      - series: 'systemd_unit_state_ratio{host_name="a", systemd_unit_name="y.service", systemd_unit_active_state="failed", scope_version="1"}'
        values: '1x2 0x27'
      - series: 'systemd_unit_state_ratio{host_name="a", systemd_unit_name="ok.service", systemd_unit_active_state="active", scope_version="1"}'
        values: '1x29'
      - series: 'systemd_unit_state_ratio{host_name="b", systemd_unit_name="z.service", systemd_unit_active_state="failed", scope_version="1"}'
        values: '1x29'
      - series: 'systemd_unit_state_ratio{host_name="b", systemd_unit_name="z.service", systemd_unit_active_state="failed", scope_version="2"}'
        values: '1x29'
    alert_rule_test:
      - eval_time: 3m
        groupname: host_metrics
        alertname: systemd_unit_failed
        exp_alerts: []
      - eval_time: 7m
        groupname: host_metrics
        alertname: systemd_unit_failed
        exp_alerts:
          - exp_labels: {host_name: a, systemd_unit_name: x.service, severity: warning}
            exp_annotations:
              summary: "Unit x.service en echec sur a"
              description: "Une unit systemd est en etat failed depuis 5 minutes"
          - exp_labels: {host_name: b, systemd_unit_name: z.service, severity: warning}
            exp_annotations:
              summary: "Unit z.service en echec sur b"
              description: "Une unit systemd est en etat failed depuis 5 minutes"
      - eval_time: 13m
        groupname: host_metrics
        alertname: systemd_unit_failed
        exp_alerts:
          - exp_labels: {host_name: a, systemd_unit_name: x.service, severity: warning}
            exp_annotations:
              summary: "Unit x.service en echec sur a"
              description: "Une unit systemd est en etat failed depuis 5 minutes"
          - exp_labels: {host_name: b, systemd_unit_name: z.service, severity: warning}
            exp_annotations:
              summary: "Unit z.service en echec sur b"
              description: "Une unit systemd est en etat failed depuis 5 minutes"
      - eval_time: 17m
        groupname: host_metrics
        alertname: systemd_unit_failed
        exp_alerts:
          - exp_labels: {host_name: b, systemd_unit_name: z.service, severity: warning}
            exp_annotations:
              summary: "Unit z.service en echec sur b"
              description: "Une unit systemd est en etat failed depuis 5 minutes"

  # A guest that just restarted fires; a stopped guest (uptime 0) and a
  # guest up for a long time do not.
  - name: proxmox_guest_restarted
    interval: 1m
    input_series:
      - series: 'proxmox_vm_uptime_seconds{name="web", vmid="101"}'
        values: '60+60x5'
      - series: 'proxmox_vm_uptime_seconds{name="stopped", vmid="102"}'
        values: '0x5'
      - series: 'proxmox_vm_uptime_seconds{name="old", vmid="103"}'
        values: '86400+60x5'
    alert_rule_test:
      - eval_time: 2m
        groupname: proxmox_metrics
        alertname: proxmox_guest_restarted
        exp_alerts:
          - exp_labels: {name: web, vmid: "101", severity: warning}
            exp_annotations:
              summary: "Invite Proxmox web (101) redemarre il y a 180 s"
              description: "Une VM ou un conteneur Proxmox a redemarre (uptime sous 10 minutes, les invites arretes sont ignores)"

  # Send errors in every 10 minute window for 15 minutes fire; a single
  # burst (an Alertmanager restart) does not.
  - name: vmalert_send_failed
    interval: 1m
    input_series:
      - series: 'vmalert_alerts_send_errors_total{job="vmalert-logs", addr="alertmanager:9093"}'
        values: '0x5 3x30'
      - series: 'vmalert_alerts_send_errors_total{job="vmalert-metrics", addr="alertmanager:9093"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: victoria_stack
        alertname: vmalert_send_failed
        exp_alerts: []
      - eval_time: 25m
        groupname: victoria_stack
        alertname: vmalert_send_failed
        exp_alerts:
          - exp_labels: {job: vmalert-metrics, severity: warning}
            exp_annotations:
              summary: "vmalert-metrics n'arrive plus a envoyer ses alertes a Alertmanager"
              description: "Des alertes declenchees n'atteignent pas Alertmanager : aucun SMS ne part pour elles"

  # Same shape for Alertmanager: one failed push does not fire, failures
  # in every 5 minute window for 10 minutes do.
  - name: alertmanager_notifications_failed
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook", receiver_name="watchdog", reason="other"}'
        values: '0x5 1x30'
      - series: 'alertmanager_notifications_failed_total{integration="webhook", receiver_name="sms", reason="other"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        groupname: victoria_stack
        alertname: alertmanager_notifications_failed
        exp_alerts:
          - exp_labels: {integration: webhook, receiver_name: sms, severity: warning}
            exp_annotations:
              summary: "Alertmanager n'arrive plus a notifier sms (webhook)"
              description: "Des notifications d'Alertmanager echouent : webhook injoignable ou en erreur"

  # One failed evaluation (a datasource restart) does not fire, two in
  # 2 hours do.
  - name: vmalert_rule_errors
    interval: 1m
    input_series:
      - series: 'vmalert_alerting_rules_errors_total{job="vmalert-logs", group="authentik", alertname="authentik_errors", id="1"}'
        values: '0x5 1x30'
      - series: 'vmalert_alerting_rules_errors_total{job="vmalert-logs", group="proxmox", alertname="proxmox_backup_failed", id="2"}'
        values: '0x5 1x5 2x20'
    alert_rule_test:
      - eval_time: 20m
        groupname: victoria_stack
        alertname: vmalert_rule_errors
        exp_alerts:
          - exp_labels: {job: vmalert-logs, group: proxmox, exported_alertname: proxmox_backup_failed, severity: warning}
            exp_annotations:
              summary: "Regle proxmox_backup_failed (vmalert-logs) en erreur a plusieurs evaluations"
              description: "vmalert n'arrive plus a evaluer une regle d'alerte : la regle ne peut plus se declencher"

  # unpoller up but without UniFi data fires after 10 minutes; a device
  # that stops reporting fires once its lag passes 10 minutes.
  - name: unifi
    interval: 1m
    input_series:
      # unpoller itself is up: only the UniFi data is missing.
      - series: 'up{job="unpoller"}'
        values: '1x40'
      - series: 'unpoller_device_uptime_seconds{name="ap1", source="https://unifi"}'
        values: '0+60x10'
      - series: 'unpoller_device_uptime_seconds{name="ap2", source="https://unifi"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: unifi_metrics
        alertname: unpoller_no_unifi_data
        exp_alerts: []
      - eval_time: 25m
        groupname: unifi_metrics
        alertname: unpoller_no_unifi_data
        exp_alerts:
          - exp_labels: {job: unpoller, severity: warning}
            exp_annotations:
              summary: "Aucune donnee UniFi collectee par unpoller depuis 10 minutes"
              description: "unpoller ne remonte aucun equipement UniFi : URL, compte ou controleur injoignable, ou unpoller arrete"
      - eval_time: 25m
        groupname: unifi_metrics
        alertname: unifi_device_down
        exp_alerts:
          - exp_labels: {name: ap1, source: "https://unifi", severity: critical}
            exp_annotations:
              summary: "Equipement UniFi ap1 absent depuis 10 minutes"
              description: "unpoller ne remonte plus cet equipement UniFi : hors ligne ou retire du controleur"
  # unpoller reports its devices: no unpoller_no_unifi_data alert.
  - name: unifi data present
    interval: 1m
    input_series:
      - series: 'up{job="unpoller"}'
        values: '1x40'
      - series: 'unpoller_device_info{job="unpoller", name="ap1"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 25m
        groupname: unifi_metrics
        alertname: unpoller_no_unifi_data
        exp_alerts: []

  # unpoller serves a frozen snapshot from minute 10: device_info stays
  # present, the uptimes stop moving. 15m window + for: 5m = fires at 30m,
  # not before.
  - name: unifi data stale
    interval: 1m
    input_series:
      - series: 'unpoller_device_info{job="unpoller", name="ap1"}'
        values: '1x60'
      - series: 'unpoller_device_uptime_seconds{job="unpoller", name="ap1"}'
        values: '0+60x10 600x50'
      - series: 'unpoller_device_uptime_seconds{job="unpoller", name="ap2"}'
        values: '0+60x10 600x50'
    alert_rule_test:
      - eval_time: 27m
        groupname: unifi_metrics
        alertname: unpoller_unifi_data_stale
        exp_alerts: []
      - eval_time: 32m
        groupname: unifi_metrics
        alertname: unpoller_no_unifi_data
        exp_alerts: []
      - eval_time: 32m
        groupname: unifi_metrics
        alertname: unpoller_unifi_data_stale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Donnees UniFi figees dans unpoller depuis 20 minutes"
              description: "unpoller repond mais l'uptime d'aucun equipement UniFi n'a change : la collecte aupres du controleur echoue (TLS, compte, API)"
  # One device frozen (offline, its last value kept) while another still
  # moves: collection works, no stale alert.
  - name: unifi data fresh
    interval: 1m
    input_series:
      - series: 'unpoller_device_uptime_seconds{job="unpoller", name="ap1"}'
        values: '0+60x10 600x50'
      - series: 'unpoller_device_uptime_seconds{job="unpoller", name="ap2"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 45m
        groupname: unifi_metrics
        alertname: unpoller_unifi_data_stale
        exp_alerts: []

  # Watchdog: fires while the SMS path is healthy, stops at once (no
  # keep_firing_for) when vector goes down or free_mobile fails.
  # An old, constant error count does not stop it once the 30m window
  # no longer holds the start of the series. VictoriaMetrics counts the
  # first sample of a new series in increase(): the first free_mobile
  # error after a vector restart stops the watchdog, as wanted.
  - name: watchdog healthy
    interval: 1m
    input_series:
      - series: 'up{job="vector"}'
        values: '1x50'
      - series: 'up{job="victorialogs"}'
        values: '1x50'
      - series: 'up{job="vmalert-logs"}'
        values: '1x50'
      - series: 'vector_component_errors_total{component_id="free_mobile"}'
        values: '4x50'
    alert_rule_test:
      - eval_time: 10m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts: []
      - eval_time: 40m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: "Chaine d'alerte victoria operationnelle"
              description: "Toujours active tant que la chaine SMS fonctionne ; Uptime Kuma alerte quand elle se tait"
  - name: watchdog stops
    interval: 1m
    input_series:
      - series: 'up{job="vector"}'
        values: '1x10 0x10'
      - series: 'up{job="victorialogs"}'
        values: '1x20'
      - series: 'up{job="vmalert-logs"}'
        values: '1x20'
      - series: 'vector_component_errors_total{component_id="free_mobile"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: "Chaine d'alerte victoria operationnelle"
              description: "Toujours active tant que la chaine SMS fonctionne ; Uptime Kuma alerte quand elle se tait"
      - eval_time: 12m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts: []
  - name: watchdog stops on free_mobile errors
    interval: 1m
    input_series:
      - series: 'up{job="vector"}'
        values: '1x20'
      - series: 'up{job="victorialogs"}'
        values: '1x20'
      - series: 'up{job="vmalert-logs"}'
        values: '1x20'
      - series: 'vector_component_errors_total{component_id="free_mobile"}'
        values: '0x10 1x10'
    alert_rule_test:
      - eval_time: 15m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts: []
  - name: watchdog stops when vmalert-logs was never scraped
    interval: 1m
    input_series:
      - series: 'up{job="vector"}'
        values: '1x20'
      - series: 'up{job="victorialogs"}'
        values: '1x20'
      - series: 'vector_component_errors_total{component_id="free_mobile"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        groupname: victoria_stack
        alertname: watchdog
        exp_alerts: []
  # 1 GB less every 10 minutes from 500 GB: 576 GB lost in 4 days, empty
  # before. Both stores fire (the or keeps both), and only after the for.
  - name: victoria_disk_fill_predicted fires for both stores after 1h
    interval: 10m
    input_series:
      - series: 'vm_free_disk_space_bytes{job="victoriametrics",instance="victoriametrics:8428",path="/data"}'
        values: '500e9-1e9x30'
      - series: 'vl_free_disk_space_bytes{job="victorialogs",instance="victorialogs:9428",path="/data"}'
        values: '500e9-1e9x30'
    alert_rule_test:
      - eval_time: 50m
        groupname: victoria_stack
        alertname: victoria_disk_fill_predicted
        exp_alerts: []
      - eval_time: 2h
        groupname: victoria_stack
        alertname: victoria_disk_fill_predicted
        exp_alerts:
          - exp_labels: {job: victoriametrics, instance: "victoriametrics:8428", path: /data, severity: warning}
            exp_annotations:
              summary: "Disque /data de victoriametrics plein dans moins de 4 jours au rythme actuel"
              description: "L'espace libre baisse assez vite pour etre epuise en 4 jours : ingestion en hausse ou retention trop longue"
          - exp_labels: {job: victorialogs, instance: "victorialogs:9428", path: /data, severity: warning}
            exp_annotations:
              summary: "Disque /data de victorialogs plein dans moins de 4 jours au rythme actuel"
              description: "L'espace libre baisse assez vite pour etre epuise en 4 jours : ingestion en hausse ou retention trop longue"
  # 100 MB less every 10 minutes from 500 GB: 57.6 GB in 4 days, room left.
  - name: victoria_disk_fill_predicted stays quiet on a slow decline
    interval: 10m
    input_series:
      - series: 'vm_free_disk_space_bytes{job="victoriametrics",instance="victoriametrics:8428",path="/data"}'
        values: '500e9-1e8x30'
      - series: 'vl_free_disk_space_bytes{job="victorialogs",instance="victorialogs:9428",path="/data"}'
        values: '500e9-1e8x30'
    alert_rule_test:
      - eval_time: 4h
        groupname: victoria_stack
        alertname: victoria_disk_fill_predicted
        exp_alerts: []
  # Rows until 10m, none after: fires once 5 minutes pass without a row.
  - name: victorialogs_ingestion_stopped fires when rows stop
    interval: 1m
    input_series:
      - series: 'vl_rows_ingested_total{type="jsonline"}'
        values: '0+100x10 1000x20'
      - series: 'up{job="victorialogs"}'
        values: '1x30'
    alert_rule_test:
      # Rows stop after 10m: increase[5m] is 0 from 15m, pending for 2m.
      - eval_time: 16m
        groupname: victoria_stack
        alertname: victorialogs_ingestion_stopped
        exp_alerts: []
      - eval_time: 18m
        groupname: victoria_stack
        alertname: victorialogs_ingestion_stopped
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "VictoriaLogs ne recoit plus aucun log depuis plus de 5 minutes"
              description: "VictoriaLogs repond mais n'ecrit plus de ligne : Vector n'envoie plus rien, les alertes sur les logs sont aveugles"
  # Restart: the counter starts again from 0, the first evaluation sees one
  # sample and an increase of 0. for: 2m keeps it from firing.
  - name: victorialogs_ingestion_stopped stays quiet after a restart
    interval: 1m
    input_series:
      - series: 'vl_rows_ingested_total{type="jsonline"}'
        values: '0+100x30'
      - series: 'up{job="victorialogs"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        groupname: victoria_stack
        alertname: victorialogs_ingestion_stopped
        exp_alerts: []
  # A stopped victorialogs is victoria_component_down, not this alert.
  - name: victorialogs_ingestion_stopped stays quiet when victorialogs is down
    interval: 1m
    input_series:
      - series: 'vl_rows_ingested_total{type="jsonline"}'
        values: '0+100x10 1000x20'
      - series: 'up{job="victorialogs"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 20m
        groupname: victoria_stack
        alertname: victorialogs_ingestion_stopped
        exp_alerts: []
  # One row a minute is still ingestion.
  - name: victorialogs_ingestion_stopped stays quiet on a trickle
    interval: 1m
    input_series:
      - series: 'vl_rows_ingested_total{type="jsonline"}'
        values: '0+100x10 1000x20'
      - series: 'vl_rows_ingested_total{type="elasticsearch"}'
        values: '0+1x30'
      - series: 'up{job="victorialogs"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        groupname: victoria_stack
        alertname: victorialogs_ingestion_stopped
        exp_alerts: []
  # Threshold edge: 5 errors fire, 4 do not; free_mobile is left to the
  # watchdog whatever its count.
  - name: vector_component_errors fires at 5 errors, not 4, never free_mobile
    interval: 1m
    input_series:
      - series: 'vector_component_errors_total{component_id="victorialogs"}'
        values: '0x5 5x20'
      - series: 'vector_component_errors_total{component_id="journald"}'
        values: '0x5 4x20'
      - series: 'vector_component_errors_total{component_id="free_mobile"}'
        values: '0x5 50x20'
    alert_rule_test:
      - eval_time: 10m
        groupname: victoria_stack
        alertname: vector_component_errors
        exp_alerts:
          - exp_labels: {component_id: victorialogs, severity: warning}
            exp_annotations:
              summary: "Vector : 5 erreurs du composant victorialogs en 30 minutes"
              description: "Un composant de Vector echoue : des logs ou des metriques sont perdus ou retardes"
  # Login refused from minute 5: quiet at 14m (9 minutes), firing at
  # 16m. A logged-in exporter (1) never fires.
  - name: freebox_auth_failed fires after 10 minutes of refused login
    interval: 1m
    input_series:
      - series: 'fbx_exporter_authenticated{job="freebox", instance="freebox-exporter:9102"}'
        values: '1x4 0x20'
    alert_rule_test:
      - eval_time: 14m
        groupname: freebox_metrics
        alertname: freebox_auth_failed
        exp_alerts: []
      - eval_time: 16m
        groupname: freebox_metrics
        alertname: freebox_auth_failed
        exp_alerts:
          - exp_labels: {job: freebox, instance: "freebox-exporter:9102", severity: warning}
            exp_annotations:
              summary: "Freebox : l'exporter n'est plus autorise depuis 10 minutes"
              description: "La Freebox refuse le login de freebox-exporter (code dans fbx_exporter_authentication_error et le log) : token revoque ou droits retires, l'enregistrer a nouveau"
  - name: freebox_auth_failed stays quiet while the login works
    interval: 1m
    input_series:
      - series: 'fbx_exporter_authenticated{job="freebox"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        groupname: freebox_metrics
        alertname: freebox_auth_failed
        exp_alerts: []
  # system fails from minute 5: quiet at 34m, firing at 36m; connection
  # recovers at minute 20 and never fires.
  - name: freebox_collector_failed fires per collector after 30 minutes
    interval: 1m
    input_series:
      - series: 'fbx_exporter_collector_success{job="freebox", collector="system"}'
        values: '1x4 0x40'
      - series: 'fbx_exporter_collector_success{job="freebox", collector="connection"}'
        values: '1x4 0x15 1x25'
    alert_rule_test:
      - eval_time: 34m
        groupname: freebox_metrics
        alertname: freebox_collector_failed
        exp_alerts: []
      - eval_time: 36m
        groupname: freebox_metrics
        alertname: freebox_collector_failed
        exp_alerts:
          - exp_labels: {job: freebox, collector: system, severity: warning}
            exp_annotations:
              summary: "Freebox : le collecteur system echoue depuis 30 minutes"
              description: "freebox-exporter ne lit plus ce module de l'API de la Freebox : ses metriques ne sont plus a jour, voir le log de l'exporter"

  # VRAM per process named after its container. pid 100 is in container
  # a (immich_machine_learning), whose last docker_container_info is
  # 2 h old at eval time: the 1-day lookback still names it. pid 200 is
  # in container b, never seen in the logs, and pid 300 is outside any
  # container (no container_id): both keep their series, without
  # container_name. The docker_container_info with an empty id must not
  # name pid 300. Container c logged under two hosts: one name, no
  # duplicate series.
  - name: container:nvidia_smi_compute_app_used_memory_bytes record
    interval: 1m
    input_series:
      - series: 'nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="100", process_name="python", container_id="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1000x180'
      - series: 'nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="200", process_name="ollama", container_id="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
        values: '2000x180'
      - series: 'nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="300", process_name="Xorg"}'
        values: '3000x180'
      - series: 'nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="400", process_name="audiomuse", container_id="cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}'
        values: '4000x180'
      - series: 'docker_container_info{host_name="chataigne", container_id="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", container_name="immich_machine_learning"}'
        values: '12x50'
      - series: 'docker_container_info{host_name="chataigne", container_id="", container_name="ghost"}'
        values: '5x180'
      - series: 'docker_container_info{host_name="chataigne", container_id="cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", container_name="audiomuse-ai-worker"}'
        values: '7x180'
      - series: 'docker_container_info{host_name="other", container_id="cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", container_name="audiomuse-ai-worker"}'
        values: '1x180'
    metricsql_expr_test:
      - expr: container:nvidia_smi_compute_app_used_memory_bytes
        eval_time: 170m
        exp_samples:
          - labels: 'container:nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="100", process_name="python", container_id="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", container_name="immich_machine_learning"}'
            value: 1000
          - labels: 'container:nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="200", process_name="ollama", container_id="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
            value: 2000
          - labels: 'container:nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="300", process_name="Xorg"}'
            value: 3000
          - labels: 'container:nvidia_smi_compute_app_used_memory_bytes{uuid="GPU-1", pid="400", process_name="audiomuse", container_id="cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", container_name="audiomuse-ai-worker"}'
            value: 4000

  # SNMP of the NAS: upsInfoStatus is 1 with the NUT status in its label.
  # A status change starts a new series and stops the old one. The
  # aggregation must drop job and upsInfoStatus and keep instance
  # (inhibition key). NAS a goes OL -> "OB DISCHRG" (OB first); a transfer
  # of one sample on NAS b is no outage; NAS c at "OL CHRG" stays quiet.
  - name: ups_on_battery
    interval: 1m
    input_series:
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OL"}'
        values: '1x3 stale _x9'
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OB DISCHRG"}'
        values: '_x4 1x9'
      - series: 'upsInfoStatus{job="synology", instance="b", upsInfoStatus="OL"}'
        values: '1x3 stale 1x9'
      - series: 'upsInfoStatus{job="synology", instance="b", upsInfoStatus="OB DISCHRG"}'
        values: '_x4 1 stale _x8'
      - series: 'upsInfoStatus{job="synology", instance="c", upsInfoStatus="OL CHRG"}'
        values: '1x14'
    alert_rule_test:
      - eval_time: 4m
        groupname: ups
        alertname: ups_on_battery
        exp_alerts: []
      - eval_time: 6m
        groupname: ups
        alertname: ups_on_battery
        exp_alerts:
          - exp_labels: {instance: a, severity: critical}
            exp_annotations:
              summary: "Onduleur sur batterie (lu par a)"
              description: "Coupure secteur : l'onduleur alimente les equipements sur sa batterie"

  # Fires at once on LB in the middle of the status ("OB LB DISCHRG");
  # NAS b on battery without LB stays quiet.
  - name: ups_low_battery
    interval: 1m
    input_series:
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OB DISCHRG"}'
        values: '1x3 _x5'
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OB LB DISCHRG"}'
        values: '_x3 1x5'
      - series: 'upsInfoStatus{job="synology", instance="b", upsInfoStatus="OB DISCHRG"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 2m
        groupname: ups
        alertname: ups_low_battery
        exp_alerts: []
      - eval_time: 5m
        groupname: ups
        alertname: ups_low_battery
        exp_alerts:
          - exp_labels: {instance: a, severity: critical}
            exp_annotations:
              summary: "Onduleur batterie faible (lu par a)"
              description: "La batterie de l'onduleur est presque vide : arret imminent des equipements"

  # Under 600s for 5 minutes; NAS b at the current 1407s stays quiet.
  - name: ups_runtime_low
    interval: 1m
    input_series:
      - series: 'upsBatteryRuntimeValue{job="synology", instance="a"}'
        values: '1407x2 300x12'
      - series: 'upsBatteryRuntimeValue{job="synology", instance="b"}'
        values: '1407x14'
    alert_rule_test:
      - eval_time: 6m
        groupname: ups
        alertname: ups_runtime_low
        exp_alerts: []
      - eval_time: 9m
        groupname: ups
        alertname: ups_runtime_low
        exp_alerts:
          - exp_labels: {instance: a, severity: warning}
            exp_annotations:
              summary: "Autonomie de l'onduleur a 5m 0s (lu par a)"
              description: "L'autonomie estimee sur batterie est sous 10 minutes"

  # 80% included (NAS c), 79% not (NAS b); 10 minutes before firing.
  - name: ups_overload
    interval: 1m
    input_series:
      - series: 'upsInfoLoadValue{job="synology", instance="a"}'
        values: '20x2 85x15'
      - series: 'upsInfoLoadValue{job="synology", instance="b"}'
        values: '79x17'
      - series: 'upsInfoLoadValue{job="synology", instance="c"}'
        values: '80x17'
    alert_rule_test:
      - eval_time: 11m
        groupname: ups
        alertname: ups_overload
        exp_alerts:
          - exp_labels: {instance: c, severity: warning}
            exp_annotations:
              summary: "Onduleur charge a 80% (lu par c)"
              description: "La charge de l'onduleur depasse 80% depuis 10 minutes"
      - eval_time: 13m
        groupname: ups
        alertname: ups_overload
        exp_alerts:
          - exp_labels: {instance: a, severity: warning}
            exp_annotations:
              summary: "Onduleur charge a 85% (lu par a)"
              description: "La charge de l'onduleur depasse 80% depuis 10 minutes"
          - exp_labels: {instance: c, severity: warning}
            exp_annotations:
              summary: "Onduleur charge a 80% (lu par c)"
              description: "La charge de l'onduleur depasse 80% depuis 10 minutes"

  # RB at the end of the status ("OL CHRG RB") fires; NAS b in "OL CHRG"
  # stays quiet.
  - name: ups_replace_battery
    interval: 1m
    input_series:
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OL CHRG"}'
        values: '1x2 _x5'
      - series: 'upsInfoStatus{job="synology", instance="a", upsInfoStatus="OL CHRG RB"}'
        values: '_x2 1x5'
      - series: 'upsInfoStatus{job="synology", instance="b", upsInfoStatus="OL CHRG"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 1m
        groupname: ups
        alertname: ups_replace_battery
        exp_alerts: []
      - eval_time: 4m
        groupname: ups
        alertname: ups_replace_battery
        exp_alerts:
          - exp_labels: {instance: a, severity: warning}
            exp_annotations:
              summary: "Batterie de l'onduleur a remplacer (lu par a)"
              description: "Le test de l'onduleur signale une batterie usee"

  # NAS a stops at 10m: quiet at 38m (28m old), fires at 45m (35m old).
  - name: ups_data_missing
    interval: 1m
    input_series:
      - series: 'upsBatteryChargeValue{job="synology", instance="a"}'
        values: '100x10'
      - series: 'upsBatteryChargeValue{job="synology", instance="b"}'
        values: '100x60'
    alert_rule_test:
      - eval_time: 38m
        groupname: ups
        alertname: ups_data_missing
        exp_alerts: []
      - eval_time: 45m
        groupname: ups
        alertname: ups_data_missing
        exp_alerts:
          - exp_labels: {instance: a, severity: warning}
            exp_annotations:
              summary: "Plus de donnee de l'onduleur via a depuis 30 minutes"
              description: "Le NAS ne voit plus l'onduleur en USB, ou sa collecte SNMP est arretee"
