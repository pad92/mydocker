# Unit tests for the normalize_level transform of the vector_config pipeline:
# one level field (debug, info, warn, error, crit) from the level of each source.
# Run with ./test_vector.sh (renders the compose file with .env.example first).
tests:
  - name: Authentik warning becomes warn
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          ak_level: "warning"
          severity: "INFO"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: Authentik critical becomes crit
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          ak_level: "critical"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: Authentik trace becomes debug
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          ak_level: "trace"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "debug")

  - name: Proxmox error stays error
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          pve_level: "error"
          body_priority: "6"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: journald priority 3 as a string becomes error
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: "3"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: journald priority 0 becomes crit
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: 0
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: journald priority 4 becomes warn
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: "4"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: journald priority 6 becomes info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: "6"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: journald priority 7 becomes debug
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: "7"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "debug")

  - name: journald priority wins over the OTLP severity
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          body_priority: "3"
          severity: "INFO"
          severity_number: 9
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: Docker severity text in any case
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "Error"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: OTLP WARN becomes warn
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "WARN"
          severity_number: 13
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: OTLP fatal becomes crit
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "fatal"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: syslog err becomes error
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "err"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: syslog notice becomes info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "notice"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: syslog emerg becomes crit
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "emerg"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: OTLP severity number alone
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity_number: 17
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: OTLP severity number 21 becomes crit
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity_number: 21
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: Unknown severity text falls back to the number
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: "X"
          severity_number: 5
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "debug")

  - name: Info without a usable source
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          severity: ""
          severity_number: 0
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: Info for an empty event
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: CEF severity 7 becomes error
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          cef_severity: 7
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: CEF severity 5 becomes warn
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          cef_severity: 5
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: CEF severity 2 becomes info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: "test"
          cef_severity: 2
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: logfmt level in the line
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: 'time="2026-11-27T01:00:23+01:00" level=warning msg=x'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: JSON level in the line
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '{"time":"x","level":"error","msg":"y"}'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: zerolog console token after colour codes
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: "\e[90m2026-11-27T01:03:12+01:00\e[0m \e[31mERR\e[0m Error calling http://auth.example"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: Go log letter of Forgejo
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '2026/11/27 00:49:22 ...eb/routing/logger.go:109:func1() [W] router: slow'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: NestJS LOG becomes info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: "\e[32m[Nest] 59  - \e[39m11/27/2026, 12:00:00 AM \e[32m    LOG\e[39m \e[33m[Svc]\e[39m done"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: NestJS ERROR becomes error
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '[Nest] 59  - 11/27/2026, 12:00:00 AM   ERROR [Svc] failed'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: bracket word after colour codes
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: "2026-11-26T23:58:00.030Z [\e[34mdebug\e[39m][Jobs]: Starting"
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "debug")

  - name: upper case word with a colon
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '2026-11-27T02:00:00+01:00 [MONITOR] WARN: Monitor down'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: Redis hash marker becomes warn
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '1:M 27 Nov 2026 00:00:02.724 # WARNING overcommit_memory is set to 0'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")

  - name: Redis star marker becomes info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '24770:C 27 Nov 2026 00:00:02.730 * DB saved on disk'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: journald message line
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body_message: 'level=error msg=boom'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")

  - name: syslog message line
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          message: '[Nest] 1  - x   FATAL [App] down'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "crit")

  - name: the severity field wins over the line
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          severity: "INFO"
          body: 'level=error msg=x'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: a plain line is info
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: '200 GET /api/setup/status with 155 bytes took 0ms'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")

  - name: an error word inside the text is not a level
    inputs:
      - insert_at: normalize_level
        type: log
        log_fields:
          body: 'Sync failed: error while syncing'
    outputs:
      - extract_from: normalize_level
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")
