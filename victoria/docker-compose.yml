                            "color": "red",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 10
                          },
                          {
                            "color": "green",
                            "value": 30
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                }
              ]
            },
            "options": {
              "showHeader": true,
              "cellHeight": "sm",
              "footer": {
                "show": false
              },
              "sortBy": [
                {
                  "displayName": "disque",
                  "desc": false
                }
              ]
            },
            "id": 26,
            "gridPos": {
              "x": 0,
              "y": 71,
              "w": 24,
              "h": 9
            }
          },
          {
            "type": "timeseries",
            "title": "Température des disques des hôtes",
            "description": "Température de chaque disque des hôtes. Ligne rouge : seuil de l'alerte smart_temperature_high (55 °C).",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "smartctl_device_temperature{host_name=~\"$$host_name\", temperature_type=\"current\"}",
                "legendFormat": "{{host_name}} {{device}}",
                "range": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "celsius",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "lineWidth": 1,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  },
                  "thresholdsStyle": {
                    "mode": "line"
                  }
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "transparent",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 55
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "id": 27,
            "gridPos": {
              "x": 0,
              "y": 80,
              "w": 8,
              "h": 8
            }
          },
          {
            "type": "timeseries",
            "title": "Secteurs défectueux des disques des hôtes",
            "description": "Secteurs réalloués, en attente et illisibles. Une courbe qui monte annonce une panne : l'alerte smart_sectors_growing se déclenche.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "max by (host_name, device, attribute_name) (smartctl_device_attribute{host_name=~\"$$host_name\", attribute_value_type=\"raw\", attribute_name=~\"Reallocated_Sector_Ct|Current_Pending_Sector|Current_Pending_ECC_Cnt|Offline_Uncorrectable\"})",
                "legendFormat": "{{host_name}} {{device}} {{attribute_name}}",
                "range": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "lineWidth": 1,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                },
                "min": 0
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "id": 28,
            "gridPos": {
              "x": 8,
              "y": 80,
              "w": 8,
              "h": 8
            }
          },
          {
            "type": "timeseries",
            "title": "Vie restante des SSD des hôtes",
            "description": "Valeur normalisée de l'attribut d'usure de chaque SSD des hôtes (100 : neuf). Elle baisse avec les écritures.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "max by (host_name, device) (smartctl_device_attribute{host_name=~\"$$host_name\", attribute_value_type=\"value\", attribute_name=~\"Percent_Lifetime_Remain|Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left\"}) or max by (host_name, device) (100 - smartctl_device_percentage_used{host_name=~\"$$host_name\"})",
                "legendFormat": "{{host_name}} {{device}}",
                "range": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "lineWidth": 1,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  },
                  "thresholdsStyle": {
                    "mode": "line"
                  }
                },
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "transparent",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 10
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "id": 29,
            "gridPos": {
              "x": 16,
              "y": 80,
              "w": 8,
              "h": 8
            }
          },
          {
            "type": "timeseries",
            "title": "Erreurs SMART journalisées",
            "description": "Nombre d'erreurs inscrites dans le journal d'erreurs SMART de chaque disque. Le compteur ne redescend pas : seule une hausse est à surveiller.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "max by (host_name, device) (smartctl_device_error_log_count{host_name=~\"$$host_name\", error_log_type=\"summary\"})",
                "legendFormat": "{{host_name}} {{device}}",
                "range": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "lineWidth": 1,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                },
                "decimals": 0
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "id": 31,
            "gridPos": {
              "x": 0,
              "y": 88,
              "w": 24,
              "h": 8
            }
          }
        ]
      }
  grafana_dashboard_services:
    content: |
      {
        "uid": "victoria-services",
        "title": "Services rendus",
        "tags": [
          "services",
          "victorialogs",
          "victoriametrics",
          "victoria"
        ],
        "editable": false,
        "timezone": "browser",
        "schemaVersion": 41,
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "refresh": "1m",
        "graphTooltip": 1,
        "links": [
          {
            "type": "dashboards",
            "tags": [
              "victoria"
            ],
            "asDropdown": true,
            "title": "Dashboards",
            "includeVars": false,
            "keepTime": true
          }
        ],
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "panels": [
          {
            "type": "row",
            "title": "Services rendus",
            "collapsed": false,
            "panels": [],
            "id": 1,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            }
          },
          {
            "type": "stat",
            "title": "Alertes actives",
            "description": "Règles d'alerte en état firing (hors watchdog), d'après le dernier état de chaque règle.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "_time:3m {log_stream=\"alerts\"} | last 1 by (_time) partition by (alert_source, alert_rule) | stats count() if (alert_state:=firing alert_severity:!=none) as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "Alertes",
                "url": "/d/victoria-alerts/alertes?$${__url_time_range}"
              }
            ],
            "id": 2,
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Requêtes HTTP",
            "description": "Requêtes routées par Traefik vers un service.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"traefik\"} app_requesthost:* -app_routername:~\"_ingest@\" | stats count() as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "color": {
                  "mode": "fixed",
                  "fixedColor": "blue"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "HTTP",
                "url": "/d/victoria-http/http?$${__url_time_range}"
              }
            ],
            "id": 3,
            "gridPos": {
              "x": 4,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Taux de 5xx",
            "description": "Part des réponses HTTP 5xx sur la période.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"traefik\"} app_requesthost:* -app_routername:~\"_ingest@\" | stats count() as total, count() if (app_downstreamstatus:>=500) as e | math e*100/total as pct | fields pct",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 1
                    },
                    {
                      "color": "red",
                      "value": 5
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "HTTP",
                "url": "/d/victoria-http/http?$${__url_time_range}"
              }
            ],
            "id": 4,
            "gridPos": {
              "x": 8,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Latence HTTP p95",
            "description": "95e percentile de la durée des requêtes, hors flux longs (WebSocket, /user/events).",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"traefik\"} app_requesthost:* -app_routername:~\"_ingest@\" | filter app_downstreamstatus:>0 not app_requestpath:=\"/user/events\" | stats quantile(0.95, app_duration) as p95",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "ns",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 500000000
                    },
                    {
                      "color": "red",
                      "value": 2000000000
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "HTTP",
                "url": "/d/victoria-http/http?$${__url_time_range}"
              }
            ],
            "id": 5,
            "gridPos": {
              "x": 12,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Requêtes DNS",
            "description": "Requêtes reçues par les résolveurs DNS.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"dns_queries\"} | stats count() as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "color": {
                  "mode": "fixed",
                  "fixedColor": "blue"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "DNS",
                "url": "/d/victoria-dns/dns?$${__url_time_range}"
              }
            ],
            "id": 6,
            "gridPos": {
              "x": 16,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Latence DNS p95 hors cache",
            "description": "95e percentile du temps de réponse des requêtes envoyées à un upstream.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"dns_queries\"} -body_cached:true -body_upstream:\"\" | stats quantile(0.95, body_elapsed) as p95",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "ns",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 100000000
                    },
                    {
                      "color": "red",
                      "value": 500000000
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "DNS",
                "url": "/d/victoria-dns/dns?$${__url_time_range}"
              }
            ],
            "id": 7,
            "gridPos": {
              "x": 20,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Connexions échouées",
            "description": "Échecs de connexion Authentik (mot de passe ou identifiant invalide).",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"authentik\"} ak_kind:=event ak_action:in(login_failed,invalid_identifier) | stats count() as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 5
                    },
                    {
                      "color": "red",
                      "value": 20
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "Authentik",
                "url": "/d/victoria-authentik/authentik?$${__url_time_range}"
              }
            ],
            "id": 8,
            "gridPos": {
              "x": 0,
              "y": 5,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Sauvegardes réussies",
            "description": "Sauvegardes de VM et conteneurs Proxmox terminées sans erreur.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"proxmox\"} pve_backup_event:=vm_ok | stats count() as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "color": {
                  "mode": "fixed",
                  "fixedColor": "green"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
              {
                "title": "Proxmox VE",
                "url": "/d/victoria-proxmox/proxmox-ve?$${__url_time_range}"
              }
            ],
            "id": 9,
            "gridPos": {
              "x": 4,
              "y": 5,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Sauvegardes en échec",
            "description": "Jobs ou VM en échec dans les sauvegardes Proxmox.",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"proxmox\"} pve_backup_event:in(job_failed,vm_failed) | stats count() as n",
                "queryType": "stats"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "links": [
