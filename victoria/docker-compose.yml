    content: |
      {
        "uid": "victoria-disks",
        "title": "Disques",
        "tags": [
          "disques",
          "victoriametrics",
          "victoria"
        ],
        "editable": false,
        "timezone": "browser",
        "schemaVersion": 41,
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "refresh": "1m",
        "graphTooltip": 1,
        "links": [
          {
            "type": "dashboards",
            "tags": [
              "victoria"
            ],
            "asDropdown": true,
            "title": "Dashboards",
            "includeVars": false,
            "keepTime": true
          },
          {
            "type": "link",
            "title": "Services rendus",
            "tooltip": "Vue globale",
            "icon": "dashboard",
            "url": "/d/victoria-services/services-rendus",
            "keepTime": true,
            "targetBlank": false
          }
        ],
        "templating": {
          "list": [
            {
              "name": "host_name",
              "label": "Hôte",
              "type": "query",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "definition": "label_values({__name__=~\"system_disk_io_bytes_total|smartctl_device\"}, host_name)",
              "query": {
                "qryType": 1,
                "query": "label_values({__name__=~\"system_disk_io_bytes_total|smartctl_device\"}, host_name)",
                "refId": "host_name"
              },
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "refresh": 2,
              "sort": 1,
              "current": {
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              }
            }
          ]
        },
        "annotations": {
          "list": []
        },
        "panels": [
          {
            "type": "row",
            "title": "État",
            "collapsed": false,
            "panels": [],
            "id": 1,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            }
          },
          {
            "type": "stat",
            "title": "Disques en défaut",
            "description": "Disques du NAS dont l'état ou la santé n'est pas normal, ou qui ont un secteur défectueux. Disques des hôtes dont le verdict SMART est en échec, ou qui ont un secteur en attente ou illisible.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "(sum(clamp_max(sum by (diskID) (diskStatus != bool 1) + sum by (diskID) (diskHealthStatus != bool 1) + sum by (diskID) (diskBadSector > bool 0), 1)) or vector(0)) + (count(max by (host_name, device) (smartctl_device_smart_status == 0) or max by (host_name, device) (smartctl_device_attribute{attribute_value_type=\"raw\", attribute_name=~\"Current_Pending_Sector|Current_Pending_ECC_Cnt|Offline_Uncorrectable\"} > 0) or max by (host_name, device) (smartctl_device_media_errors > 0)) or vector(0))",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 2,
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Attributs SMART en échec",
            "description": "Attributs SMART des disques durs du NAS dont le statut n'est pas OK, et attributs des disques des hôtes dont la valeur normalisée est descendue au seuil du constructeur.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "(count(diskSMARTAttrStatus{diskSMARTAttrStatus!=\"OK\"}) or vector(0)) + (count(smartctl_device_attribute{attribute_value_type=\"value\"} <= ignoring(attribute_value_type) (smartctl_device_attribute{attribute_value_type=\"thresh\"} > 0)) or vector(0))",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 3,
            "gridPos": {
              "x": 4,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Pools dégradés",
            "description": "Pools et volumes Synology qui ne sont pas normaux, et pools ZFS de Proxmox qui ne sont pas ONLINE.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "(sum(raidStatus != bool 1) or vector(0)) + (sum(zfs_pool_health != bool 0) or vector(0))",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "0",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 4,
            "gridPos": {
              "x": 8,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Température disque max",
            "description": "Température du disque le plus chaud, du NAS ou d'un hôte. Les alertes synology_temperature_high et smart_temperature_high se déclenchent au-dessus de 55 °C.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "max(diskTemperature or smartctl_device_temperature{temperature_type=\"current\"})",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "celsius",
                "noValue": "n/d",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 45
                    },
                    {
                      "color": "red",
                      "value": 55
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 5,
            "gridPos": {
              "x": 12,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Vie restante SSD min",
            "description": "Vie restante la plus basse des SSD, ceux de cache du NAS (selon Synology) et ceux des hôtes (attribut d'usure SMART). Les disques durs n'en ont pas.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "min((diskRemainLife >= 0) or max by (host_name, device) (smartctl_device_attribute{attribute_value_type=\"value\", attribute_name=~\"Percent_Lifetime_Remain|Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left\"}) or max by (host_name, device) (100 - smartctl_device_percentage_used))",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "noValue": "n/d",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 10
                    },
                    {
                      "color": "green",
                      "value": 30
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 6,
            "gridPos": {
              "x": 16,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "stat",
            "title": "Fragmentation ZFS max",
            "description": "Fragmentation de l'espace libre du pool ZFS le plus fragmenté. Au-delà de 50 %, les écritures ralentissent, surtout sur un pool presque plein.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "max(zfs_pool_fragmentation_ratio)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "noValue": "n/d",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0.5
                    },
                    {
                      "color": "red",
                      "value": 0.7
                    }
                  ]
                },
                "color": {
                  "mode": "thresholds"
                },
                "decimals": 1
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "value"
            },
            "id": 7,
            "gridPos": {
              "x": 20,
              "y": 1,
              "w": 4,
              "h": 4
            }
          },
          {
            "type": "row",
            "title": "NAS Synology : disques",
            "collapsed": false,
            "panels": [],
            "id": 8,
            "gridPos": {
              "x": 0,
              "y": 5,
              "w": 24,
              "h": 1
            }
          },
          {
            "type": "table",
            "title": "Disques du NAS",
            "description": "Un disque par ligne, avec l'état et la santé que rapporte Synology. n/d : valeur non fournie pour ce type de disque (vie restante des disques durs, secteurs défectueux des SSD).",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID, diskModel, diskType, diskRole) (diskTemperature * on(diskID) group_left(diskModel) diskModel * on(diskID) group_left(diskType) diskType * on(diskID) group_left(diskRole) diskRole)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskStatus)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "C",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskHealthStatus)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "D",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskRemainLife)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "E",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskBadSector)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "F",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskRetry)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              },
              {
                "refId": "G",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (diskID) (diskIdentifyFail)",
                "legendFormat": "__auto",
                "instant": true,
                "range": false,
                "format": "table"
              }
            ],
            "transformations": [
              {
                "id": "merge",
                "options": {}
              },
              {
                "id": "organize",
                "options": {
                  "excludeByName": {
                    "Time": true
                  },
                  "indexByName": {
                    "diskID": 0,
                    "diskModel": 1,
                    "diskType": 2,
                    "diskRole": 3,
                    "Value #B": 4,
                    "Value #C": 5,
                    "Value #A": 6,
                    "Value #D": 7,
                    "Value #E": 8,
                    "Value #F": 9,
                    "Value #G": 10
                  },
                  "renameByName": {
                    "diskID": "disque",
                    "diskModel": "modèle",
                    "diskType": "type",
                    "diskRole": "rôle",
                    "Value #A": "température",
                    "Value #B": "état",
                    "Value #C": "santé",
                    "Value #D": "vie restante",
                    "Value #E": "secteurs défectueux",
                    "Value #F": "retries",
                    "Value #G": "échecs d'identification"
                  }
                }
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "align": "auto",
                  "cellOptions": {
                    "type": "auto"
                  }
                }
              },
              "overrides": [
                {
                  "matcher": {
                    "id": "byName",
                    "options": "température"
                  },
                  "properties": [
                    {
                      "id": "unit",
                      "value": "celsius"
                    },
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "thresholds",
                      "value": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 45
                          },
                          {
                            "color": "red",
                            "value": 55
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "état"
                  },
                  "properties": [
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "mappings",
                      "value": [
                        {
                          "type": "value",
                          "options": {
                            "1": {
                              "text": "Normal",
                              "color": "green",
                              "index": 0
                            },
                            "2": {
                              "text": "Initialisé",
                              "color": "orange",
                              "index": 1
                            },
                            "3": {
                              "text": "Non initialisé",
                              "color": "orange",
                              "index": 2
                            },
                            "4": {
                              "text": "Partition système en échec",
                              "color": "red",
                              "index": 3
                            },
                            "5": {
                              "text": "En panne",
                              "color": "red",
                              "index": 4
                            }
                          }
                        }
                      ]
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "santé"
                  },
                  "properties": [
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "mappings",
                      "value": [
                        {
                          "type": "value",
                          "options": {
                            "1": {
                              "text": "Normal",
                              "color": "green",
                              "index": 0
                            },
                            "2": {
                              "text": "Avertissement",
                              "color": "orange",
                              "index": 1
                            },
                            "3": {
                              "text": "Critique",
                              "color": "red",
                              "index": 2
                            },
                            "4": {
                              "text": "En échec",
                              "color": "red",
                              "index": 3
                            }
                          }
                        }
                      ]
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "vie restante"
                  },
                  "properties": [
                    {
                      "id": "unit",
                      "value": "percent"
                    },
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "mappings",
                      "value": [
                        {
                          "type": "value",
                          "options": {
                            "-1": {
                              "text": "n/d",
                              "color": "transparent",
                              "index": 0
                            }
                          }
                        }
                      ]
                    },
                    {
                      "id": "thresholds",
                      "value": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 10
                          },
                          {
                            "color": "green",
                            "value": 30
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "secteurs défectueux"
                  },
                  "properties": [
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "mappings",
                      "value": [
                        {
                          "type": "value",
                          "options": {
                            "-1": {
                              "text": "n/d",
                              "color": "transparent",
                              "index": 0
                            }
                          }
                        }
                      ]
                    },
                    {
                      "id": "thresholds",
                      "value": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "red",
                            "value": 1
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "retries"
                  },
                  "properties": [
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "thresholds",
                      "value": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 1
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "échecs d'identification"
                  },
                  "properties": [
                    {
                      "id": "custom.cellOptions",
                      "value": {
                        "type": "color-background",
                        "mode": "basic"
                      }
                    },
                    {
                      "id": "thresholds",
                      "value": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "orange",
                            "value": 1
                          }
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "thresholds"
                      }
                    }
                  ]
                }
              ]
            },
            "options": {
