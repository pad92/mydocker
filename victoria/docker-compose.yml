            "title": "Erreurs récentes",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "victoriametrics-logs-datasource",
                  "uid": "victorialogs"
                },
                "editorMode": "code",
                "expr": "{log_stream=\"authentik\"} ak_component:in($$composant) ak_level:in(warning,error,critical) | fields _time, ak_component, ak_level, ak_kind, app_event, _msg | sort by (_time desc) | limit 100",
                "queryType": "instant"
              }
            ],
            "transformations": [
              {
                "id": "extractFields",
                "options": {
                  "source": "labels",
                  "format": "json",
                  "replace": true,
                  "keepTime": true
                }
              },
              {
                "id": "organize",
                "options": {
                  "indexByName": {
                    "Time": 0,
                    "ak_component": 1,
                    "ak_level": 2,
                    "ak_kind": 3,
                    "app_event": 4,
                    "_msg": 5
                  },
                  "renameByName": {
