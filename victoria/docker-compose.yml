            "description": "Clients classés par nombre de lignes de log de déconnexion sur la période : kicks envoyés par l'AP, désassociations et départs. Une même déconnexion écrit souvent plusieurs lignes (deauth, désassociation, départ), le total compte donc des lignes et non des événements. Le nom vient d'UniFi quand la MAC y est connue ; une MAC aléatoire (Wi-Fi privé) reste sans nom.",
