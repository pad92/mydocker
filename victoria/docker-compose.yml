x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  # Gives the data directories to the Victoria user before each start. Docker
  # creates a missing bind-mount source as root, and an earlier root run leaves
  # root-owned files; both stop the databases with "permission denied".
  victoria-init:
    image: busybox:1.37
    container_name: victoria-init
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - sh
      - -c
      - find /logs /metrics /alertmanager /grafana \( ! -user "$$PUID" -o ! -group "$$PGID" \) -exec chown -h "$$PUID:$$PGID" {} +
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
    volumes:
      - ${VICTORIA_LOGS_DATA_DIR:?Set VICTORIA_LOGS_DATA_DIR}:/logs
      - ${VICTORIA_METRICS_DATA_DIR:?Set VICTORIA_METRICS_DATA_DIR}:/metrics
      - ${ALERTMANAGER_DATA_DIR:?Set ALERTMANAGER_DATA_DIR}:/alertmanager
      - ${GRAFANA_DATA_DIR:?Set GRAFANA_DATA_DIR}:/grafana
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Log database. Written by vector only; the web UI (vmui) and the LogsQL API
  # sit behind Authentik. Port 9428 has no authentication of its own: every
  # container on traefik_gateway can query and write it.
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIA_LOGS_VERSION:-v1.54.0}
    container_name: victorialogs
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      victoria-init:
        condition: service_completed_successfully
    command:
      - -storageDataPath=/data
      - -retentionPeriod=${VICTORIA_LOGS_RETENTION:-30d}
      - -httpListenAddr=:9428
      # Docker records reach 1 MiB (otel_collector_docker_max_log_size in
      # myansible); the 256 KiB default would drop the longest ones.
      - -insert.maxLineSizeBytes=2MiB
    # Memory ceiling, well above the observed use. VictoriaLogs sizes its
    # caches from the cgroup limit; past it the kernel kills the process and
    # the container_oom alert fires. No healthcheck: the image has no shell
    # and no wget (see the README).
    mem_limit: 1g
    volumes:
      - ${VICTORIA_LOGS_DATA_DIR:?Set VICTORIA_LOGS_DATA_DIR}:/data
    networks:
      - traefik_gateway
      - victoria
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.victorialogs.loadbalancer.server.port: "9428"

      traefik.http.routers.victorialogs_http.rule: "Host(`${VICTORIA_LOGS_DOMAIN:?Set VICTORIA_LOGS_DOMAIN}`)"
      traefik.http.routers.victorialogs_http.entrypoints: web
      traefik.http.routers.victorialogs_http.middlewares: redirect-https

      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: true

      # The root page only lists links: open the UI directly. $$ is a literal $.
      traefik.http.middlewares.victorialogs-ui.redirectregex.regex: "^(https://[^/]+)/$$"
      traefik.http.middlewares.victorialogs-ui.redirectregex.replacement: "$${1}/select/vmui/"

      traefik.http.routers.victorialogs.rule: "Host(`${VICTORIA_LOGS_DOMAIN:?Set VICTORIA_LOGS_DOMAIN}`)"
      traefik.http.routers.victorialogs.entrypoints: "websecure"
      traefik.http.routers.victorialogs.tls: "true"
      traefik.http.routers.victorialogs.tls.certresolver: "stepca"
      # UI and query API behind Authentik forward auth (management stack).
      # authentik@docker comes first: it fails closed when Authentik is down.
      traefik.http.routers.victorialogs.middlewares: "authentik@docker,victorialogs-ui"
      traefik.http.routers.victorialogs.service: "victorialogs"
      # Health check bypass: GET/HEAD on /health only, which answers "OK".
      # Uptime Kuma cannot follow a browser login, and a 302 to Authentik
      # would only prove Authentik is up.
      traefik.http.routers.victorialogs_health.rule: "Host(`${VICTORIA_LOGS_DOMAIN:?Set VICTORIA_LOGS_DOMAIN}`) && (Method(`GET`) || Method(`HEAD`)) && Path(`/health`)"
      traefik.http.routers.victorialogs_health.entrypoints: "websecure"
      traefik.http.routers.victorialogs_health.tls: "true"
      traefik.http.routers.victorialogs_health.tls.certresolver: "stepca"
      traefik.http.routers.victorialogs_health.service: "victorialogs"
    logging: *default-logging

  # Metric database. Receives OTLP/HTTP metrics straight from the collectors
  # (the logs go through vector). Same exposure as victorialogs on port 8428.
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VICTORIA_METRICS_VERSION:-v1.156.0}
    container_name: victoriametrics
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      victoria-init:
        condition: service_completed_successfully
    command:
      - -storageDataPath=/data
      - -retentionPeriod=${VICTORIA_METRICS_RETENTION:-1y}
      - -httpListenAddr=:8428
      # system.cpu.time becomes system_cpu_time_seconds_total, as the
      # Prometheus exporters name it, so that usual queries work.
      - -opentelemetry.usePrometheusNaming
      # Pull targets (unpoller, snmp-exporter, freebox-exporter, nvidia-gpu-exporter),
      # in the victoriametrics_scrape entry under
      # configs: at the end of this file.
      - -promscrape.config=/etc/victoria/scrape.yml
    # Same reasoning as victorialogs. The healthcheck gates the start of the
    # vmalert instances (depends_on: service_healthy).
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      # Probe every 5s during start_period, so the vmalert instances
      # waiting on service_healthy start within seconds, not a minute.
      start_interval: 5s
    volumes:
      - ${VICTORIA_METRICS_DATA_DIR:?Set VICTORIA_METRICS_DATA_DIR}:/data
    configs:
      - source: victoriametrics_scrape
        target: /etc/victoria/scrape.yml
    networks:
      - traefik_gateway
      - victoria
    security_opt:
      - no-new-privileges:true
    labels:
      mydocker.config-hash: "f5f5ee6244a7889cbac55aa3e1bae58f8db8ffae37e9180210f587f57b72688f"
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.victoriametrics.loadbalancer.server.port: "8428"

      traefik.http.routers.victoriametrics_http.rule: "Host(`${VICTORIA_METRICS_DOMAIN:?Set VICTORIA_METRICS_DOMAIN}`)"
      traefik.http.routers.victoriametrics_http.entrypoints: web
      traefik.http.routers.victoriametrics_http.middlewares: redirect-https

      traefik.http.middlewares.victoriametrics-ui.redirectregex.regex: "^(https://[^/]+)/$$"
      traefik.http.middlewares.victoriametrics-ui.redirectregex.replacement: "$${1}/vmui/"

      traefik.http.routers.victoriametrics.rule: "Host(`${VICTORIA_METRICS_DOMAIN:?Set VICTORIA_METRICS_DOMAIN}`)"
      traefik.http.routers.victoriametrics.entrypoints: "websecure"
      traefik.http.routers.victoriametrics.tls: "true"
      traefik.http.routers.victoriametrics.tls.certresolver: "stepca"
      traefik.http.routers.victoriametrics.middlewares: "authentik@docker,victoriametrics-ui"
      traefik.http.routers.victoriametrics.service: "victoriametrics"
      # Ingestion bypass: POST of OTLP/HTTP metrics only, with the Basic auth
      # of the file middleware victoria-ingest-auth (management stack,
      # traefik_dynamic.toml). Collectors cannot follow a browser login.
      traefik.http.routers.victoriametrics_ingest.rule: "Host(`${VICTORIA_METRICS_DOMAIN:?Set VICTORIA_METRICS_DOMAIN}`) && Method(`POST`) && Path(`/opentelemetry/v1/metrics`)"
      traefik.http.routers.victoriametrics_ingest.entrypoints: "websecure"
      traefik.http.routers.victoriametrics_ingest.tls: "true"
      traefik.http.routers.victoriametrics_ingest.tls.certresolver: "stepca"
      traefik.http.routers.victoriametrics_ingest.middlewares: "victoria-ingest-auth@file"
      traefik.http.routers.victoriametrics_ingest.service: "victoriametrics"
      traefik.http.routers.victoriametrics_health.rule: "Host(`${VICTORIA_METRICS_DOMAIN:?Set VICTORIA_METRICS_DOMAIN}`) && (Method(`GET`) || Method(`HEAD`)) && Path(`/health`)"
      traefik.http.routers.victoriametrics_health.entrypoints: "websecure"
      traefik.http.routers.victoriametrics_health.tls: "true"
      traefik.http.routers.victoriametrics_health.tls.certresolver: "stepca"
      traefik.http.routers.victoriametrics_health.service: "victoriametrics"
    logging: *default-logging

  # UniFi metrics. Polls the UniFi gateway API with a local read-only
  # account and exposes Prometheus metrics on 9130, scraped by victoriametrics.
  # The unpoller network gives it a route to the gateway; it is not on
  # traefik_gateway, so the other stacks cannot read 9130. The gateway
  # certificate comes from the internal CA: the host bundle is mounted and
  # TLS is verified (the image default is verify_ssl = false). InfluxDB is
  # on in the image config and has to be turned off. Empty credentials stop
  # unpoller only (403 in its log), not the whole stack.
  unpoller:
    image: ghcr.io/unpoller/unpoller:${UNPOLLER_VERSION:-v5.9.6}
    container_name: unpoller
    restart: unless-stopped
    user: "65534:65534"
    environment:
      UP_UNIFI_DEFAULT_URL: "${UNIFI_URL:?Set UNIFI_URL}"
      UP_UNIFI_DEFAULT_USER: "${UNPOLLER_USER:-}"
      UP_UNIFI_DEFAULT_PASS: "${UNPOLLER_PASS:-}"
      UP_UNIFI_DEFAULT_VERIFY_SSL: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - unpoller
      - victoria
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Synology NAS metrics over SNMPv3 (authPriv, SHA and AES). victoriametrics
  # asks /snmp?target=<NAS>&module=...&auth=synology_v3, snmp-exporter walks
  # the NAS and answers in Prometheus format. Modules come from the snmp.yml
  # of the image; the auth comes from snmp_exporter_auth below, which holds
  # ${...} references only: the exporter fills them from its environment
  # (--config.expand-environment-variables), so no secret is written to the
  # config file. Empty passwords fail the scrape only (up = 0). The snmp
  # network gives it a route to the NAS; it is not on traefik_gateway.
  snmp-exporter:
    image: prom/snmp-exporter:${SNMP_EXPORTER_VERSION:-v0.31.0}-distroless
    container_name: snmp-exporter
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/auth.yml
      - --config.expand-environment-variables
      - --web.listen-address=:9116
    environment:
      SNMP_USER: "${SYNOLOGY_SNMP_USER:-snmp-victoria}"
      SNMP_AUTH_PASS: "${SYNOLOGY_SNMP_AUTH_PASS:-}"
      SNMP_PRIV_PASS: "${SYNOLOGY_SNMP_PRIV_PASS:-}"
    configs:
      - source: snmp_exporter_auth
        target: /etc/snmp_exporter/auth.yml
    labels:
      mydocker.config-hash: "8129f1198d98599288ca2834fe73aff27edbbda9190d93705075eb6f8a7a3088"
    networks:
      - snmp
      - victoria
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Freebox Delta metrics (bridge mode: connection, fiber and system only).
  # The exporter reads its app token from <data_directory>/token.dat. The
  # token is a secret, taken from FREEBOX_APP_TOKEN in the environment of
  # the stack and is written at start to /data, a tmpfs, never to the repo
  # or to a host directory. With no token the container waits and logs why,
  # instead of restarting in a loop. Registration is a one-time manual step
  # (see the README). TLS to the box is verified against the Freebox CAs
  # built into the exporter. The freebox network gives it a route to the box.
  freebox-exporter:
    image: ghcr.io/shackerd/freebox-exporter-rs:${FREEBOX_EXPORTER_VERSION:-v0.0.29-beta2@sha256:7da4b43dc9d1c6c87d4e561d4db274ab7e8766d62a390638b70368b324dbee0a}
    container_name: freebox-exporter
    restart: unless-stopped
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${FREEBOX_APP_TOKEN}" ]; then
          echo "FREEBOX_APP_TOKEN is empty: register the exporter, see the README" >&2
          exec sleep 2147483647
        fi
        umask 077
        printf '%s' "$${FREEBOX_APP_TOKEN}" > /data/token.dat
        unset FREEBOX_APP_TOKEN
        exec /usr/bin/freebox-exporter-rs -c /etc/freebox-exporter-rs/config.toml serve
    environment:
      FREEBOX_APP_TOKEN: "${FREEBOX_APP_TOKEN:-}"
    configs:
      - source: freebox_exporter_config
        target: /etc/freebox-exporter-rs/config.toml
    labels:
      mydocker.config-hash: "62cc9c8e01bcff453b7319e36d64395071b98d7c13dcfb4f91d3607fbd939a32"
    tmpfs: ["/data:size=16m,uid=65534,gid=65534,mode=0700"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://freebox-exporter:9102/metrics"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - freebox
      - victoria
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # GPU metrics of the host (NVML): totals and the VRAM of each process on
  # the GPU, with the id of its container. pid: host is required: NVML
  # returns host PIDs and the exporter reads /proc/<pid>/cgroup for the
  # container id. The container sees every host process, so it gets
  # nothing else: no capability, read-only root, nobody user, no port, no
  # Traefik label, only the internal victoria network. The device request
  # asks for the utility capability only (NVML, no CUDA). The image is
  # distroless (no shell, no wget): no healthcheck, the nvidia-gpu job of
  # victoriametrics_scrape (up) shows a dead exporter. The container name
  # of each process comes from container:nvidia_smi_compute_app_used_memory_bytes.
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:${NVIDIA_GPU_EXPORTER_VERSION:-1.18.0-nvml@sha256:bf82122fdf8cc960b1233e33dea82767a711343fa2919d525ca9199e83cc5195}
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    user: "65534:65534"
    pid: host
    read_only: true
    cap_drop: [ALL]
    command:
      - --collect.compute-apps
      - --collect.compute-apps-identity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [utility]
    networks:
      - victoria
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Log ingestion: OTLP/HTTP logs of the collectors and UDP syslog of the
  # network devices, parsed and written to victorialogs. Pipeline in the
  # vector_config entry under configs: at the end of this file.
  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.61.0}-distroless-libc
    container_name: vector
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    tmpfs:
      - /var/lib/vector
    ports:
      - "${VECTOR_SYSLOG_PORT:-514}:5514/udp"
    # Free Mobile SMS API credentials, read by the sms_message transform. Set
    # them in the .env of the host only. Empty: alerts are dropped with an error.
    environment:
      FREE_MOBILE_USER: ${FREE_MOBILE_USER:-}
      FREE_MOBILE_PASS: ${FREE_MOBILE_PASS:-}
    # Inline config instead of a ./vector.yaml bind mount: Portainer resolves
    # relative paths on its own disk, so Docker created an empty directory on
    # the host and failed with "mkdirat etc/vector/vector.yaml: file exists".
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml
    networks:
      - traefik_gateway
      - victoria
    # No healthcheck: the distroless image has no shell and no wget.
    depends_on:
      - victorialogs
    security_opt:
      - no-new-privileges:true
    labels:
      mydocker.config-hash: "7cea912fcde3eda6ef8e98f8dde1d2e8eb645a9d183809a4e9d08375d2c5dcf5"
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.vector.loadbalancer.server.port: "4318"
      # Ingestion: POST of OTLP/HTTP logs only, with the Basic auth of the file
      # middleware victoria-ingest-auth (management stack, traefik_dynamic.toml).
      # Longer than the UI rule, so Traefik tries it first.
      traefik.http.routers.vector_ingest.rule: "Host(`${VICTORIA_LOGS_DOMAIN:?Set VICTORIA_LOGS_DOMAIN}`) && Method(`POST`) && Path(`/v1/logs`)"
      traefik.http.routers.vector_ingest.entrypoints: "websecure"
      traefik.http.routers.vector_ingest.tls: "true"
      traefik.http.routers.vector_ingest.tls.certresolver: "stepca"
      traefik.http.routers.vector_ingest.middlewares: "victoria-ingest-auth@file"
      traefik.http.routers.vector_ingest.service: "vector"
    logging: *default-logging

  # Alert rules on the logs (LogsQL). One vmalert per datasource: a vmalert
  # instance queries a single one. Alerts go to alertmanager; the alert state
  # (ALERTS, ALERTS_FOR_STATE) is written to and restored from victoriametrics.
  # Internal network only: no route, no published port.
  vmalert-logs:
    image: victoriametrics/vmalert:${VMALERT_VERSION:-v1.156.0}
    container_name: vmalert-logs
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    command:
      - -rule=/etc/vmalert/rules.yml
      - -rule.defaultRuleType=vlogs
      - -datasource.url=http://victorialogs:9428
      - -notifier.url=http://alertmanager:9093
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -httpListenAddr=:8880
    configs:
      - source: vmalert_logs_rules
        target: /etc/vmalert/rules.yml
    labels:
      mydocker.config-hash: "c82e78e0fb0435de3efcb6ce7682503eb4240cf6352e46463268162619b1cde4"
    networks:
      - victoria
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8880/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # victorialogs has no healthcheck: started is the best Compose can check.
    depends_on:
      victorialogs:
        condition: service_started
      victoriametrics:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Alert rules on the metrics (MetricsQL). Same wiring as vmalert-logs.
  vmalert-metrics:
    image: victoriametrics/vmalert:${VMALERT_VERSION:-v1.156.0}
    container_name: vmalert-metrics
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    command:
      - -rule=/etc/vmalert/rules.yml
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -httpListenAddr=:8880
    configs:
      - source: vmalert_metrics_rules
        target: /etc/vmalert/rules.yml
    labels:
      mydocker.config-hash: "ecc2ded0702861ee6ea202932758f52256398ed5616089e1eccb2c51481d926a"
    networks:
      - victoria
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8880/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      victoriametrics:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Groups the alerts and sends them to the SMS bridge in vector, and the
  # watchdog to Uptime Kuma. The notification log and the silences persist in
  # ALERTMANAGER_DATA_DIR, so a restart does not send the SMS of a firing
  # alert again. Single instance: clustering (gossip) is off. The victoria
  # network, and the alertmanager network (which only it joins) as its route
  # out to Uptime Kuma; it is not on traefik_gateway, where any container
  # could reach its API on 9093. The host CA bundle verifies the step-ca
  # certificate of Uptime Kuma.
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.35.1}
    container_name: alertmanager
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      victoria-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.listen-address=:9093
      # receiver_name on alertmanager_notifications_failed_total, read by
      # the alertmanager_notifications_failed rule.
      - --enable-feature=receiver-name-in-metrics
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      # Probe every 5s during start_period, so the vmalert instances
      # waiting on service_healthy start within seconds, not a minute.
      start_interval: 5s
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    labels:
      mydocker.config-hash: "ee3648452f84070a8ea36defebde58df43c56b54f58259b15c1a41430877aa28"
    volumes:
      - ${ALERTMANAGER_DATA_DIR:?Set ALERTMANAGER_DATA_DIR}:/alertmanager
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - alertmanager
      - victoria
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Dashboards on VictoriaLogs and VictoriaMetrics, behind Authentik. Grafana
  # trusts the X-authentik-username header that the forward auth sets (auth
  # proxy): no Grafana password exists, login form and basic auth are off.
  # Port 3000 is not published, but a container on traefik_gateway that sends
  # the header itself is trusted too (see the README).
  # Separate from the grafana stack of this repository, hence the names.
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.7}
    container_name: victoria-grafana
    restart: unless-stopped
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    depends_on:
      victoria-init:
        condition: service_completed_successfully
    environment:
      GF_SERVER_ROOT_URL: "https://${VICTORIA_GRAFANA_DOMAIN:?Set VICTORIA_GRAFANA_DOMAIN}/"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-authentik-username
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      # No password login at all: the admin account created at the first
      # start keeps a default password that must never be usable. The form and
      # Basic auth off are enough (POST /login answers auth.client.notConfigured);
      # GF_AUTH_DISABLE_LOGIN would also break auth.proxy (HTTP 500 in 13.2).
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # This Authentik user is the Grafana server admin; the others get
      # GRAFANA_DEFAULT_ROLE in the main organization when they first log in.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "${GRAFANA_DEFAULT_ROLE:-Viewer}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Installed before Grafana starts, so the provisioned datasource exists.
      GF_PLUGINS_PREINSTALL_SYNC: "victoriametrics-logs-datasource@${GRAFANA_LOGS_PLUGIN_VERSION:-0.34.0}"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/victoria.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/victoria.yaml
      - source: grafana_dashboard_authentik
        target: /etc/grafana/dashboards/Applications/authentik.json
      - source: grafana_dashboard_proxmox
        target: /etc/grafana/dashboards/Infrastructure/proxmox.json
      - source: grafana_dashboard_unifi
        target: /etc/grafana/dashboards/Équipements réseau/unifi.json
      - source: grafana_dashboard_synology
        target: /etc/grafana/dashboards/Infrastructure/synology.json
      - source: grafana_dashboard_hosts
        target: /etc/grafana/dashboards/hosts.json
      - source: grafana_dashboard_logs
        target: /etc/grafana/dashboards/logs.json
      - source: grafana_dashboard_docker
        target: /etc/grafana/dashboards/Applications/docker.json
      - source: grafana_dashboard_dns
        target: /etc/grafana/dashboards/Équipements réseau/dns.json
      - source: grafana_dashboard_firewall
        target: /etc/grafana/dashboards/Équipements réseau/firewall.json
      - source: grafana_dashboard_http
        target: /etc/grafana/dashboards/Applications/http.json
      - source: grafana_dashboard_alerts
        target: /etc/grafana/dashboards/alerts.json
      - source: grafana_dashboard_disks
        target: /etc/grafana/dashboards/Infrastructure/disks.json
      - source: grafana_dashboard_services
        target: /etc/grafana/dashboards/services.json
      - source: grafana_dashboard_stack
        target: /etc/grafana/dashboards/Infrastructure/stack.json
      - source: grafana_dashboard_freebox
        target: /etc/grafana/dashboards/Équipements réseau/freebox.json
      - source: grafana_dashboard_network
        target: /etc/grafana/dashboards/network.json
      - source: grafana_dashboard_wifi
        target: /etc/grafana/dashboards/Équipements réseau/wifi.json
    volumes:
      - ${GRAFANA_DATA_DIR:?Set GRAFANA_DATA_DIR}:/var/lib/grafana
    # traefik_gateway for Traefik and to download the plugin; victoria for
    # the datasources.
    networks:
      - traefik_gateway
      - victoria
    security_opt:
      - no-new-privileges:true
    labels:
      mydocker.config-hash: "8cc1de8fbaf7d19c0096c79157660616c257df02ae100d80605fd2fe94a612e3"
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.victoria_grafana.loadbalancer.server.port: "3000"

      traefik.http.routers.victoria_grafana_http.rule: "Host(`${VICTORIA_GRAFANA_DOMAIN:?Set VICTORIA_GRAFANA_DOMAIN}`)"
      traefik.http.routers.victoria_grafana_http.entrypoints: web
      traefik.http.routers.victoria_grafana_http.middlewares: redirect-https

      traefik.http.routers.victoria_grafana.rule: "Host(`${VICTORIA_GRAFANA_DOMAIN:?Set VICTORIA_GRAFANA_DOMAIN}`)"
      traefik.http.routers.victoria_grafana.entrypoints: "websecure"
      traefik.http.routers.victoria_grafana.tls: "true"
      traefik.http.routers.victoria_grafana.tls.certresolver: "stepca"
      # authentik@docker first: it fails closed, and it replaces any
      # X-authentik-username header that the client sent.
      traefik.http.routers.victoria_grafana.middlewares: "authentik@docker"
      traefik.http.routers.victoria_grafana.service: "victoria_grafana"
    logging: *default-logging

  # MCP server for Grafana (dashboards, datasource queries), read-only. Served
  # on the Grafana domain under /mcp, without Authentik: MCP clients cannot
  # follow the OAuth redirect of the forward auth. The bearer token
  # GRAFANA_MCP_SERVER_TOKEN is the only barrier, so keep it long and secret.
  # It reaches Grafana on the internal network with the token of a Viewer
  # service account (see the README). The image has no wget or curl, hence no
  # healthcheck.
  grafana-mcp:
    image: grafana/mcp-grafana:${GRAFANA_MCP_VERSION:-2.4.0}
    container_name: victoria-grafana-mcp
    restart: unless-stopped
    depends_on:
      - grafana
    # The image entrypoint forces --transport sse; replaced as a whole.
    # mcp-grafana serves without any client authentication when its server
    # token is empty, so the shell refuses to start it with an empty or short
    # token (fail closed). It waits and logs why, instead of restarting in a
    # loop. The tokens default to empty here, not ${...:?}, so that the tests
    # can render the compose file with .env.example.
    # --allowed-hosts: the default (loopback) rejects requests that come
    # through Traefik. No --allowed-origins: requests with an Origin header
    # (browsers) are rejected.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${#MCP_GRAFANA_SERVER_TOKEN}" -lt 32 ] || [ -z "$${GRAFANA_SERVICE_ACCOUNT_TOKEN}" ]; then
          echo "GRAFANA_MCP_SERVER_TOKEN (32 characters or more) or GRAFANA_MCP_SA_TOKEN is missing, see the README" >&2
          exec sleep 2147483647
        fi
        exec /app/mcp-grafana --transport streamable-http --address 0.0.0.0:8000 \
          --disable-write --allowed-hosts "$${MCP_ALLOWED_HOST}"
    environment:
      GRAFANA_URL: http://grafana:3000
      MCP_ALLOWED_HOST: "${VICTORIA_GRAFANA_DOMAIN:?Set VICTORIA_GRAFANA_DOMAIN}"
      GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_MCP_SA_TOKEN:-}"
      MCP_GRAFANA_SERVER_TOKEN: "${GRAFANA_MCP_SERVER_TOKEN:-}"
    # traefik_gateway for Traefik; victoria to reach Grafana.
    networks:
      - traefik_gateway
      - victoria
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.victoria_grafana_mcp.loadbalancer.server.port: "8000"
      # More specific than victoria_grafana, so Traefik tries it first. The
      # HTTP redirect of victoria_grafana_http covers this path too.
      traefik.http.routers.victoria_grafana_mcp.rule: "Host(`${VICTORIA_GRAFANA_DOMAIN:?Set VICTORIA_GRAFANA_DOMAIN}`) && (Method(`POST`) || Method(`GET`) || Method(`DELETE`)) && Path(`/mcp`)"
      traefik.http.routers.victoria_grafana_mcp.entrypoints: "websecure"
      traefik.http.routers.victoria_grafana_mcp.tls: "true"
      traefik.http.routers.victoria_grafana_mcp.tls.certresolver: "stepca"
      traefik.http.routers.victoria_grafana_mcp.service: "victoria_grafana_mcp"
    logging: *default-logging
networks:
  traefik_gateway:
    external: true
  # Alerting and datasource traffic. Internal: no route out, and the
  # containers of other stacks on traefik_gateway cannot reach vmalert or
  # alertmanager. Vector is on both networks, so its SMS webhook (8080) is
  # reachable from traefik_gateway too (see the README).
  victoria:
    internal: true
  # Route out for unpoller only, to reach the UniFi gateway.
  unpoller: {}
  # Route out for snmp-exporter only, to reach the NAS on 161/udp.
  snmp: {}
  # Route out for freebox-exporter only, to reach the Freebox API
  # (mafreebox.freebox.fr, 443/tcp).
  freebox: {}
  # Route out for alertmanager only, to reach the Uptime Kuma push URL.
  alertmanager: {}
configs:
  # Every content: body below is generated by build.py from config/: edit
  # the source there, then run python3 build.py (see the README). build.py
  # also writes the mydocker.config-hash label of each service that
  # mounts a config, so that Compose recreates it when the config changes.

  # Pull targets of victoriametrics. unpoller refreshes its cache every
  # minute, a shorter interval only returns the same values. For synology,
  # the NAS goes in the target parameter and stays the instance label;
  # the request itself goes to snmp-exporter. The stack itself: one job per
  # component, its up series feeds the victoria_stack alert group and the
  # watchdog (vmalert_metrics_rules).
  # nvidia-gpu-exporter every 30s: the VRAM of a short GPU job (a few
  # seconds of inference) only shows if it lasts past one scrape.
  victoriametrics_scrape:
    content: |
      scrape_configs:
        - job_name: victoriametrics
          scrape_interval: 30s
          static_configs:
            - targets: ["victoriametrics:8428"]
        - job_name: victorialogs
          scrape_interval: 30s
          static_configs:
            - targets: ["victorialogs:9428"]
        - job_name: vmalert-logs
          scrape_interval: 30s
          static_configs:
            - targets: ["vmalert-logs:8880"]
        - job_name: vmalert-metrics
          scrape_interval: 30s
          static_configs:
            - targets: ["vmalert-metrics:8880"]
        - job_name: alertmanager
          scrape_interval: 30s
          static_configs:
            - targets: ["alertmanager:9093"]
        # The prometheus_exporter sink of vector_config.
        - job_name: vector
          scrape_interval: 30s
          static_configs:
            - targets: ["vector:9598"]
          # The histogram buckets are about 85 % of the vector series and no
          # dashboard or rule reads them (tests/test_stack.sh checks it).
          # _sum and _count stay, enough for average durations and sizes.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vector_.*_bucket"
              action: drop
        - job_name: unpoller
          scrape_interval: 60s
          static_configs:
            - targets: ["unpoller:9130"]
        - job_name: synology
          scrape_interval: 60s
          scrape_timeout: 30s
          metrics_path: /snmp
          params:
            module: [system, if_mib, synology]
            auth: [synology_v3]
          static_configs:
            - targets: ["${SYNOLOGY_SNMP_TARGET:?Set SYNOLOGY_SNMP_TARGET}"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: snmp-exporter:9116
        # freebox-exporter serves the values of its last refresh (30s).
        - job_name: freebox
          scrape_interval: 60s
          static_configs:
            - targets: ["freebox-exporter:9102"]
        # nvidia-gpu-exporter (NVML): GPU totals and the VRAM of each process
        # on the GPU, with its container_id.
        - job_name: nvidia-gpu
          scrape_interval: 30s
          static_configs:
            - targets: ["nvidia-gpu-exporter:9835"]
  # SNMPv3 auth of snmp-exporter. The exporter expands the ${...}
  # references from its own environment, not Compose.
  snmp_exporter_auth:
    content: |
      auths:
        synology_v3:
          version: 3
          security_level: authPriv
          username: $${SNMP_USER}
          password: $${SNMP_AUTH_PASS}
          auth_protocol: SHA
          priv_protocol: AES
          priv_password: $${SNMP_PRIV_PASS}
  # freebox-exporter config. In bridge mode the exporter turns off
  # lan_browser, switch, wifi and dhcp by itself; they stay off here too, as
  # do lan, nas and download. data_directory is the tmpfs that holds the
  # token and the exporter log files (one day kept). No secret in here.
  freebox_exporter_config:
    content: |
      [api]
      refresh = 30

      [metrics]
      connection = true
      lan = false
      lan_browser = false
      switch = false
      wifi = false
      dhcp = false
      system = true
      nas = false
      download = false
      vm = false
      raid = false
      vpn = false
      ddns = false
      prefix = "fbx_exporter"

      [policies]
      unresolved_station_hostnames = "ignore"

      [core]
      data_directory = "/data"
      port = 9102

      [log]
      level = "Info"
      retention = 1
  # Alert rules on VictoriaLogs (LogsQL), evaluated by vmalert-logs. Every
  # query sets its own _time window. A rule returns one series per alert:
  # its labels are the "by" fields, its value the single stats result.
  # A threshold on a total keeps its "by" fields for the SMS: stats by the
  # context fields, then total_stats sums the counts over every row, and
  # fields drops the per-row count. One alert per row, each with the total.
  # keep_firing_for equals the old OpenObserve silence: Alertmanager notifies
  # again an alert that resolves then fires again, so the alert stays firing
  # for the whole silence (see the README). The summary annotation is the SMS
  # text, description says what the rule checks.
  vmalert_logs_rules:
    content: |
      groups:
        - name: authentik
          interval: 5m
          rules:
            - alert: authentik_login_failed_burst
              expr: >-
                _time:15m {log_stream="authentik"} ak_kind:=event
                ak_action:in(login_failed, invalid_identifier)
                | stats by (ak_user, ak_client_ip) count() as attempts
                | total_stats sum(attempts) as failures | filter failures:>=5
                | fields ak_user, ak_client_ip, failures
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$value }} echecs de connexion Authentik en 15 minutes{{ with $$labels.ak_user }}, dont {{ . }}{{ end }}{{ with $$labels.ak_client_ip }} depuis {{ . }}{{ end }}"
                description: "Au moins 5 echecs de connexion Authentik en 15 minutes"
            - alert: authentik_sensitive_event
              expr: >-
                _time:5m {log_stream="authentik"} ak_kind:=event
                ak_action:in(suspicious_request, impersonation_started,
                system_exception, policy_exception, configuration_error)
                | stats by (ak_action, ak_user, ak_client_ip) count() as events | filter events:>=1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Evenement Authentik sensible {{ $$labels.ak_action }} ({{ $$value }} en 5 minutes){{ with $$labels.ak_user }} pour {{ . }}{{ end }}{{ with $$labels.ak_client_ip }} depuis {{ . }}{{ end }}"
                description: "Evenement Authentik sensible (requete suspecte, impersonation, exception systeme ou de politique, erreur de configuration)"
            - alert: authentik_errors
              expr: >-
                _time:15m {log_stream="authentik"} ak_level:in(error, critical)
                | stats by (ak_component) count() as component_errors
                | total_stats sum(component_errors) as errors | filter errors:>=3
                | fields ak_component, errors
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$value }} erreurs Authentik en 15 minutes, dont authentik {{ $$labels.ak_component }}"
                description: "Au moins 3 erreurs Authentik (server, worker ou postgresql) en 15 minutes"
            # Armed only for a component seen in the last 24 hours.
            - alert: authentik_logs_silent
              expr: >-
                _time:24h {log_stream="authentik"} ak_component:in(server, worker)
                | stats by (ak_component) count() if (_time:10m) as recent
                | filter recent:<1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "authentik {{ $$labels.ak_component }} n'envoie plus de log depuis 10 minutes"
                description: "authentik_server ou authentik_worker n'a plus envoye de log depuis 10 minutes"
        - name: proxmox_logs
          interval: 5m
          rules:
            - alert: proxmox_backup_failed
              expr: >-
                _time:15m {log_stream="proxmox"} pve_backup_event:in(job_failed, vm_failed)
                | stats by (pve_backup_event, pve_vmid) count() as failures | filter failures:>=1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Sauvegarde vzdump Proxmox en echec ({{ $$labels.pve_backup_event }}{{ with $$labels.pve_vmid }} VM {{ . }}{{ end }}, {{ $$value }} en 15 minutes)"
                description: "Une sauvegarde vzdump Proxmox echoue (job ou invite)"
            # acmerenew included: the proxmox_tls role of myansible renews the
            # certificate with step and deletes the ACME settings, so a failed
            # acmerenew means ACME came back.
            # The 24 hour window, not keep_firing_for, keeps the alert firing
            # for a day: vmalert restores the for state after a restart, not
            # keep_firing_for, so a restart within that day would send the SMS
            # of the same failure again.
            - alert: proxmox_task_failed
              expr: >-
                _time:24h {log_stream="proxmox"} pve_task_failed:=true
                | stats by (pve_task_type, pve_vmid, pve_task_status) count() as failures
                | filter failures:>=1
              keep_firing_for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Tache Proxmox {{ $$labels.pve_task_type }}{{ with $$labels.pve_vmid }} VM {{ . }}{{ end }} en erreur ({{ $$value }} en 24 heures){{ with $$labels.pve_task_status }} : {{ . }}{{ end }}"
                description: "Une tache Proxmox se termine en erreur"
            - alert: proxmox_auth_failed_burst
              expr: >-
                _time:15m {log_stream="proxmox"} pve_auth_result:=failure
                | stats by (pve_user, pve_client_ip) count() as attempts
                | total_stats sum(attempts) as failures | filter failures:>=5
                | fields pve_user, pve_client_ip, failures
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$value }} echecs d'authentification Proxmox en 15 minutes{{ with $$labels.pve_user }}, dont {{ . }}{{ end }}{{ with $$labels.pve_client_ip }} depuis {{ . }}{{ end }}"
                description: "Au moins 5 echecs d'authentification Proxmox en 15 minutes"
        - name: proxmox_backup
          interval: 60m
          rules:
            # No successful vzdump job in 26 hours. Armed only once the
            # stream holds records older than 24 hours: a new install or a
            # lost history stays quiet.
            - alert: proxmox_backup_missing
              expr: >-
                _time:26h {log_stream="proxmox"}
                | stats count() if (pve_backup_event:=job_ok) as ok,
                count() if (_time:<now-24h) as armed
                | filter ok:<1 armed:>0 | fields ok
              keep_firing_for: 720m
              labels:
                severity: critical
              annotations:
                summary: "Aucune sauvegarde vzdump Proxmox reussie depuis 26 heures"
                description: "Aucune sauvegarde vzdump Proxmox terminee avec succes depuis 26 heures (ne s'arme qu'apres 24 heures de logs)"
        # Hosts that send journald, file or Docker logs through their local
        # collector. A host that logged in the last 24 hours and stopped for
        # 30 minutes fires; one retired for more than 24 hours goes quiet.
        - name: host_logs
          interval: 5m
          rules:
            - alert: host_logs_silent
              expr: >-
                _time:24h log_stream:in(journald, files, docker)
                | stats by (host_name) count() if (_time:30m) as recent
                | filter recent:<1
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Plus de log de {{ $$labels.host_name }} depuis 30 minutes"
                description: "Un hote qui envoyait des logs journald, fichiers ou Docker n'envoie plus rien depuis 30 minutes"
            # Disk, filesystem and hardware errors, and hung tasks ("task
            # <name>:<pid> blocked for more than <n> seconds"). The OOM killer
            # has its own rule, oom_kill, which names the process.
            - alert: kernel_critical
              expr: >-
                _time:15m {log_stream="journald"} body_syslog_identifier:=kernel
                ("I/O error" OR "EXT4-fs error" OR "Hardware Error" OR "blocked for more than")
                | stats by (host_name) count() as events | filter events:>=1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$value }} erreurs noyau critiques sur {{ $$labels.host_name }} en 15 minutes"
                description: "Le noyau signale une erreur d'E/S, une erreur EXT4, une erreur materielle ou une tache bloquee"
            # The OOM killer, for the whole host ("Out of memory: Killed
            # process") or for a cgroup such as a container with a memory
            # limit ("Memory cgroup out of memory: Killed process").
            - alert: oom_kill
              expr: >-
                _time:15m {log_stream="journald"} body_syslog_identifier:=kernel "Killed process"
                | extract "Killed process <pid> (<process>)" from _msg
                | stats by (host_name, process) count() as kills | filter kills:>=1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Processus {{ $$labels.process }} tue par manque de memoire sur {{ $$labels.host_name }} ({{ $$value }} en 15 minutes)"
                description: "Le noyau a tue un processus faute de memoire (OOM killer), sur l'hote ou dans la limite memoire d'un conteneur"
            # A container that restarts again and again. containerd logs
            # "connecting to shim <container id>" at each start, and the id
            # stays the same across the restarts of a restart policy. Docker
            # waits at most a minute between two restarts, so a crash loop
            # starts a container well over 5 times in 15 minutes; a stack
            # redeploy or the Portainer polling that reruns victoria-init
            # start one 3 times at most. The name comes from the container's
            # own Docker logs, when it wrote some. The GitLab runner helper
            # containers (runner-...-predefined) start once per job step, so
            # they stay out. Only hosts whose containerd logs to journald.
            - alert: container_restart_loop
              expr: >-
                _time:15m {log_stream="journald"} body_syslog_identifier:=containerd "connecting to shim"
                | extract_regexp "connecting to shim (?P<container_id>[0-9a-f]{64})" from _msg
                | join by (container_id) (_time:1h {log_stream="docker"} | stats by (container_id, container_name) count() as lines)
                | filter -container_name:~"^runner-.*-predefined$$"
                | stats by (host_name, container_id, container_name) count() as starts
                | filter starts:>=5
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Conteneur {{ with $$labels.container_name }}{{ . }}{{ else }}{{ slice $$labels.container_id 0 12 }}{{ end }} redemarre en boucle sur {{ $$labels.host_name }} ({{ $$value }} demarrages en 15 minutes)"
                description: "Un conteneur Docker redemarre sans cesse : il s'arrete peu apres chaque demarrage"
        # AdGuard resolvers (querylog shipped as dns_queries). A resolver that
        # logged in the last 24 hours and stopped for an hour fires; the hour
        # covers the quiet nights of the secondary resolver.
        - name: dns
          interval: 5m
          rules:
            - alert: dns_resolver_silent
              expr: >-
                _time:24h {log_stream="dns_queries"}
                | stats by (host_name) count() if (_time:1h) as recent
                | filter recent:<1
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Plus de requete DNS journalisee par {{ $$labels.host_name }} depuis 1 heure"
                description: "Le resolveur AdGuard n'envoie plus son journal de requetes: service arrete ou collecte cassee"
        # UniFi IPS/IDS events (CEF over syslog). Signature 203 is a plain
        # firewall block and stays on the firewall dashboard.
        - name: unifi_security
          interval: 5m
          rules:
            - alert: unifi_ips_event
              expr: >-
                _time:15m {log_stream="syslog"} appname:CEF
                ((cef_ext_unificategory:Security -cef_signature_id:203) or cef_name:~"(?i)threat|intrus|honeypot")
                | stats by (cef_name, cef_ext_src) count() as events | filter events:>=1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$value }} evenements IPS UniFi ({{ $$labels.cef_name }}){{ with $$labels.cef_ext_src }} depuis {{ . }}{{ end }} en 15 minutes"
                description: "La passerelle UniFi signale une menace detectee (IPS/IDS ou honeypot)"
        # Traefik access logs. A service that answers 5xx in at least 3 of
        # the last six 5-minute buckets, 5 or more in each: a redeploy gives
        # 502s for a minute or two, a broken service goes on.
        - name: traefik
          interval: 5m
          rules:
            - alert: traefik_5xx_burst
              expr: >-
                _time:30m {log_stream="traefik"} app_downstreamstatus:>=500
                | stats by (app_servicename, _time:5m) count() as errors | filter errors:>=5
                | stats by (app_servicename) count() as buckets, sum(errors) as errors
                | filter buckets:>=3 | fields app_servicename, errors
              keep_firing_for: 30m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$value }} erreurs 5xx de {{ $$labels.app_servicename }} en 30 minutes"
                description: "Un service derriere Traefik repond en erreur 5xx depuis au moins 15 minutes"
        # Container id to name, for the metrics that only carry the id (the
        # GPU processes of nvidia-gpu-exporter). Recorded into
        # victoriametrics; the value is the line count, only the labels
        # matter. A container that wrote no log in the hour has no series;
        # container:nvidia_smi_compute_app_used_memory_bytes reads one day
        # back. Lines without a full id would name the host processes.
        - name: docker_containers
          interval: 5m
          rules:
            - record: docker_container_info
              expr: >-
                _time:1h {log_stream="docker"} container_id:~"^[0-9a-f]{64}$$"
                | stats by (host_name, container_id, container_name) count()

  # Alert rules on VictoriaMetrics (MetricsQL), evaluated by vmalert-metrics.
  # Metric and label names as the Proxmox VE OpenTelemetry metric server is
  # expected to send them: check them after the first deployment (README,
  # post-deploy check).
  vmalert_metrics_rules:
    content: |
      groups:
        - name: proxmox_metrics
          interval: 1m
          rules:
            # lag() is the age of the last sample in the 24 h window: one
            # alert per node that sent metrics in the last 24 hours.
            - alert: proxmox_metrics_silent
              expr: lag(proxmox_node_uptime_seconds[24h]) > 600
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Plus de metrique Proxmox de {{ $$labels.host_name }} depuis 10 minutes"
                description: "Le serveur de metriques OpenTelemetry de Proxmox n'a plus rien envoye depuis 10 minutes"
            - alert: proxmox_storage_usage_high
              expr: proxmox_storage_used_bytes / proxmox_storage_total_bytes >= 0.85
              keep_firing_for: 720m
              labels:
                severity: warning
              annotations:
                summary: "Stockage Proxmox {{ $$labels.storage }} occupe a {{ $$value | humanizePercentage }}"
                description: "Un stockage Proxmox depasse 85% d'occupation"
            # ZFS ARC is cache: the kernel gives it back under pressure.
            - alert: proxmox_node_memory_high
              expr: >-
                (proxmox_node_memory_memused_bytes - proxmox_node_memory_arcsize_bytes)
                / proxmox_node_memory_memtotal_bytes >= 0.9
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Memoire Proxmox hors ARC a {{ $$value | humanizePercentage }}"
                description: "La memoire de l'hote Proxmox hors cache ZFS ARC depasse 90%"
            - alert: proxmox_node_cpu_high
              expr: avg_over_time(proxmox_node_cpustat_cpu_percent[15m]) > 0.9
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "CPU Proxmox a {{ $$value | humanizePercentage }} en moyenne sur 15 minutes"
                description: "Le CPU de l'hote Proxmox est en moyenne au-dessus de 90% pendant 15 minutes"
            # Stopped guests report an uptime of 0 and are ignored.
            - alert: proxmox_guest_restarted
              expr: (proxmox_vm_uptime_seconds > 0) < 600
              keep_firing_for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Invite Proxmox {{ $$labels.name }} ({{ $$labels.vmid }}) redemarre il y a {{ $$value }} s"
                description: "Une VM ou un conteneur Proxmox a redemarre (uptime sous 10 minutes, les invites arretes sont ignores)"
        # unpoller answers its scrape with up = 1 even when it cannot log in
        # to UniFi: it then exports only its go_* metrics. absent() also fires
        # when unpoller is down. for: 10m covers its first poll after a start.
        - name: unifi_metrics
          interval: 1m
          rules:
            - alert: unpoller_no_unifi_data
              expr: absent(unpoller_device_info{job="unpoller"})
              for: 10m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Aucune donnee UniFi collectee par unpoller depuis 10 minutes"
                description: "unpoller ne remonte aucun equipement UniFi : URL, compte ou controleur injoignable, ou unpoller arrete"
            # When a poll of the controller fails, unpoller keeps serving its
            # last good snapshot: unpoller_device_info stays present and the
            # rule above stays silent. A device uptime moves on every poll
            # (about 15 changes in 15 minutes), so no change at all across
            # every device means the data is frozen. max() keeps the alert
            # to one instance.
            - alert: unpoller_unifi_data_stale
              expr: max(changes(unpoller_device_uptime_seconds{job="unpoller"}[15m])) == 0
              for: 5m
              keep_firing_for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Donnees UniFi figees dans unpoller depuis 20 minutes"
                description: "unpoller repond mais l'uptime d'aucun equipement UniFi n'a change : la collecte aupres du controleur echoue (TLS, compte, API)"
            # A device that unpoller listed in the last 24 hours and no
            # longer reports: offline, or removed from the controller.
            - alert: unifi_device_down
              expr: lag(unpoller_device_uptime_seconds[24h]) > 600
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Equipement UniFi {{ $$labels.name }} absent depuis 10 minutes"
                description: "unpoller ne remonte plus cet equipement UniFi : hors ligne ou retire du controleur"
        # Host metrics from the local OpenTelemetry collectors.
        - name: host_metrics
          interval: 1m
          rules:
            # Age of the newest CPU sample per host. The dashboards read this
            # series instead of running lag() over 24 h at each refresh.
            - record: host_name:metrics_age_seconds:max
              expr: max by (host_name) (lag(system_cpu_time_seconds_total[24h]))
            - alert: host_metrics_silent
              expr: max by (host_name) (lag(system_cpu_time_seconds_total[24h])) > 600
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Plus de metrique systeme de {{ $$labels.host_name }} depuis 10 minutes"
                description: "Le collecteur OpenTelemetry de l'hote n'envoie plus rien depuis 10 minutes : hote ou collecteur arrete"
            # Several hosts report the same NFS or ZFS dataset: one alert per
            # device. vfat (EFI) and tmpfs are left out.
            - alert: filesystem_usage_high
              expr: >-
                max by (device, type) (system_filesystem_utilization_ratio{type!~"vfat|tmpfs"}) >= 0.9
                < 0.95
              for: 15m
              keep_firing_for: 720m
              labels:
                severity: warning
              annotations:
                summary: "Systeme de fichiers {{ $$labels.device }} occupe a {{ $$value | humanizePercentage }}"
                description: "Un systeme de fichiers depasse 90% d'occupation"
            - alert: filesystem_usage_critical
              expr: >-
                max by (device, type) (system_filesystem_utilization_ratio{type!~"vfat|tmpfs"}) >= 0.95
              for: 15m
              keep_firing_for: 120m
              labels:
                severity: critical
              annotations:
                summary: "Systeme de fichiers {{ $$labels.device }} occupe a {{ $$value | humanizePercentage }}"
                description: "Un systeme de fichiers depasse 95% d'occupation"
            # A system unit in the failed state, from the systemd receiver of
            # the collector (systemd hosts only, user units not included). The
            # series is 1 while the unit stays failed and drops to 0 once it
            # restarts or is reset, so the alert follows the unit. max by drops
            # scope_version, which changes with a collector upgrade. The for
            # skips a unit that fails and restarts at once; vmalert restores
            # it after a restart (-remoteRead.url), keep_firing_for does not.
            - alert: systemd_unit_failed
              expr: >-
                max by (host_name, systemd_unit_name)
                (systemd_unit_state_ratio{systemd_unit_active_state="failed"}) == 1
              for: 5m
              keep_firing_for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Unit {{ $$labels.systemd_unit_name }} en echec sur {{ $$labels.host_name }}"
                description: "Une unit systemd est en etat failed depuis 5 minutes"
        - name: zfs
          interval: 1m
          rules:
            # zfs_pool_health: 0 is ONLINE, anything else is degraded,
            # faulted, offline, removed or unavailable.
            - alert: zfs_pool_degraded
              expr: zfs_pool_health != 0
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Pool ZFS {{ $$labels.pool }} pas ONLINE (etat {{ $$value }})"
                description: "Un pool ZFS est degrade ou en panne : verifier zpool status"
            - alert: zfs_pool_capacity_high
              expr: zfs_pool_capacity_ratio >= 0.85
              for: 15m
              keep_firing_for: 720m
              labels:
                severity: warning
              annotations:
                summary: "Pool ZFS {{ $$labels.pool }} rempli a {{ $$value | humanizePercentage }}"
                description: "Un pool ZFS depasse 85% de remplissage, au-dela les performances chutent"
            # Without fresh data the two rules above go quiet: a stopped
            # zfs_exporter would hide a degraded pool. Same shape as
            # smart_data_missing: a host seen within 24h, silent for 30m.
            - alert: zfs_data_missing
              expr: max by (host_name) (lag(zfs_pool_health[24h])) > 1800
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Plus de donnee ZFS de {{ $$labels.host_name }} depuis 30 minutes"
                description: "zfs_exporter ou sa collecte est arrete : l'etat des pools n'est plus surveille"
        # smartctl_exporter on the hosts (myansible role smartctl_exporter).
        # Raw counts are gauges: the rise above their 24h minimum, not delta,
        # which counts the first value of a new series (an old CRC error
        # after a deployment) as a rise. A normalized value at or under its
        # non-zero threshold is the drive's own failure flag.
        - name: smart
          interval: 1m
          rules:
            - alert: smart_status_failed
              expr: smartctl_device_smart_status == 0
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Disque {{ $$labels.device }} de {{ $$labels.host_name }} : bilan SMART en echec"
                description: "Le disque annonce lui-meme une panne prochaine : sauvegarder et le remplacer"
            - alert: smart_attribute_failing
              expr: >-
                max by (host_name, device, attribute_name) (smartctl_device_attribute{attribute_value_type="value"}
                <= ignoring(attribute_value_type) (smartctl_device_attribute{attribute_value_type="thresh"} > 0))
              keep_firing_for: 1440m
              labels:
                severity: warning
              annotations:
                summary: "Disque {{ $$labels.device }} de {{ $$labels.host_name }} : {{ $$labels.attribute_name }} sous son seuil ({{ $$value }})"
                description: "Un attribut SMART normalise est descendu a son seuil de panne"
            - alert: smart_sectors_growing
              expr: >-
                max by (host_name, device, attribute_name) (smartctl_device_attribute{attribute_value_type="raw",
                attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Current_Pending_ECC_Cnt|Offline_Uncorrectable|Reported_Uncorrect"}
                - min_over_time(smartctl_device_attribute{attribute_value_type="raw",
                attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Current_Pending_ECC_Cnt|Offline_Uncorrectable|Reported_Uncorrect"}[24h])) > 0
              keep_firing_for: 1440m
              labels:
                severity: warning
              annotations:
                summary: "Disque {{ $$labels.device }} de {{ $$labels.host_name }} : {{ $$labels.attribute_name }} +{{ $$value }} en 24h"
                description: "Des secteurs realloues, en attente ou illisibles apparaissent : le disque se degrade"
            - alert: smart_crc_errors_growing
              expr: >-
                max by (host_name, device) (smartctl_device_attribute{attribute_value_type="raw",
                attribute_name=~"UDMA_CRC_Error_Count|CRC_Error_Count"}
                - min_over_time(smartctl_device_attribute{attribute_value_type="raw",
                attribute_name=~"UDMA_CRC_Error_Count|CRC_Error_Count"}[24h])) > 0
              keep_firing_for: 1440m
              labels:
                severity: warning
              annotations:
                summary: "Disque {{ $$labels.device }} de {{ $$labels.host_name }} : +{{ $$value }} erreurs CRC en 24h"
                description: "Des erreurs de transfert apparaissent entre le disque et le controleur : cable ou connecteur"
            - alert: smart_temperature_high
              expr: max by (host_name, device) (smartctl_device_temperature{temperature_type="current"}) > 55
              for: 10m
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Disque {{ $$labels.device }} de {{ $$labels.host_name }} a {{ $$value }} degres"
                description: "Un disque d'hote depasse 55 degres depuis 10 minutes"
            - alert: smart_data_missing
              expr: max by (host_name) (lag(smartctl_device_smart_status[24h])) > 1800
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Plus de donnee SMART de {{ $$labels.host_name }} depuis 30 minutes"
                description: "smartctl_exporter ou sa collecte par le collecteur OpenTelemetry est arrete"
        # Synology status OIDs are 1 when normal. diskBadSector is -1 on
        # cache devices, so only a positive count fires.
        - name: synology_metrics
          interval: 1m
          rules:
            - alert: synology_system_failed
              expr: >-
                {job="synology", __name__=~"systemStatus|powerStatus|systemFanStatus|cpuFanStatus"} != 1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "NAS Synology : {{ $$labels.__name__ }} en defaut"
                description: "Le NAS signale une panne systeme, d'alimentation ou de ventilateur"
            - alert: synology_raid_degraded
              expr: raidStatus{job="synology"} != 1
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Volume Synology {{ $$labels.raidName }} pas normal (etat {{ $$value }})"
                description: "Un volume RAID du NAS est degrade, en reconstruction ou en panne"
            - alert: synology_disk_failed
              expr: >-
                {job="synology", __name__=~"diskStatus|diskHealthStatus"} != 1
                or diskBadSector{job="synology"} > 0
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Disque Synology {{ $$labels.diskID }} : {{ $$labels.__name__ }} = {{ $$value }}"
                description: "Un disque du NAS est en defaut ou a des secteurs defectueux"
            - alert: synology_temperature_high
              expr: >-
                temperature{job="synology"} > 60 or diskTemperature{job="synology"} > 55
              for: 10m
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Temperature du NAS Synology a {{ $$value }} degres"
                description: "Le NAS depasse 60 degres ou un disque depasse 55 degres"
            - alert: synology_scrape_down
              expr: up{job="synology"} == 0
              for: 10m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Le NAS Synology ne repond plus en SNMP depuis 10 minutes"
                description: "snmp_exporter n'interroge plus le NAS : NAS arrete, reseau ou identifiants SNMPv3"
        # Freebox Delta in bridge mode (freebox-exporter). connection_state
        # is 1 while the Internet connection of the box is up. The SMS of a
        # connection loss leaves only once Internet is back: keep_firing_for
        # keeps the alert firing until then for an outage under 60 minutes.
        - name: freebox_metrics
          interval: 1m
          rules:
            - alert: freebox_connection_down
              expr: fbx_exporter_connection_state{job="freebox", state="up"} == 0
              for: 2m
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Freebox : connexion Internet coupee"
                description: "La Freebox signale sa connexion Internet (fibre) autre que up"
            - alert: freebox_scrape_down
              expr: up{job="freebox"} == 0
              for: 10m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "L'exporter Freebox ne repond plus depuis 10 minutes"
                description: "freebox-exporter arrete, sans token ou API de la Freebox injoignable (un token refuse declenche freebox_auth_failed)"
            # pwr_rx is in hundredths of dBm. GPON receivers lose the link
            # around -28 dBm: below -26 the fibre or a connector is degrading.
            - alert: freebox_fiber_signal_low
              expr: (fbx_exporter_connection_ftth_sfp_pwr_rx{job="freebox"} / 100 < -26) and on (job) (fbx_exporter_connection_ftth_sfp_has_signal{job="freebox"} == 1)
              for: 30m
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Freebox : signal fibre faible ({{ $$value | printf \"%.1f\" }} dBm)"
                description: "Puissance optique recue sous -26 dBm depuis 30 minutes : fibre, connecteur ou SFP a verifier"
            - alert: freebox_temperature_high
              expr: max by (job) (fbx_exporter_system_temp_cpu{job="freebox"}) > 85
              for: 15m
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Freebox : processeur a {{ $$value }} degres"
                description: "Temperature CPU de la Freebox au-dessus de 85 degres depuis 15 minutes : ventilation ou ventilateur a verifier"
            # Exporter v0.0.29+: authenticated drops to 0 only when the box
            # answers the login with an error_code (token revoked, pending,
            # rights removed); an unreachable box leaves it at 1. While it is
            # 0 the exporter serves no box metric: the connection and
            # temperature alerts stay silent and the scrape stays up.
            - alert: freebox_auth_failed
              expr: fbx_exporter_authenticated{job="freebox"} == 0
              for: 10m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Freebox : l'exporter n'est plus autorise depuis 10 minutes"
                description: "La Freebox refuse le login de freebox-exporter (code dans fbx_exporter_authentication_error et le log) : token revoque ou droits retires, l'enregistrer a nouveau"
            # One collector (connection, system) failing while the login
            # works: its metrics stop updating without the scrape failing.
            - alert: freebox_collector_failed
              expr: fbx_exporter_collector_success{job="freebox"} == 0
              for: 30m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Freebox : le collecteur {{ $$labels.collector }} echoue depuis 30 minutes"
                description: "freebox-exporter ne lit plus ce module de l'API de la Freebox : ses metriques ne sont plus a jour, voir le log de l'exporter"
        # Health of the stack itself (job per component in
        # victoriametrics_scrape).
        - name: victoria_stack
          interval: 1m
          rules:
            # Dead man's switch: always firing while the SMS path works.
            # Alertmanager sends it every minute to an Uptime Kuma push
            # monitor (receiver watchdog), outside Vector and the Free Mobile
            # sink. Kuma alerts on its own when the pushes stop: host,
            # victoriametrics, vmalert-metrics or alertmanager down (nothing
            # evaluates or sends), or the expression below empty: vector,
            # victorialogs or vmalert-logs down or never scraped, or the
            # free_mobile sink failing. No keep_firing_for: the pushes must
            # stop as soon as the SMS path breaks.
            - alert: watchdog
              expr: >-
                vector(1) unless on() (
                  max(up{job=~"vector|victorialogs|vmalert-logs"} == 0)
                  or absent(up{job="vector"})
                  or absent(up{job="victorialogs"})
                  or absent(up{job="vmalert-logs"})
                  or sum(increase(vector_component_errors_total{component_id="free_mobile"}[30m])) > 0
                )
              labels:
                severity: none
              annotations:
                summary: "Chaine d'alerte victoria operationnelle"
                description: "Toujours active tant que la chaine SMS fonctionne ; Uptime Kuma alerte quand elle se tait"
            - alert: victoria_component_down
              expr: >-
                up{job=~"victoriametrics|victorialogs|vmalert-logs|vmalert-metrics|alertmanager|vector"} == 0
              for: 5m
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "Composant victoria {{ $$labels.job }} injoignable depuis 5 minutes"
                description: "victoriametrics ne scrape plus ce composant de la stack : conteneur arrete ou en echec"
            # A failing query (datasource down, LogsQL or MetricsQL error)
            # leaves its rule silent: no alert, whatever happens. Two failed
            # evaluations of the same rule in 2 hours: a restart of
            # victorialogs or victoriametrics fails one evaluation per rule,
            # and the 60m group (proxmox_backup) still fits twice.
            - alert: vmalert_rule_errors
              expr: >-
                sum by (job, group, alertname) (
                  increase(vmalert_alerting_rules_errors_total[2h])
                ) >= 2
              keep_firing_for: 120m
              labels:
                severity: warning
              annotations:
                summary: "Regle {{ $$labels.alertname }} ({{ $$labels.job }}) en erreur a plusieurs evaluations"
                description: "vmalert n'arrive plus a evaluer une regle d'alerte : la regle ne peut plus se declencher"
            # The watchdog receiver failing (Uptime Kuma unreachable) comes
            # by SMS; the sms receiver failing stops the watchdog instead.
            # Failures in every 5 minute window for 10 minutes: the watchdog
            # pushes every minute, so a restart of Uptime Kuma stays out.
            - alert: alertmanager_notifications_failed
              expr: >-
                sum by (integration, receiver_name) (
                  increase(alertmanager_notifications_failed_total[5m])
                ) > 0
              for: 10m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Alertmanager n'arrive plus a notifier {{ $$labels.receiver_name }} ({{ $$labels.integration }})"
                description: "Des notifications d'Alertmanager echouent : webhook injoignable ou en erreur"
            # vmalert failing to hand alerts to Alertmanager. Mostly for
            # vmalert-logs: a send failure in vmalert-metrics also stops the
            # watchdog. Errors in every 10 minute window for 15 minutes: a
            # restart of Alertmanager, shorter than the for, stays out.
            - alert: vmalert_send_failed
              expr: >-
                sum by (job) (
                  increase(vmalert_alerts_send_errors_total[10m])
                ) > 0
              for: 15m
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.job }} n'arrive plus a envoyer ses alertes a Alertmanager"
                description: "Des alertes declenchees n'atteignent pas Alertmanager : aucun SMS ne part pour elles"
            # /data full within 4 days at the pace of the last 24 hours.
            # victoriametrics and victorialogs share /data on the host, so
            # both usually fire together, in one SMS (group_by alertname).
            # The 24 hour range smooths the merges of both, which take space
            # for minutes then give it back; the for of 1h covers a range
            # still short after a restart. The fill level itself is
            # filesystem_usage_high and filesystem_usage_critical.
            - alert: victoria_disk_fill_predicted
              expr: >-
                predict_linear(vm_free_disk_space_bytes[24h], 4 * 86400) < 0
                or predict_linear(vl_free_disk_space_bytes[24h], 4 * 86400) < 0
              for: 1h
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Disque {{ $$labels.path }} de {{ $$labels.job }} plein dans moins de 4 jours au rythme actuel"
                description: "L'espace libre baisse assez vite pour etre epuise en 4 jours : ingestion en hausse ou retention trop longue"
            # VictoriaLogs up but writing no row for 5 minutes: Vector sends
            # nothing (sinks blocked, sources stalled). At least 269 rows per
            # 5 minutes over 30 days. The 5 minute range fires before the
            # silences of the logs rules (10 minutes or more), which it
            # inhibits. up == 1: a stopped victorialogs is
            # victoria_component_down. for: 2m because a restart of
            # victorialogs resets the counter: the first evaluations see a
            # single sample, whose increase is 0. It still fires at about
            # 7 minutes, before the silences. No match for VictoriaMetrics: it
            # scrapes itself, so its ingestion never drops to zero.
            - alert: victorialogs_ingestion_stopped
              expr: >-
                sum(increase(vl_rows_ingested_total[5m])) == 0
                and on() max(up{job="victorialogs"}) == 1
              for: 2m
              keep_firing_for: 60m
              labels:
                severity: critical
              annotations:
                summary: "VictoriaLogs ne recoit plus aucun log depuis plus de 5 minutes"
                description: "VictoriaLogs repond mais n'ecrit plus de ligne : Vector n'envoie plus rien, les alertes sur les logs sont aveugles"
            # Errors of a Vector component other than free_mobile (the
            # watchdog covers it): a source that cannot parse or read, a sink
            # that cannot write. At most 2 per 30 minutes over 30 days, from
            # the vmalert_*_rules sources when vmalert restarts.
            - alert: vector_component_errors
              expr: >-
                sum by (component_id) (
                  increase(vector_component_errors_total{component_id!="free_mobile"}[30m])
                ) >= 5
              keep_firing_for: 60m
              labels:
                severity: warning
              annotations:
                summary: "Vector : {{ $$value }} erreurs du composant {{ $$labels.component_id }} en 30 minutes"
                description: "Un composant de Vector echoue : des logs ou des metriques sont perdus ou retardes"
        # VRAM per process on the GPU, named after its container. The name
        # comes from docker_container_info (vmalert-logs, one day back); a
        # process of a container with no log for a day, or one outside any
        # container (empty container_id), keeps its series without
        # container_name instead of being dropped.
        - name: gpu
          interval: 1m
          rules:
            - record: container:nvidia_smi_compute_app_used_memory_bytes
              expr: >-
                (
                  nvidia_smi_compute_app_used_memory_bytes
                    * on (container_id) group_left (container_name)
                      (max by (container_id, container_name) (
                        last_over_time(docker_container_info{container_id!=""}[1d])
                      ) * 0 + 1)
                )
                or on (uuid, pid) nvidia_smi_compute_app_used_memory_bytes

  # One route per alert. Its repeat_interval is at least the event window
  # of the rule, plus its keep_firing_for, plus its group interval: the
  # longest a single event keeps the alert firing. One event, one SMS; a
  # lasting problem, one SMS more per interval. tests/test_alerting.sh
  # checks the bound.
  # group_by alertname: one SMS per rule, listing its firing alerts. Not
  # by host: each group is an SMS, and an outage that hits every host would
  # send one per host. inhibit_rules drop the alerts a cause already
  # explains instead.
  # send_resolved false: an SMS only when something goes wrong.
  alertmanager_config:
    content: |
      route:
        receiver: sms
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 60m
        routes:
          # Heartbeat to Uptime Kuma: first, and on its own receiver. A push
          # every minute while the watchdog fires (see vmalert_metrics_rules).
          - matchers: [alertname="watchdog"]
            receiver: watchdog
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
          - matchers: [alertname="authentik_login_failed_burst"]
            repeat_interval: 80m
          - matchers: [alertname="authentik_sensitive_event"]
            repeat_interval: 70m
          - matchers: [alertname="authentik_errors"]
            repeat_interval: 80m
          - matchers: [alertname="authentik_logs_silent"]
            repeat_interval: 65m
          - matchers: [alertname="proxmox_metrics_silent"]
            repeat_interval: 65m
          - matchers: [alertname="proxmox_storage_usage_high"]
            repeat_interval: 725m
          - matchers: [alertname="proxmox_node_memory_high"]
            repeat_interval: 125m
          - matchers: [alertname="proxmox_node_cpu_high"]
            repeat_interval: 140m
          - matchers: [alertname="proxmox_guest_restarted"]
            repeat_interval: 45m
          - matchers: [alertname="proxmox_backup_failed"]
            repeat_interval: 80m
          - matchers: [alertname="proxmox_backup_missing"]
            repeat_interval: 780m
          - matchers: [alertname="proxmox_task_failed"]
            repeat_interval: 1460m
          - matchers: [alertname="proxmox_auth_failed_burst"]
            repeat_interval: 80m
          - matchers: [alertname="unpoller_no_unifi_data"]
            repeat_interval: 65m
          - matchers: [alertname="unpoller_unifi_data_stale"]
            repeat_interval: 50m
          - matchers: [alertname="host_logs_silent"]
            repeat_interval: 125m
          - matchers: [alertname="kernel_critical"]
            repeat_interval: 80m
          - matchers: [alertname="systemd_unit_failed"]
            repeat_interval: 1460m
          - matchers: [alertname="oom_kill"]
            repeat_interval: 80m
          - matchers: [alertname="container_restart_loop"]
            repeat_interval: 80m
          - matchers: [alertname="dns_resolver_silent"]
            repeat_interval: 125m
          - matchers: [alertname="unifi_ips_event"]
            repeat_interval: 80m
          - matchers: [alertname="traefik_5xx_burst"]
            repeat_interval: 65m
          - matchers: [alertname="unifi_device_down"]
            repeat_interval: 65m
          - matchers: [alertname="host_metrics_silent"]
            repeat_interval: 65m
          - matchers: [alertname="filesystem_usage_high"]
            repeat_interval: 725m
          - matchers: [alertname="filesystem_usage_critical"]
            repeat_interval: 125m
          - matchers: [alertname="zfs_pool_degraded"]
            repeat_interval: 65m
          - matchers: [alertname="zfs_pool_capacity_high"]
            repeat_interval: 725m
          - matchers: [alertname="smart_status_failed"]
            repeat_interval: 65m
          - matchers: [alertname="smart_attribute_failing"]
            repeat_interval: 1445m
          - matchers: [alertname="smart_sectors_growing"]
            repeat_interval: 2885m
          - matchers: [alertname="smart_crc_errors_growing"]
            repeat_interval: 2885m
          - matchers: [alertname="smart_temperature_high"]
            repeat_interval: 125m
          - matchers: [alertname="smart_data_missing"]
            repeat_interval: 125m
          - matchers: [alertname="zfs_data_missing"]
            repeat_interval: 125m
          - matchers: [alertname="synology_system_failed"]
            repeat_interval: 65m
          - matchers: [alertname="synology_raid_degraded"]
            repeat_interval: 65m
          - matchers: [alertname="synology_disk_failed"]
            repeat_interval: 65m
          - matchers: [alertname="synology_temperature_high"]
            repeat_interval: 125m
          - matchers: [alertname="synology_scrape_down"]
            repeat_interval: 65m
          - matchers: [alertname="freebox_connection_down"]
            repeat_interval: 65m
          - matchers: [alertname="freebox_scrape_down"]
            repeat_interval: 65m
          - matchers: [alertname="freebox_fiber_signal_low"]
            repeat_interval: 125m
          - matchers: [alertname="freebox_temperature_high"]
            repeat_interval: 125m
          - matchers: [alertname="freebox_auth_failed"]
            repeat_interval: 65m
          - matchers: [alertname="freebox_collector_failed"]
            repeat_interval: 65m
          - matchers: [alertname="victoria_component_down"]
            repeat_interval: 65m
          - matchers: [alertname="vmalert_rule_errors"]
            repeat_interval: 245m
          - matchers: [alertname="alertmanager_notifications_failed"]
            repeat_interval: 70m
          - matchers: [alertname="vmalert_send_failed"]
            repeat_interval: 75m
          - matchers: [alertname="victoria_disk_fill_predicted"]
            repeat_interval: 1505m
          - matchers: [alertname="victorialogs_ingestion_stopped"]
            repeat_interval: 70m
          - matchers: [alertname="vector_component_errors"]
            repeat_interval: 95m
      receivers:
        - name: sms
          webhook_configs:
            # The SMS bridge: the alertmanager source of vector.
            - url: http://vector:8080/alertmanager
              send_resolved: false
              max_alerts: 10
              # Same credentials as the auth of the vector source. Compose
              # writes the value into this file: hex only (openssl rand -hex
              # 32), so that it cannot break the YAML.
              http_config:
                basic_auth:
                  username: alertmanager
                  password: "${VECTOR_WEBHOOK_PASSWORD:?Set VECTOR_WEBHOOK_PASSWORD}"
        # Push URL of an Uptime Kuma push monitor (see the README). The token
        # in the URL is secret and goes in the environment of the stack only.
        # send_resolved false: a resolved watchdog must not count as a push.
        - name: watchdog
          webhook_configs:
            - url: "${ALERTMANAGER_WATCHDOG_URL:?Set ALERTMANAGER_WATCHDOG_URL}"
              send_resolved: false
              max_alerts: 1
      # A firing source mutes its consequences, which then send no SMS.
      inhibit_rules:
        # A host sending no metrics at all is the collector or the host
        # down: its logs, SMART, ZFS and DNS go silent with it.
        - source_matchers: [alertname="host_metrics_silent"]
          target_matchers:
            - alertname=~"host_logs_silent|smart_data_missing|zfs_data_missing|dns_resolver_silent"
          equal: [host_name]
        # VictoriaLogs receiving nothing: every logs source looks silent.
        # No equal: the source has no host_name.
        - source_matchers: [alertname="victorialogs_ingestion_stopped"]
          target_matchers:
            - alertname=~"host_logs_silent|dns_resolver_silent|authentik_logs_silent"
        # A component of the stack down: ingestion and Vector errors follow.
        - source_matchers: [alertname="victoria_component_down"]
          target_matchers:
            - alertname=~"victorialogs_ingestion_stopped|vector_component_errors"
        # No data from the UniFi controller at all: every device would look
        # down, and a stale alert still held by keep_firing_for adds nothing.
        - source_matchers: [alertname="unpoller_no_unifi_data"]
          target_matchers:
            - alertname=~"unifi_device_down|unpoller_unifi_data_stale"
        # The Internet connection of the Freebox down: its API may go
        # unreachable with it (mafreebox.freebox.fr is a public address) and
        # the collectors fail.
        - source_matchers: [alertname="freebox_connection_down"]
          target_matchers: [alertname="freebox_collector_failed"]
        # The critical threshold of the same filesystem says it all.
        - source_matchers: [alertname="filesystem_usage_critical"]
          target_matchers: [alertname="filesystem_usage_high"]
          equal: [device, type]
        # A drive whose own SMART status failed: its attributes add nothing.
        - source_matchers: [alertname="smart_status_failed"]
          target_matchers:
            - alertname=~"smart_attribute_failing|smart_sectors_growing|smart_crc_errors_growing"
          equal: [host_name, device]

  # Vector pipeline. Compose interpolates the ${VAR} listed in build.py.
  vector_config:
    content: |
      # OTLP/HTTP logs and UDP syslog to VictoriaLogs.
      #
      #   otlp -> normalize -> redact_url_secrets -> route_streams --docker_like--> route_authentik --authentik--> parse_authentik
      #                                                           |--journald--> parse_http -> parse_proxmox
      #   syslog_udp -> parse_syslog
      #
      # Every branch ends in the victorialogs sink. The stream of a record is its
      # log_stream field (one of the VictoriaLogs stream fields): docker,
      # traefik, journald, files... as named by the stream-name header of the
      # collector, then authentik, proxmox, syslog, firewall as set here.
      data_dir: /var/lib/vector

      sources:
        otlp:
          type: opentelemetry
          # Required by the source. Not published: the collectors use HTTP.
          grpc:
            address: 0.0.0.0:4317
          http:
            address: 0.0.0.0:4318
            # Stream chosen by the collector (otel_collector_streams in myansible).
            headers: [stream-name]

        syslog_udp:
          # Raw socket instead of the "syslog" source, so messages that are not valid
          # RFC 3164/5424 (CEF, vendor formats) are kept instead of being dropped.
          type: socket
          mode: udp
          address: 0.0.0.0:5514
          host_key: source_ip
          port_key: source_port

        # Webhook of alertmanager (receiver sms). Reachable on the victoria and
        # traefik_gateway networks, never routed by Traefik (see the README).
        alertmanager_webhook:
          type: http_server
          address: 0.0.0.0:8080
          path: /alertmanager
          strict_path: true
          method: POST
          # Any container on the victoria and traefik_gateway networks reaches
          # port 8080: without auth, any of them could send SMS. Vector 0.61
          # no longer expands environment variables in its config, so Compose
          # writes the password here, as in alertmanager_config.
          auth:
            strategy: basic
            username: alertmanager
            password: "${VECTOR_WEBHOOK_PASSWORD:?Set VECTOR_WEBHOOK_PASSWORD}"
          decoding:
            codec: json

        # Rule state of both vmalert instances, polled every minute and stored
        # as log_stream "alerts" (one record per rule, see alert_rules), for
        # the Alerts dashboard: state, health and the reason for that state.
        vmalert_logs_rules:
          type: http_client
          endpoint: http://vmalert-logs:8880/api/v1/rules?type=alert
          scrape_interval_secs: 60
          decoding:
            codec: json
        vmalert_metrics_rules:
          type: http_client
          endpoint: http://vmalert-metrics:8880/api/v1/rules?type=alert
          scrape_interval_secs: 60
          decoding:
            codec: json

        # Vector's own metrics (events, errors per component), scraped by
        # victoriametrics through the prometheus sink below.
        vector_metrics:
          type: internal_metrics

      transforms:
        # One SMS per webhook. Alertmanager groups by alertname, so a webhook
        # holds the firing alerts of one rule (max_alerts: 10). The text is the
        # summary annotation of each alert, one per line.
        sms_message:
          type: remap
          inputs:
            - alertmanager_webhook
          # An error or abort drops the webhook instead of passing it on as is.
          drop_on_error: true
          drop_on_abort: true
          source: |
            alerts = array(.alerts) ?? []
            firing = filter(alerts) -> |_index, alert| { alert.status == "firing" }
            lines = map_values(firing) -> |alert| {
              string(alert.annotations.summary) ?? string(alert.labels.alertname) ?? "alerte"
            }
            if length(lines) == 0 { abort }
            msg = join!(lines, "\n")
            truncated = int(.truncatedAlerts) ?? 0
            if truncated > 0 {
              msg = msg + "\n(+" + to_string(truncated) + " autres alertes)"
            }
            user = get_env_var("FREE_MOBILE_USER") ?? ""
            pass = get_env_var("FREE_MOBILE_PASS") ?? ""
            if user == "" || pass == "" {
              log("FREE_MOBILE_USER or FREE_MOBILE_PASS is empty: SMS not sent", level: "error")
              abort
            }
            . = {"user": user, "pass": pass, "msg": truncate(msg, 900)}

        # One record per vmalert rule. message holds the reason for the state:
        # the evaluation error, the rendered summary of each active alert (the
        # SMS text), or the condition that is not met (description).
        alert_rules:
          type: remap
          inputs:
            - vmalert_logs_rules
            - vmalert_metrics_rules
          drop_on_error: true
          drop_on_abort: true
          source: |
            groups = array(.data.groups) ?? []
            ts = now()
            records = []
            for_each(groups) -> |_gi, group| {
              group_name = string(group.name) ?? ""
              rules = array(group.rules) ?? []
              for_each(rules) -> |_ri, rule| {
                alerts = array(rule.alerts) ?? []
                health = string(rule.health) ?? "unknown"
                last_error = string(rule.lastError) ?? ""
                state = string(rule.state) ?? "unknown"
                summaries = []
                # Earliest activeAt of the alerts, in seconds; 0 when none.
                since = 0
                for_each(alerts) -> |_ai, alert| {
                  summaries = push(summaries, string(alert.annotations.summary) ?? string(alert.labels.alertname) ?? "alerte")
                  active = to_unix_timestamp(parse_timestamp(string(alert.activeAt) ?? "", "%+") ?? t'1970-01-01T00:00:00Z')
                  if active > 0 && (since == 0 || active < since) {
                    since = active
                  }
                }
                reason = if health != "ok" || last_error != "" {
                  "Erreur d'evaluation : " + last_error
                } else if length(summaries) > 0 {
                  join(summaries, " | ")
                } else {
                  "Condition non remplie : " + (string(rule.annotations.description) ?? "")
                }
                source = if (string(rule.datasourceType) ?? "") == "vlogs" { "logs" } else { "metrics" }
                # This stream skips normalize_level. A rule that cannot be
                # evaluated is an error; a firing or pending alert only a
                # warning, so that the error panels do not count it every minute.
                level = if health != "ok" || last_error != "" { "error" } else if state == "firing" || state == "pending" { "warn" } else { "info" }
                record = {
                  "timestamp": ts,
                  "log_stream": "alerts",
                  "message": truncate(reason, 2000),
                  "alert_rule": string(rule.name) ?? "",
                  "alert_group": group_name,
                  "alert_source": source,
                  "alert_state": state,
                  "level": level,
                  "alert_health": health,
                  "alert_severity": string(rule.labels.severity) ?? "",
                  "alert_count": length(alerts),
                  "alert_last_evaluation": string(rule.lastEvaluation) ?? "",
                  "alert_last_samples": int(rule.lastSamples) ?? 0
                }
                if since > 0 {
                  record.alert_active_since = from_unix_timestamp!(since)
                }
                records = push(records, record)
              }
            }
            if length(records) == 0 { abort }
            . = records

        # Flat records with stable field names, so that queries, alerts and
        # dashboards can rely on them: resource and record
        # attributes flattened with "_" (container.name -> container_name,
        # app.RequestPath -> app_requestpath), a map body as body_* fields
        # (journald: body_message, body_syslog_identifier...), a string body in
        # body.
        normalize:
          type: remap
          inputs: [otlp.logs]
          source: |
            resources = object(del(.resources)) ?? {}
            attributes = object(del(.attributes)) ?? {}
            # A record attribute wins over a resource attribute of the same name.
            flat = merge(flatten(resources, "_"), flatten(attributes, "_"))
            body = del(.message)
            if is_object(body) {
              flat = merge(flat, map_keys(flatten(object!(body), "_")) -> |key| { "body_" + key })
            } else if is_string(body) {
              flat.body = body
            } else if body != null {
              flat.body = encode_json(body)
            }
            # Lower case, and only [a-z0-9_]: one spelling per field, whatever
            # the case or punctuation the collector sent.
            flat = map_keys(flat) -> |key| { replace(downcase(key), r'[^a-z0-9_]', "_") }

            stream = string(del(."stream-name")) ?? ""
            time = .timestamp
            if !is_timestamp(time) { time = .observed_timestamp }
            if !is_timestamp(time) { time = now() }
            severity = string(.severity_text) ?? ""
            severity_number = to_int(.severity_number) ?? 0
            trace_id = string(.trace_id) ?? ""
            span_id = string(.span_id) ?? ""

            # scope, flags, dropped_attributes_count, observed_timestamp and
            # source_type are dropped: one value for nearly every record.
            . = flat
            .timestamp = time
            # A stream name becomes a stream field value: keep it short and
            # plain, whatever the sender puts in the header.
            .log_stream = if match(stream, r'^[a-z0-9_]{1,64}$$') { stream } else { "default" }
            if severity != "" { .severity = severity }
            if severity_number > 0 { .severity_number = severity_number }
            if trace_id != "" { .trace_id = trace_id }
            if span_id != "" { .span_id = span_id }

        route_streams:
          type: route
          inputs: [redact_url_secrets]
          route:
            docker_like: '.log_stream == "docker" || .log_stream == "traefik"'
            journald: '.log_stream == "journald"'

        # Masks the values of secret-looking URL parameters (token, code,
        # password and the like) on every OTLP record: OAuth codes, API keys and
        # session IDs in request lines must not be readable by everyone with UI
        # access. The only place that defines secret_re: the parsers downstream
        # (parse_authentik, parse_http) read fields that are already masked.
        redact_url_secrets:
          type: remap
          inputs: [normalize]
          source: |
            secret_re = r'(?i)([?&]|\b)((?:access[_-]?token|refresh[_-]?token|token|auth(?:orization)?|api[_-]?key|client[_-]?secret|credential|password|passwd|secret|session(?:[_-]?id)?|jwt|signature|sig|nonce(?:_[a-z0-9]+)?|code|key)=)([^&\s"\x27\\]*)'
            # body: the raw line; app_msg, app_message: the message of a JSON
            # line; app_requestpath: path and query of the Traefik access log;
            # app_event, app_path, app_context_http_request: Authentik request.
            for_each(["body", "app_msg", "app_message", "app_requestpath", "app_event", "app_path", "app_context_http_request"]) -> |_index, name| {
              value = get(., [name]) ?? null
              if is_string(value) {
                . = set!(., [name], replace(string!(value), secret_re, "$$1$$2[REDACTED]"))
              }
            }
            # HAProxy httplog line in the journal: its request line carries the
            # query string, and parse_http takes http_path from it. Other journal
            # lines are left as they are: key=value is common in daemon messages.
            if (string(.body_syslog_identifier) ?? "") == "haproxy" && is_string(.body_message) {
              .body_message = replace(string!(.body_message), secret_re, "$$1$$2[REDACTED]")
            }
            # Traefik numeric fields arrive as float (302.0) or string ("302")
            # depending on the collector: one integer type for tables and filters.
            if .log_stream == "traefik" {
              for_each(["app_downstreamstatus", "app_originstatus"]) -> |_index, name| {
                value = get(., [name]) ?? null
                number = if is_string(value) { to_float(value) ?? null } else { value }
                if is_float(number) || is_integer(number) {
                  . = set!(., [name], to_int!(number))
                }
              }
            }

        route_authentik:
          type: route
          inputs: [route_streams.docker_like]
          route:
            authentik: '.log_stream == "docker" && contains(string(.container_name) ?? "", "authentik_")'

        # Authentik logs (server, worker, postgresql) to their own authentik
        # stream, with ak_* fields. Runs after redact_url_secrets, which masked
        # body, app_msg, app_message, app_event, app_path and
        # app_context_http_request.
        #
        # Two formats on authentik_server:
        # - Python/structlog: app_client_ip, app_runtime (ms), app_action for events;
        # - Rust/axum (embedded outpost, forward auth): app_remote, app_runtime (ms, string).
        #
        # Fields added:
        #   ak_component  server | worker | postgresql
        #   ak_kind       event | forward_auth | health | http | task | log
        #   ak_level      debug | trace | info | warning | error | critical (warn and fatal
        #                 normalized, PostgreSQL level read from the message)
        #   ak_client_ip  client IP, whatever the format
        #   ak_runtime_ms request duration in ms (float)
        #   ak_action     Authentik event action (login, login_failed, authorize_application...)
        #   ak_user       target user (name typed for login_failed, else the event user)
        #   ak_app_host   protected host, for forward-auth requests
        # ak_action and ak_user stay empty outside events; VictoriaLogs does not
        # store an empty field, so they only show on events.
        parse_authentik:
          type: remap
          inputs: [route_authentik.authentik]
          source: |
            .log_stream = "authentik"

            name = string(.container_name) ?? ""
            .ak_component = replace(name, r'^authentik_', "")

            # string() fails on null, unlike to_string() which returns "": ?? then moves to the next field.
            lvl = downcase(string(.app_level) ?? string(.severity) ?? "")
            # PostgreSQL: the collector sets WARN by default on LOG: lines and on
            # continuation lines; the real level is in the "[pid] LEVEL:" prefix.
            if .ak_component == "postgresql" {
              m, err = parse_regex(string(.body) ?? "", r'\[\d+\] (?P<l>[A-Z0-9]+):')
              pg = if err == null { m.l } else { "" }
              if pg == "WARNING" {
                lvl = "warning"
              } else if pg == "ERROR" {
                lvl = "error"
              } else if pg == "FATAL" || pg == "PANIC" {
                lvl = "critical"
              } else {
                lvl = "info"
              }
            }
            # One vocabulary: warn -> warning, fatal/panic -> critical.
            if lvl == "warn" { lvl = "warning" }
            if lvl == "fatal" || lvl == "panic" { lvl = "critical" }
            .ak_level = lvl

            ip = string(.app_client_ip) ?? string(.app_remote) ?? ""
            if ip != "" { .ak_client_ip = ip }

            if exists(.app_runtime) {
              rt, err = to_float(.app_runtime)
              if err == null { .ak_runtime_ms = rt }
            }

            path = string(.app_path) ?? ""
            action = string(.app_action) ?? ""
            .ak_action = action
            .ak_user = ""
            if action != "" {
              .ak_kind = "event"
              .ak_user = string(.app_context_username) ?? string(.app_user_username) ?? ""
            } else if starts_with(path, "/outpost.goauthentik.io/") {
              .ak_kind = "forward_auth"
              host = string(.app_host) ?? ""
              if host != "" { .ak_app_host = host }
            } else if contains(path, "/health/") || contains(path, "/-/health/") {
              .ak_kind = "health"
            } else if path != "" {
              .ak_kind = "http"
            } else if exists(.app_task_name) || exists(.app_actor_name) {
              .ak_kind = "task"
            } else {
              .ak_kind = "log"
            }

        # HTTP logs in the journal, as http_* fields:
        # - HAProxy httplog lines (syslog identifier haproxy): client, method,
        #   path (secrets masked), status, bytes, backend, server, total time;
        # - camera-streamer (util/http/http.c) client connections: client, event.
        # Some journald senders (OctoPrint) give MESSAGE as an array of bytes
        # instead of a string: it is decoded first, invalid UTF-8 replaced by
        # U+FFFD.
        parse_http:
          type: remap
          inputs: [route_streams.journald]
          source: |
            if is_array(.body_message) {
              digits = "0123456789abcdef"
              encoded = ""
              for_each(array!(.body_message)) -> |_index, item| {
                byte = to_int(item) ?? 63
                if byte < 0 || byte > 255 { byte = 63 }
                high = to_int(floor(byte / 16))
                low = mod(byte, 16)
                encoded = encoded + "%" + slice!(digits, high, high + 1) + slice!(digits, low, low + 1)
              }
              .body_message = decode_percent(encoded)
            }
            msg = string(.body_message) ?? ""
            ident = string(.body_syslog_identifier) ?? ""

            if ident == "haproxy" {
              # 192.0.2.10:51234 [26/Nov/2026:10:00:00.123] fe~ be/srv 0/0/1/5/6 200 1234 - - ---- 1/1/0/0/0 0/0 "GET /path HTTP/1.1"
              h, err = parse_regex(msg, r'^(?P<ip>[0-9A-Fa-f.:]+):\d+ \[[^\]]+\] (?P<frontend>\S+) (?P<backend>[^/\s]+)/(?P<server>\S+) -?\d+/-?\d+/-?\d+/-?\d+/\+?(?P<ta>-?\d+) (?P<status>-?\d+) \+?(?P<bytes>\d+) .*?"(?P<method>[A-Z]+) (?P<path>\S+)')
              if err == null {
                .http_client_ip = h.ip
                .http_frontend = h.frontend
                .http_backend = h.backend
                .http_server = h.server
                .http_method = h.method
                # Query secrets already masked by redact_url_secrets.
                .http_path = h.path
                .http_status = to_int(h.status) ?? null
                .http_bytes = to_int(h.bytes) ?? null
                .http_ta_ms = to_int(h.ta) ?? null
              }
            } else if starts_with(msg, "util/http/http.c: ") {
              c, err = parse_regex(msg, r'^util/http/http\.c: (?:\S+: )?Client (?P<event>connected|disconnected) (?P<ip>[0-9A-Fa-f.:]+)')
              if err == null {
                .http_client_ip = c.ip
                .http_event = c.event
              }
            }

        # Proxmox VE daemon logs to their own proxmox stream, with pve_* fields.
        # A journald record that does not come from a Proxmox daemon goes out
        # unchanged, without any pve_* field.
        #
        # Daemons (body_syslog_identifier): pve* (pvedaemon, pveproxy, pvescheduler,
        # pveupdate, pvestatd, pve-ha-lrm, pve-ha-crm, pve-firewall,
        # pve-notify-worker...), pmxcfs, proxmox-*, vzdump, qmeventd, spiceproxy.
        #
        # Fields added, on every Proxmox record (empty when they do not apply;
        # VictoriaLogs does not store an empty field):
        #   pve_component  syslog identifier of the daemon
        #   pve_level      critical | error | warning | info | debug (journald priority)
        #   pve_kind       task | backup | auth | notification | ha | log
        #   pve_task_type  task type of the UPID (vzdump, acmerenew, aptupdate, qmstart...)
        #   pve_task_event start | end
        #   pve_task_status OK, or the error message of the finished task
        #   pve_task_failed true when the task ended with anything but OK
        #   pve_user       PVE user (root@pam...)
        #   pve_vmid       VMID (UPID or backup line)
        #   pve_backup_event job_start | vm_start | vm_ok | vm_failed | job_ok | job_failed
        #   pve_duration_s backup duration of a guest in seconds (vm_ok), else 0
        #   pve_auth_result success | failure
        #   pve_client_ip  client IP of an authentication failure
        parse_proxmox:
          type: remap
          inputs: [parse_http]
          source: |
            ident = string(.body_syslog_identifier) ?? ""
            is_pve = starts_with(ident, "pve") ||
              starts_with(ident, "proxmox-") ||
              includes(["pmxcfs", "vzdump", "qmeventd", "spiceproxy"], ident)

            if is_pve {
              .log_stream = "proxmox"
              msg = string(.body_message) ?? ""
              .pve_component = ident

              # Syslog priority: 0-2 critical, 3 error, 4 warning, 5-6 info, 7 debug.
              prio = to_int(.body_priority) ?? 6
              .pve_level = if prio <= 2 {
                "critical"
              } else if prio == 3 {
                "error"
              } else if prio == 4 {
                "warning"
              } else if prio == 7 {
                "debug"
              } else {
                "info"
              }

              .pve_kind = "log"
              .pve_task_type = ""
              .pve_task_event = ""
              .pve_task_status = ""
              .pve_task_failed = false
              .pve_user = ""
              .pve_vmid = ""
              .pve_backup_event = ""
              .pve_auth_result = ""
              .pve_client_ip = ""
              .pve_duration_s = 0

              # Task start and end:
              #   <root@pam> starting task UPID:node:pid:pstart:start:type:id:user:
              #   <root@pam> end task UPID:node:pid:pstart:start:type:id:user: OK | <error>
              task, err = parse_regex(msg, r'^<(?P<user>[^>]+)> (?P<event>starting|end) task UPID:[^:]*:[0-9A-Fa-f]+:[0-9A-Fa-f]+:[0-9A-Fa-f]+:(?P<type>[^:]*):(?P<id>[^:]*):[^:]*:\s*(?P<status>.*)$$')
              if err == null {
                .pve_kind = "task"
                .pve_user = task.user
                .pve_task_type = task.type
                .pve_vmid = task.id
                if task.event == "starting" {
                  .pve_task_event = "start"
                } else {
                  .pve_task_event = "end"
                  .pve_task_status = task.status
                  .pve_task_failed = task.status != "OK"
                }
              }

              # vzdump backups (started by pvescheduler or vzdump).
              if .pve_kind == "log" {
                if match(msg, r'^INFO: starting new backup job') {
                  .pve_kind = "backup"
                  .pve_backup_event = "job_start"
                } else if contains(msg, "Backup job finished successfully") {
                  .pve_kind = "backup"
                  .pve_backup_event = "job_ok"
                } else if match(msg, r'Backup job finished with errors|ERROR: Backup job failed') {
                  .pve_kind = "backup"
                  .pve_backup_event = "job_failed"
                } else {
                  vm, err = parse_regex(msg, r'^(?P<lvl>INFO|ERROR): (?P<what>Starting|Finished) Backup of VM (?P<id>\d+)(?: \((?P<h>\d+):(?P<m>\d+):(?P<s>\d+)\))?')
                  if err == null {
                    .pve_kind = "backup"
                    .pve_vmid = vm.id
                    if vm.what == "Starting" {
                      .pve_backup_event = "vm_start"
                    } else {
                      .pve_backup_event = "vm_ok"
                      if vm.h != null {
                        .pve_duration_s = (to_int(vm.h) ?? 0) * 3600 + (to_int(vm.m) ?? 0) * 60 + (to_int(vm.s) ?? 0)
                      }
                    }
                  } else {
                    fail, err = parse_regex(msg, r'^ERROR: Backup of VM (?P<id>\d+) failed')
                    if err == null {
                      .pve_kind = "backup"
                      .pve_vmid = fail.id
                      .pve_backup_event = "vm_failed"
                    }
                  }
                }
                if .pve_backup_event == "job_failed" || .pve_backup_event == "vm_failed" {
                  .pve_level = "error"
                }
              }

              # API and web UI authentication.
              if .pve_kind == "log" {
                ok, err = parse_regex(msg, r'^<[^>]+> successful auth for user \x27(?P<user>[^\x27]+)\x27')
                if err == null {
                  .pve_kind = "auth"
                  .pve_auth_result = "success"
                  .pve_user = ok.user
                } else {
                  ko, err = parse_regex(msg, r'authentication failure; rhost=(?:::ffff:)?(?P<ip>\S+) user=(?P<user>\S+)')
                  if err == null {
                    .pve_kind = "auth"
                    .pve_auth_result = "failure"
                    .pve_client_ip = ko.ip
                    .pve_user = ko.user
                    if .pve_level == "info" { .pve_level = "warning" }
                  }
                }
              }

              if .pve_kind == "log" {
                if ident == "pve-notify-worker" {
                  .pve_kind = "notification"
                } else if starts_with(ident, "pve-ha-") {
                  .pve_kind = "ha"
                }
              }
            }

        parse_syslog:
          type: remap
          inputs: [syslog_udp]
          source: |
            parsed, err = parse_syslog(string!(.message))
            if err == null {
              # Device clocks drift and RFC 3164 has no year: the receive time
              # stays the record time, the device time is kept as syslog_timestamp.
              parsed.syslog_timestamp = del(parsed.timestamp)
              . = merge(., parsed)
              # RFC 5424 lets a sender put a UTF-8 BOM before the message
              # (Synology DSM does): it would end up as the first character
              # of _msg and break prefix matches.
              if is_string(.message) {
                .message = replace(string!(.message), r'^\x{FEFF}', "")
              }
            } else {
              .parse_error = err
            }
            # UniFi CEF events. parse_syslog reads "CEF" as the appname and leaves
            # "0|Ubiquiti|..." in message, so the "CEF:" prefix is put back before
            # parsing. message stays untouched: the alerts match on it.
            raw = string(.message) ?? ""
            cef_input = if .appname == "CEF" { "CEF:" + raw } else { raw }
            if contains(cef_input, "CEF:") {
              cef, cef_err = parse_cef(cef_input)
              if cef_err == null {
                .cef_version = del(cef.cefVersion)
                .cef_vendor = del(cef.deviceVendor)
                .cef_product = del(cef.deviceProduct)
                .cef_product_version = del(cef.deviceVersion)
                .cef_signature_id = del(cef.deviceEventClassId)
                .cef_name = del(cef.name)
                # Numeric (0-10) for UniFi. CEF also allows Low/Medium/High/Very-High:
                # kept apart so that cef_severity always has the same type.
                cef_severity = del(cef.severity)
                .cef_severity = to_int(cef_severity) ?? null
                if .cef_severity == null {
                  .cef_severity_label = cef_severity
                }
                # Extension keys become cef_ext_<key in lower case> (UNIFIcategory
                # -> cef_ext_unificategory, src -> cef_ext_src): they follow the
                # lower case + prefix convention and never overwrite a field of
                # the event (src, msg, appname...).
                ext = map_keys(cef) -> |key| { "cef_ext_" + replace(downcase(key), r'[^a-z0-9_]', "_") }
                . = merge(., ext)
              } else {
                .cef_parse_error = cef_err
              }
            }
            # UniFi gateway firewall logs (iptables LOG lines with the rule as prefix):
            # [LAN_WAN-D-40001] DESCR="block-dns" IN=br0 OUT=eth6 SRC=... PROTO=UDP DPT=53 LEN=40
            # Fields get a fw_ prefix: they never collide with the CEF src/dst/proto.
            # message stays untouched.
            fw, fw_err = parse_regex(raw, r'^\[(?P<rule>(?P<ruleset>[A-Za-z0-9_]+)-(?P<code>[A-Z])-(?P<rule_id>\d+))\]\s+(?P<fields>.*SRC=.*)$$')
            if fw_err == null {
              # The quoted original packet of ICMP errors ("[SRC=... ]") would repeat
              # the keys of the packet itself: it is dropped from the fields.
              fields = replace(string!(fw.fields), r'\s*\[[^\]]*\]', "")
              # An empty value ("OUT= MAC=...") would make parse_key_value read the
              # next pair as its value: it is written as "" first.
              fields = replace(fields, "= ", "=\"\" ")
              if ends_with(fields, "=") {
                fields = fields + "\"\""
              }
              # LEN appears twice: IP length before PROTO=, layer 4 length after it.
              parts = split(fields, " PROTO=", limit: 2)
              ip_kv = parse_key_value(string!(parts[0]), key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true) ?? {}
              l4_kv = {}
              if length(parts) == 2 {
                l4_kv = parse_key_value("PROTO=" + string!(parts[1]), key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true) ?? {}
                if exists(l4_kv.LEN) {
                  l4_kv.L4_LEN = del(l4_kv.LEN)
                }
              }
              kv = map_keys(merge(ip_kv, l4_kv)) -> |key| { "fw_" + downcase(key) }
              kv.fw_rule = fw.rule
              kv.fw_ruleset = fw.ruleset
              kv.fw_rule_id = to_int(fw.rule_id) ?? fw.rule_id
              kv.fw_action_code = fw.code
              kv.fw_action = if fw.code == "A" { "accept" } else if fw.code == "D" { "drop" } else if fw.code == "R" { "reject" } else { fw.code }
              # Numbers that are queried by range or summed; the rest stays a string.
              for_each(["fw_spt", "fw_dpt", "fw_len", "fw_l4_len", "fw_ttl", "fw_hoplimit"]) -> |_index, name| {
                value = get(kv, [name]) ?? null
                if is_string(value) {
                  kv = set!(kv, [name], to_int(value) ?? value)
                }
              }
              . = merge(kv, .)
            }
            # host_name (FQDN, as in the streams of the hosts) and device_vendor
            # from the VECTOR_SYSLOG_SENDERS table, by source IP. A sender not
            # listed is named by its syslog hostname, else by its IP. A short
            # hostname gets the VECTOR_SYSLOG_DOMAIN suffix when it is set, so
            # that the same device has one host_name whether listed or not.
            senders = object(parse_json(s'${VECTOR_SYSLOG_SENDERS:-}') ?? {}) ?? {}
            sender = object(get(senders, [to_string(.source_ip) ?? ""]) ?? {}) ?? {}
            .host_name = sender.name
            if !is_string(.host_name) {
              hostname = downcase(to_string(.hostname) ?? "")
              domain = downcase(s'${VECTOR_SYSLOG_DOMAIN:-}')
              if hostname == "" || hostname == "-" {
                .host_name = .source_ip
              } else if domain != "" && !contains(hostname, ".") && !is_ipv4(hostname) {
                .host_name = hostname + "." + domain
              } else {
                .host_name = hostname
              }
            }
            if is_string(sender.vendor) {
              .device_vendor = sender.vendor
            }
            # Gateway firewall logs get their own stream: they outnumber the rest
            # of syslog and have their own fields.
            .log_stream = if exists(.fw_rule) { "firewall" } else { "syslog" }
            del(.source_type)

        # One level field for every stream: debug, info, warn, error or crit.
        # The sources each have their own (ak_level, pve_level, the journald
        # priority, the syslog or OTLP severity); the error panels and queries
        # filter on level instead. An event with no usable source has none.
        normalize_level:
          type: remap
          inputs:
            - route_streams._unmatched
            - route_authentik._unmatched
            - parse_authentik
            - parse_proxmox
            - parse_syslog
          source: |
            text = ""
            if is_string(.ak_level) {
              text = string!(.ak_level)
            } else if is_string(.pve_level) {
              text = string!(.pve_level)
            }
            # journald priority (0-7), as a number or a string.
            priority = -1
            if is_string(.body_priority) || is_integer(.body_priority) {
              priority = to_int(.body_priority) ?? -1
            }
            if text == "" && priority >= 0 && priority <= 7 {
              text = if priority <= 2 { "crit" } else if priority == 3 { "error" } else if priority == 4 { "warn" } else if priority <= 6 { "info" } else { "debug" }
            }
            # Syslog keyword (err, warning, notice...) or OTLP severity text (Error, WARN...).
            if text == "" && is_string(.severity) {
              text = string!(.severity)
            }
            text = downcase(strip_whitespace(text))
            level = ""
            if match(text, r'^(emerg|alert|crit|fatal|panic)') {
              level = "crit"
            } else if match(text, r'^err') {
              level = "error"
            } else if match(text, r'^warn') {
              level = "warn"
            } else if match(text, r'^(info|notice)') {
              level = "info"
            } else if match(text, r'^(debug|trace)') {
              level = "debug"
            }
            # OTLP severity number: 1-8 trace/debug, 9-12 info, 13-16 warn,
            # 17-20 error, 21-24 fatal.
            if level == "" && is_integer(.severity_number) {
              number = int!(.severity_number)
              level = if number >= 21 { "crit" } else if number >= 17 { "error" } else if number >= 13 { "warn" } else if number >= 9 { "info" } else if number >= 1 { "debug" } else { "" }
            }
            # CEF severity (0-10) of the UniFi events.
            if level == "" && is_integer(.cef_severity) {
              number = int!(.cef_severity)
              level = if number >= 9 { "crit" } else if number >= 7 { "error" } else if number >= 4 { "warn" } else { "info" }
            }
            # The level written in the line itself, by the formats seen in the
            # logs (colour codes removed first):
            #   logfmt or JSON   level=info, "level":"warn" (step-ca...)
            #   zerolog console  <time> ERR ... (Traefik, Portainer)
            #   Go log           ...func1() [I] ... (Forgejo: T D I W E F)
            #   NestJS           [Nest] 59 - <date>    LOG [Context] (Immich)
            #   bracket, colon   [debug][Jobs] (Seerr), [MONITOR] INFO: (Uptime Kuma)
            #   Redis            1:M 27 Nov 2026 00:00:02.724 * (. - * #)
            if level == "" {
              line = string(.body) ?? string(.body_message) ?? string(.message) ?? ""
              line = replace(truncate(line, 300), r'\x1b\[[0-9;]*m', "")
              found = parse_regex(line, r'(?i)\b(?:level|lvl)"?\s*[=:]\s*"?(?P<w>[a-z]+)') ??
                parse_regex(line, r'^(?:\S+\s+){0,2}(?P<w>TRC|DBG|INF|WRN|ERR|FTL|PNC)\s') ??
                parse_regex(line, r'\s\[(?P<w>[TDIWEF])\]\s') ??
                parse_regex(line, r'^\[Nest\].*?\s(?P<w>LOG|VERBOSE|DEBUG|WARN|ERROR|FATAL)\s') ??
                parse_regex(line, r'(?i)\[(?P<w>trace|debug|info|notice|warn|warning|error|fatal|critical)\]') ??
                parse_regex(line, r'\b(?P<w>TRACE|DEBUG|INFO|NOTICE|WARN|WARNING|ERROR|FATAL|CRITICAL):\s') ??
                parse_regex(line, r'^\d+:[XCSM] \d{1,2} \w{3} \d{4} [\d:.]+ (?P<r>[.*#-]) ') ??
                {}
              word = downcase(string(found.w) ?? "")
              marker = string(found.r) ?? ""
              if match(word, r'^(emerg|alert|crit|critical|fatal|panic|ftl|pnc|f)$$') {
                level = "crit"
              } else if match(word, r'^(err|error|e)$$') {
                level = "error"
              } else if match(word, r'^(warn|warning|wrn|w)$$') || marker == "#" {
                level = "warn"
              } else if match(word, r'^(info|notice|log|inf|i)$$') || marker == "*" {
                level = "info"
              } else if match(word, r'^(debug|trace|verbose|dbg|trc|d|t)$$') || marker == "." || marker == "-" {
                level = "debug"
              }
            }
            # Every record gets a level: one without any (an AdGuard query, a
            # line that says nothing of its level) is info.
            .level = if level != "" { level } else { "info" }
            # Known benign messages, logged as warnings or errors by their
            # source, become info so the error panels show real problems only.
            # Each match is narrow (source and text): any other message of the
            # same source keeps its level.
            if .level == "warn" || .level == "error" || .level == "crit" {
              line = string(.body) ?? string(.body_message) ?? string(.message) ?? ""
              line = replace(truncate(line, 300), r'\x1b\[[0-9;]*m', "")
              container = string(.container_name) ?? ""
              vendor = string(.device_vendor) ?? ""
              benign = false
              # Portainer: the docker CLI progress (Pulling, Pulled...) written
              # to stderr with an unknown level (???). A progress line that
              # reports a failure (pull access denied...) keeps its level.
              if container == "portainer" && match(line, r'^\S+ \S+ \?\?\? ') && !match(line, r'(?i)\b(error|denied|failed|unhealthy)\b') {
                benign = true
              }
              # UniFi access points and switches: Wi-Fi driver chatter (station
              # left, multicast counters) sent as kernel warnings. A kernel
              # WARN_ON backtrace or a failing radio keeps its level.
              if vendor == "unifi" && (string(.severity) ?? "") == "warning" && match(string(.appname) ?? "", r'^[0-9a-f]{12},') && starts_with(line, "kernel: ") && !match(line, r'(?i)WARNING:|call trace|cut here|oops|bug|timeout|stuck|crash|fail|error') {
                benign = true
              }
              # UniFi gateway: the internal DNS helper socket of the
              # unifi-mq-broker, and systemd generator notices.
              if vendor == "unifi" && contains(line, "unifi-mq-broker") && contains(line, "Failed to send request to coredns") {
                benign = true
              }
              if vendor == "unifi" && contains(line, "systemd-sysv-generator") {
                benign = true
              }
              # Beszel agent: memory stats the cgroup does not provide.
              if container == "beszel-agent" && contains(line, "bad memory stats - see https://github.com/henrygd/beszel/issues/") {
                benign = true
              }
              # Immich machine learning: ONNX runtime model shape notice.
              if container == "immich_machine_learning" && contains(line, "[W:onnxruntime:") && contains(line, "MergeShapeInfo") {
                benign = true
              }
              # Grafana: a query or job stopped because the browser left.
              if container == "victoria-grafana" && contains(line, "context canceled") {
                benign = true
              }
              if benign {
                .level = "info"
              }
            }

      sinks:
        victorialogs:
          type: http
          inputs:
            - normalize_level
            - alert_rules
          # _stream_fields: what a stream is (few values each); _msg_field: the
          # first non-empty one becomes _msg; _time_field: the record time.
          uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=log_stream,host_name,container_name&_msg_field=body,body_message,message&_time_field=timestamp"
          method: post
          request:
            headers:
              # Without it VictoriaLogs answers 200 and stores nothing.
              Content-Type: application/x-ndjson
          encoding:
            codec: json
            timestamp_format: rfc3339
          framing:
            method: newline_delimited
          batch:
            max_events: 1000
            # At a few events per second a batch never fills, so every OTLP
            # request waits for this timeout before its answer: keep it short.
            timeout_secs: 1
          # The OTLP source answers the collector once the batch is written:
          # while VictoriaLogs is down the collectors keep their own queue and
          # retry, instead of Vector losing what it holds in memory.
          acknowledgements:
            enabled: true
          # VictoriaLogs may still be starting; events are retried, not lost.
          healthcheck:
            enabled: false

        # Free Mobile SMS API: one POST per SMS with a JSON body {user, pass,
        # msg}. 200: sent; 400: missing parameter; 402: too many SMS; 403:
        # option off or wrong credentials; 500: server error (retried).
        free_mobile:
          type: http
          inputs:
            - sms_message
          uri: https://smsapi.free-mobile.fr/sendmsg
          method: post
          request:
            headers:
              Content-Type: application/json
            retry_attempts: 3
            timeout_secs: 10
          encoding:
            codec: json
          # One event per request, as a bare JSON object (no array, no newline).
          framing:
            method: bytes
          batch:
            max_events: 1
          # alertmanager gets its answer once the SMS is accepted: on a failure
          # it retries the notification itself.
          acknowledgements:
            enabled: true
          # A GET without parameters answers 400; the first SMS shows errors.
          healthcheck:
            enabled: false

        # Scraped by victoriametrics (job vector). Reachable on the victoria
        # and traefik_gateway networks, never routed by Traefik.
        prometheus:
          type: prometheus_exporter
          inputs:
            - vector_metrics
          address: 0.0.0.0:9598
  # Grafana provisioning. The dashboards are generated JSON (one LogsQL or
  # MetricsQL query per panel, see the README).
  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaLogs
          uid: victorialogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victorialogs:9428
          isDefault: true
          editable: false
        - name: VictoriaMetrics
          uid: victoriametrics
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          editable: false
          jsonData:
            prometheusType: Prometheus
            # Longest scrape interval (unpoller, synology, freebox): keeps
            # $$__rate_interval at 4m or more, so a rate always sees 2 samples.
            timeInterval: 60s
  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: victoria
          type: file
          disableDeletion: true
          allowUiUpdates: false
          options:
            path: /etc/grafana/dashboards
            # Each sub-directory becomes a Grafana folder: overview dashboards
            # stay at the root (General), detail ones go in a folder. Links
            # use uids and tags, so moving a file does not break them.
            foldersFromFilesStructure: true
