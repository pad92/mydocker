                "expr": "{log_stream=\"syslog\"} appname:* (\"send deauth\" or \"IEEE 802.11: disassociated\" or \"sta_leave\") | extract_regexp `(RA:\\[|STA |\"mac\":\")(?P<sta>[0-9a-f:]{17})` | filter sta:* | stats by (sta) count() as n, count() if (\"send deauth\") as deauth, count() if (\"disassociated\") as disassoc, count() if (\"sta_leave\") as leave | sort by (n desc) | limit 30"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "topk by (mac) (1, max by (mac, name, ap_name) (tlast_over_time(unpoller_client_uptime_seconds{mac!=\"\"}[$$__range])))",
                "format": "table",
                "instant": true,
                "range": false
              }
            ],
            "transformations": [
              {
                "id": "extractFields",
                "options": {
                  "source": "labels",
