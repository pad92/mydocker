                            "value": 1
                          }
                        ]
                      }
                    }
                  ]
                }
              ]
            },
            "options": {
              "showHeader": true,
              "sortBy": [
                {
                  "displayName": "composant",
                  "desc": false
                }
              ]
            },
            "id": 25,
            "gridPos": {
              "x": 0,
              "y": 65,
              "w": 24,
              "h": 8
            }
          }
