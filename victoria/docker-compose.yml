            "description": "Défauts de page majeurs (lecture sur disque) et pages échangées avec le swap. Une activité de swap soutenue signale un manque de mémoire, même si la mémoire utilisée paraît stable.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (host_name) (rate(system_paging_faults_total{host_name=~\"$$host_name\", type=\"major\"}[$$__rate_interval]))",
                "legendFormat": "{{host_name}} défauts majeurs",
                "range": true
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (host_name, direction) (rate(system_paging_operations_total{host_name=~\"$$host_name\", type=\"major\"}[$$__rate_interval]))",
                "legendFormat": "{{host_name}} swap {{direction}}",
                "range": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "lineWidth": 1,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "id": 17,
            "gridPos": {
              "x": 0,
              "y": 40,
              "w": 12,
              "h": 8
            }
          },
          {
            "type": "timeseries",
            "title": "Processus bloqués et actifs",
            "description": "Processus en cours d'exécution et processus bloqués (en attente d'E/S, état D). Des processus bloqués en continu désignent un disque ou un montage réseau lent.",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
