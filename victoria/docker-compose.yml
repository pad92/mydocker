                    "sta": 1,
                    "unifi_ap": 2,
                    "n": 3,
                    "deauth": 4,
                    "disassoc": 5,
                    "leave": 6
                  },
                  "renameByName": {
                    "unifi_name": "client",
                    "sta": "MAC",
                    "unifi_ap": "dernier AP",
                    "n": "lignes de log",
                    "deauth": "kicks (deauth)",
                    "disassoc": "désassociations",
                    "leave": "départs"
                  },
                  "excludeByName": {}
                }
