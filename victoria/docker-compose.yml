                    }
                  ],
                  "fields": {}
                },
                "filter": {
                  "id": "byRefId",
                  "options": "A"
                }
              },
              {
                "id": "organize",
                "filter": {
                  "id": "byRefId",
                  "options": "B"
                },
                "options": {
                  "excludeByName": {
                    "Time": true,
                    "Value": true,
                    "Value #B": true
                  },
                  "renameByName": {
                    "mac": "sta",
                    "name": "unifi_name",
                    "ap_name": "unifi_ap"
                  },
                  "indexByName": {}
                }
              },
              {
                "id": "joinByField",
                "options": {
                  "byField": "sta",
                  "mode": "outerTabular"
                }
              },
              {
                "id": "filterByValue",
                "options": {
                  "type": "exclude",
                  "match": "any",
                  "filters": [
                    {
                      "fieldName": "n",
                      "config": {
