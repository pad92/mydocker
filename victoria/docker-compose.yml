              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "victoriametrics"
                },
                "editorMode": "code",
                "expr": "sum by (host_name, status) (system_processes_count{host_name=~\"$$host_name\", status=~\"running|blocked\"})",
                "legendFormat": "{{host_name}} {{status}}",
                "range": true
              }
            ],
            "fieldConfig": {
