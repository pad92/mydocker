x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      - ${KARAKEEP_DATA_DIR}:/data

    environment:
      MEILI_ADDR: "${MEILI_ADDR}"
      BROWSER_WEB_URL: "${BROWSER_WEB_URL}"
      DATA_DIR: "${DATA_DIR}" # DON'T CHANGE THIS
    networks:
      - traefik_gateway

    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.karakeep.loadbalancer.server.port: "3000"
      traefik.http.routers.karakeep.rule: "Host(`${TRAEFIK_HOST_PUBLIC}`)"
      traefik.http.routers.karakeep.middlewares: 'x-powered-by'
      traefik.http.middlewares.x-powered-by.headers.customresponseheaders.Server: ''
      traefik.http.middlewares.x-powered-by.headers.customresponseheaders.X-Powered-By: ''

    logging: *default-logging
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - karakeep

    logging: *default-logging
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped

    environment:
      MEILI_NO_ANALYTICS: "${MEILI_NO_ANALYTICS}"
    volumes:
      - ${KARAKEEP_MEILISEARCH_DATA_DIR}:/meili_data
    networks:
      - karakeep

    logging: *default-logging
networks:
  karakeep:
    name: karakeep
  traefik_gateway:
    external: true
