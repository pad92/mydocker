x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  shaarli:
    container_name: shaarli
    image: shaarli/shaarli:latest
    restart: unless-stopped
    volumes:
      - ${BOOKMARKS_SHAARLI_CACHE_DATA_DIR}:/var/www/shaarli/cache
      - ${BOOKMARKS_SHAARLI_DATA_DIR}:/var/www/shaarli/data
    networks:
      - traefik_gateway

    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_gateway"
      traefik.http.services.shaarli.loadbalancer.server.port: "80"

      traefik.http.routers.shaarli-pub-http.rule: "Host(`${TRAEFIK_HOST_PUBLIC}`)"
      traefik.http.routers.shaarli-pub-http.entrypoints: web
      traefik.http.routers.shaarli-pub-http.middlewares: 'shaarli-redirect-https,x-powered-by'
      traefik.http.middlewares.shaarli-redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.shaarli-redirect-https.redirectscheme.permanent: true

      traefik.http.routers.shaarli-pub.rule: "Host(`${TRAEFIK_HOST_PUBLIC}`)"
      traefik.http.routers.shaarli-pub.entrypoints: websecure
      traefik.http.routers.shaarli-pub.middlewares: 'x-powered-by'
      traefik.http.routers.shaarli-pub.tls: "true"
      traefik.http.routers.shaarli-pub.tls.certresolver: stepca
      traefik.http.middlewares.x-powered-by.headers.customresponseheaders.Server: ''
      traefik.http.middlewares.x-powered-by.headers.customresponseheaders.X-Powered-By: ''

    logging: *default-logging
networks:
  traefik_gateway:
    external: true
