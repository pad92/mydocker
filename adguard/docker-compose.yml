  adguardhome-sync:
    image: linuxserver/adguardhome-sync:latest
    container_name: adguard-sync
    environment:
      LOG_LEVEL: "${LOG_LEVEL}"
      ORIGIN_URL: "${ORIGIN_URL}"
      ORIGIN_USERNAME: "${ADGUARD_USER}"
      ORIGIN_PASSWORD: "${ADGUARD_PASSWD}"
      REPLICA1_URL: "${REPLICA1_URL}"
      REPLICA1_USERNAME: "${ADGUARD_USER}"
      REPLICA1_PASSWORD: "${ADGUARD_PASSWD}"
      REPLICA1_DHCP_SERVER_ENABLED: "${REPLICA1_DHCP_SERVER_ENABLED}"
      # REPLICA1_WEB_URL: "http://192.168.0.1:8080" # used in the web interface (default: <replica-url>
      CRON: "${CRON}"
      RUN_ON_START: "${RUN_ON_START}"
